_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
training_behavior:
  _target_: egomimic.pl_utils.oat_training.OATTrainingBehavior
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
    - _target_: egomimic.pipeline.stages_oat.OATTokenizerStage
      tokenizer:
        _target_: egomimic.models.oat.factory.make_tokenizer
        action_dim: 7
        horizon: ${benchmark.horizon}
        num_registers: 8
        levels: [8, 5, 5, 5]
        emb_dim: 256
        head_dim: 64
        encoder_depth: 2
        decoder_depth: 4
        dropout: 0.1
        token_dropout_mode: pow2
        use_causal_decoder: true
benchmark_protocol:
  suite: ${benchmark.suite}
  horizon: ${benchmark.horizon}
  n_obs_steps: ${benchmark.n_obs_steps}
  n_action_steps: ${benchmark.n_action_steps}
