# Seven-embodiment articulated co-train sweep, ideal control mode.
#
# Corpus: s3://rldb/staged/pushshapes_articulated/articulated-20260909/
#   162,000 episodes = 9 embodiments x 6 control modes x 3,000.
#   This job stages the IDEAL cells of the SEVEN training embodiments only:
#     u_socket gripper chain_gripper suction triangle flipper spring
#   umi and scoop are the held-out generalization set. They are never staged
#   here and appear in no train or valid dataset, and the job asserts their
#   absence rather than trusting the config.
#
# Cells (all Paper-DP: DDPM-100, obs horizon 2, EMA, batch 32, 260M):
#   artic_cotrain7_arc_dur_D80_M56_R26deg   duration token, M=56
#   artic_cotrain7_arc_stk_D80_M56_R26deg   velocity token, M=56
#   artic_cotrain7_arc_dur_D80_M16_R26deg   duration token, M=16
#   artic_cotrain7_arc_stk_D80_M16_R26deg   velocity token, M=16
#   artic_cotrain7_dp_paper                 no codec (baseline)
# The four ARC cells differ from each other in exactly three lines (name,
# description, arc_waypoints/transform_target), and from the baseline in the
# action representation alone.
#
# Needs both repos: EgoVerse-graph owns the ARC modules and the policy;
# the corpus is R2-side. Archives are <emb>/ideal/<emb>/shard{000..023}.tar,
# 24 shards x 125 episodes per cell.

workflow:
  name: "{{job_name}}"

  tasks:
  - name: train
    image: nvcr.io/nvidia/pytorch:25.06-py3

    credentials:
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-aws:
        AWS_ACCESS_KEY_ID: aws_access_key_id
        AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        AWS_DEFAULT_REGION: aws_region
      egoverse-wandb:
        WANDB_API_KEY: wandb_api_key

    environment:
      BRANCH: "{{branch}}"
      EXPERIMENTS: "{{experiments}}"
      GPUS_PER_RUN: "{{gpus_per_run}}"
      JOB_NAME: "{{job_name}}"
      WANDB_ENTITY: "{{wandb_entity}}"
      MAX_STEPS: "{{max_steps}}"
      CKPT_EVERY: "{{ckpt_every}}"
      BATCH_SIZE: "{{batch_size}}"
      WORKDIR: /workspace
      CORPUS: s3://rldb/staged/pushshapes_articulated/articulated-20260909
      EXP_GROUP: pusht
      # Validation cost scales with the number of co-trained domains. At
      # limit_val_batches=80 across SEVEN domains, each pass took 4.3 h of
      # DDPM-100 sampling at 260M -- 73% of wall-clock, projecting 5.8 days per
      # run. It is diagnostic only here (monitor is None, so it selects no
      # checkpoint), so it is cut rather than the step budget.
      # Name of a previous job whose checkpoints should be resumed from, or
      # empty for a fresh start. This sweep has been preempted twice
      # ("Killing: Stopping container"), losing 8+ h each time because the
      # launcher could only start from zero. Checkpoints already sync to R2
      # every 7 min; this makes them usable.
      RESUME_JOB: "{{resume_job}}"
      VAL_BATCHES: "{{val_batches}}"
      VAL_INTERVAL: "{{val_interval}}"
      TRAIN_EMB: "u_socket gripper chain_gripper suction triangle flipper spring"
      HELD_EMB: "umi scoop"
      SHARDS: "24"
      PER_EMB_EPISODES: "3000"
      NCCL_DEBUG: WARN
      TOKENIZERS_PARALLELISM: "false"
      HYDRA_FULL_ERROR: "1"

    command: ["bash"]
    args: ["/tmp/entry.sh"]

    files:
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        exec > >(tee /tmp/entry_script.log) 2>&1
        set -euxo pipefail

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          git curl unzip ca-certificates build-essential \
          libgl1 libglib2.0-0 libegl1 libosmesa6 ffmpeg

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"

        curl -sSfL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
          | tar xz -C /usr/local/bin s5cmd

        curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws

        mkdir -p "$WORKDIR" && cd "$WORKDIR"
        git clone --depth 1 --branch "$BRANCH" --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse-graph.git" EgoVerse-graph
        cd "$WORKDIR/EgoVerse-graph"
        git rev-parse HEAD

        # Cheap existence check first, so a typo'd experiment name fails in
        # seconds rather than after uv sync.
        for EXP in $EXPERIMENTS; do
          F="egomimic/hydra_configs/experiment/pusht/${EXP}.yaml"
          test -f "$F" || { echo "FATAL: $F missing on $BRANCH"; exit 1; }
        done

        uv sync --frozen
        source .venv/bin/activate

        # The real gate. An earlier version of this job grepped the experiment
        # YAML for "rotation_distance_unit" and failed every ARC arm, because in
        # this config family the wiring lives in the DATA config -- the text was
        # in the right repo and the wrong file. Worse, a passing grep would have
        # proved nothing anyway: the original bug was a factory that accepted
        # the kwarg through **_kwargs and dropped it, so the YAML read correctly
        # while every R cell tokenized identically.
        #
        # So this asserts against constructed OBJECTS instead: it composes each
        # config, instantiates every transform list, checks D/M/R actually
        # landed on the tokenizer, verifies that changing R changes the token,
        # builds the pipeline graph, and pushes a real token through the
        # denoiser. It also fails if any held-out embodiment reaches a dataset.
        # EXPERIMENTS holds bare names; trainHydra wants them group-qualified.
        # Define the qualified list ONCE here and use it for both the gate and
        # the training invocations -- the first version of this gate passed the
        # bare names and failed with "Could not find experiment/<name>", which is
        # the gate and the runner disagreeing about the same string.
        QUALIFIED=""
        for EXP in $EXPERIMENTS; do QUALIFIED="$QUALIFIED $EXP_GROUP/$EXP"; done
        echo "gating: $QUALIFIED"

        python tools/preflight_experiment_configs.py --holdout $HELD_EMB -- $QUALIFIED \
          || { echo "FATAL: config preflight failed"; exit 1; }

        bash ./egomimic/utils/aws/setup_secret.sh
        test -s "$HOME/.egoverse_env"
        set -a; source "$HOME/.egoverse_env"; set +a

        python - <<'PY'
        import os, sys, wandb
        entity = os.environ["WANDB_ENTITY"]
        api = wandb.Api()
        teams = [t if isinstance(t, str) else getattr(t, "name", str(t))
                 for t in (getattr(api.viewer, "teams", None) or [])]
        ents = sorted({e for e in (api.default_entity, *teams) if e})
        print(f"wandb user={api.viewer.username} entities={ents}")
        if entity not in ents:
            sys.exit(f"FATAL: wandb key has no access to '{entity}'. Accessible: {ents}")
        print(f"wandb entity '{entity}' OK")
        PY

        ulimit -n 65536 || true

        # ------------------------------------------- stage the seven cells
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        unset AWS_SESSION_TOKEN

        ROOT=/workspace/articulated
        mkdir -p "$ROOT/tars" "$ROOT/raw" "$ROOT/cells/ideal"

        # s5cmd floods the osmo log rate limiter and the real error gets
        # dropped, so its output goes to a file.
        for EMB in $TRAIN_EMB; do
          s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
            cp "$CORPUS/$EMB/ideal/$EMB/*.tar" "$ROOT/tars/$EMB/" \
            >>/tmp/stage.log 2>&1 || { echo "FATAL: staging $EMB failed"; tail -40 /tmp/stage.log; exit 1; }
          echo "staged $EMB: $(ls "$ROOT/tars/$EMB" | wc -l) archives"
        done

        # Extract, then build the flat view LocalEpisodeResolver reads. The
        # per-shard episode index restarts at zero, so the shard name has to be
        # in the link name or 24 shards collapse onto 125 episodes. This is the
        # same convention articulation_download uses.
        for EMB in $TRAIN_EMB; do
          for T in "$ROOT/tars/$EMB"/*.tar; do
            SH=$(basename "$T" .tar)
            mkdir -p "$ROOT/raw/$EMB/$SH"
            tar -xf "$T" -C "$ROOT/raw/$EMB/$SH"
          done
          VIEW="$ROOT/cells/ideal/$EMB"
          mkdir -p "$VIEW"
          # -mindepth 1 so a shard dir is never linked as if it were an episode.
          find "$ROOT/raw/$EMB" -mindepth 1 -type d -name 'episode_*.zarr' -print0 \
            | while IFS= read -r -d '' EP; do
                SH=$(basename "$(dirname "$EP")")
                # Must start with episode_: episode_budget.py globs
                # episode_*.zarr, and the shard prefix has to go AFTER it
                # because the per-shard episode index restarts at zero.
                B=$(basename "$EP")
                ln -sfn "$EP" "$VIEW/episode_${SH}_${B#episode_}"
              done
          N=$(find "$VIEW" -maxdepth 1 -mindepth 1 -name 'episode_*.zarr' | wc -l)
          echo "  $EMB -> $N episodes in the flat view"
          if [ "$N" -ne "$PER_EMB_EPISODES" ]; then
            echo "FATAL: $EMB has $N episodes, expected $PER_EMB_EPISODES"; exit 1
          fi
          rm -rf "$ROOT/tars/$EMB"
        done

        # The held-out pair must not exist on disk at all. A stray directory
        # here would be invisible in the logs but would make the
        # generalization claim false.
        for EMB in $HELD_EMB; do
          if [ -e "$ROOT/cells/ideal/$EMB" ] || [ -e "$ROOT/raw/$EMB" ]; then
            echo "FATAL: held-out embodiment $EMB was staged"; exit 1
          fi
        done
        echo "holdout guard: umi and scoop are absent from the training root"
        du -sh "$ROOT/raw"

        ROOT_OV="planar.articulated_root=$ROOT"

        # ------------------------------------------ checkpoint persistence
        cat > /tmp/ckpt_sync.sh <<'CSEOF'
        #!/bin/bash
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        DEST="s3://rldb/staged/articulated_cotrain/$1"
        while true; do
          for d in $(find /workspace/EgoVerse-graph/logs -type d -name checkpoints 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
              sync "$d/" "$DEST/$RN/checkpoints/" >>/tmp/ckpt_sync.log 2>&1
          done
          for f in $(find /workspace/EgoVerse-graph/logs -name norm_stats.json 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$f")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp "$f" "$DEST/$RN/norm_stats.json" >>/tmp/ckpt_sync.log 2>&1
          done
          sleep 420
        done
        CSEOF
        chmod +x /tmp/ckpt_sync.sh
        (setsid nohup /tmp/ckpt_sync.sh "$JOB_NAME" >/dev/null 2>&1 &)

        drain_pids () {
          for dp in $1; do
            while kill -0 "$dp" 2>/dev/null; do sleep 30; done
          done
        }

        # ------------------------------------------- resume (optional)
        # The logs dir is named after the config's `name:`, which is NOT the
        # experiment filename (artic_cotrain7_x -> artic_c7_x), so read it from
        # the YAML rather than transforming the string.
        RESUME_ROOT=/workspace/resume
        declare -A RESUME_CKPT RESUME_NORM
        if [ -n "${RESUME_JOB:-}" ]; then
          for EXP in $EXPERIMENTS; do
            RN=$(grep -m1 '^name:' "egomimic/hydra_configs/experiment/$EXP_GROUP/${EXP}.yaml" \
                 | awk '{print $2}')
            [ -n "$RN" ] || { echo "FATAL: no name: in ${EXP}.yaml"; exit 1; }
            D="$RESUME_ROOT/$EXP"; mkdir -p "$D"
            SRC="s3://rldb/staged/articulated_cotrain/$RESUME_JOB/$RN"
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp \
              "$SRC/checkpoints/last.ckpt" "$D/last.ckpt" >>/tmp/resume.log 2>&1 || true
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp \
              "$SRC/norm_stats.json" "$D/norm_stats.json" >>/tmp/resume.log 2>&1 || true
            if [ -s "$D/last.ckpt" ]; then
              # One line on purpose: a heredoc body has to sit at the YAML
              # block indent, and nesting one inside this if/for silently
              # terminated the block scalar.
              STEP=$(python -c "import sys,torch; print(torch.load(sys.argv[1], map_location='cpu', weights_only=False).get('global_step','?'))" "$D/last.ckpt" 2>/dev/null || echo "?")
              RESUME_CKPT[$EXP]="$D/last.ckpt"
              echo "resume $EXP <- $RN/last.ckpt at global_step $STEP"
            else
              echo "FATAL: RESUME_JOB=$RESUME_JOB set but no checkpoint for $EXP ($RN)"
              tail -20 /tmp/resume.log; exit 1
            fi
            # Reuse the exact stats the checkpoint was trained with rather than
            # recomputing them; recomputation should match but does not have to.
            [ -s "$D/norm_stats.json" ] && RESUME_NORM[$EXP]="$D/norm_stats.json"
          done
        fi

        # ---- phase 1: norm stats, ONE GPU per experiment, no DDP.
        # trainHydra computes stats before trainer.fit, so under DDP rank 1
        # waits at the process-group store while rank 0 does the whole pass and
        # the store gives up at 1800s. Seven co-trained domains make that pass
        # about seven times longer than the u_socket sweep's, so this matters
        # more here, not less.
        BATCH_OV=""
        if [ -n "${BATCH_SIZE:-}" ]; then BATCH_OV="planar.batch_size=$BATCH_SIZE"; fi

        NORM_ROOT=/workspace/norm_cache
        mkdir -p "$NORM_ROOT"
        NPIDS=""
        i=0
        for EXP in $EXPERIMENTS; do
          mkdir -p "$NORM_ROOT/$EXP/norm_stats"
          if [ -n "${RESUME_NORM[$EXP]:-}" ]; then
            cp "${RESUME_NORM[$EXP]}" "$NORM_ROOT/$EXP/norm_stats/norm_stats.json"
            echo "phase 1 skipped for $EXP: reusing the resumed norm stats"
            continue
          fi
          ( CUDA_VISIBLE_DEVICES=$i python egomimic/trainHydra.py \
              +experiment="$EXP_GROUP/$EXP" \
              $ROOT_OV \
              launch_params.gpus_per_node=1 \
              $BATCH_OV \
              norm_stats.save_cache_dir="$NORM_ROOT/$EXP" \
              trainer.max_steps=1 trainer.max_epochs=1 trainer.min_epochs=1 \
              trainer.limit_train_batches=1 trainer.limit_val_batches=0 \
              trainer.num_sanity_val_steps=0 \
              ~logger ~callbacks \
              name="normstats_${EXP}" \
              > "/tmp/norm_${EXP}.log" 2>&1 ) &
          NPIDS="$NPIDS $!"
          i=$((i + 1))
        done
        echo "phase 1: $(echo $NPIDS | wc -w) norm-stats passes, 1 GPU each"
        FIRSTN=$(echo $EXPERIMENTS | awk '{print $1}')
        touch "/tmp/norm_${FIRSTN}.log"; tail -f "/tmp/norm_${FIRSTN}.log" & NTAIL=$!
        drain_pids "$NPIDS"
        kill $NTAIL 2>/dev/null || true

        # cache_stats writes after each embodiment, so an interrupted pass
        # leaves a file covering some domains and not others, and the missing
        # ones would train unnormalized -- normalize() returns the tensor
        # UNCHANGED when it finds no entry, silently and plausibly.
        #
        # The expected domain count comes from the experiment's own
        # data.train_datasets, not a literal 7: the co-train arms have seven
        # domains but a single-embodiment BC baseline has one, and a hardcoded
        # `== 7` rejected every baseline as though its stats were truncated.
        for EXP in $EXPERIMENTS; do
          NJ="$NORM_ROOT/$EXP/norm_stats/norm_stats.json"
          if [ ! -s "$NJ" ]; then
            echo "FATAL: no norm stats for $EXP"; tail -40 "/tmp/norm_${EXP}.log"; exit 1
          fi
          if ! python tools/check_norm_stats.py --experiment "$EXP_GROUP/$EXP" --json "$NJ"; then
            echo "FATAL: norm stats for $EXP do not cover its train domains"; exit 1
          fi
        done
        echo "phase 1 complete: all caches verified over seven domains"

        # ---- phase 2: training, GPUS_PER_RUN each.
        RC=0
        PIDS=""
        i=0
        for EXP in $EXPERIMENTS; do
          LO=$((i * GPUS_PER_RUN))
          DEVS=$(seq -s, $LO $((LO + GPUS_PER_RUN - 1)))
          PORT=$((29500 + i * 17))
          echo "launching $EXP on GPU(s) $DEVS port $PORT"
          ( CUDA_VISIBLE_DEVICES="$DEVS" MASTER_PORT=$PORT \
            python egomimic/trainHydra.py \
              +experiment="$EXP_GROUP/$EXP" \
              $ROOT_OV \
              launch_params.gpus_per_node="$GPUS_PER_RUN" \
              $BATCH_OV \
              norm_stats.precomputed_norm_path="$NORM_ROOT/$EXP/norm_stats/norm_stats.json" \
              trainer.max_steps="$MAX_STEPS" \
              ${RESUME_CKPT[$EXP]:+ckpt_path=${RESUME_CKPT[$EXP]}} \
              trainer.limit_val_batches="$VAL_BATCHES" \
              trainer.val_check_interval="$VAL_INTERVAL" \
              callbacks.model_checkpoint.every_n_epochs=0 \
              +callbacks.model_checkpoint.every_n_train_steps="$CKPT_EVERY" \
              callbacks.model_checkpoint.save_top_k=-1 \
              logger.wandb.entity="$WANDB_ENTITY" \
              > "/tmp/run_${EXP}.log" 2>&1 ) &
          PIDS="$PIDS $!"
          i=$((i + 1))
        done

        FIRST=$(echo $EXPERIMENTS | awk '{print $1}')
        touch "/tmp/run_${FIRST}.log"; tail -f "/tmp/run_${FIRST}.log" & TAILPID=$!
        drain_pids "$PIDS"
        for p in $PIDS; do
          if ! wait $p 2>/dev/null; then RC=1; echo "run pid $p exited nonzero"; fi
        done
        kill $TAILPID 2>/dev/null || true

        echo "================ RESULTS ================"
        for EXP in $EXPERIMENTS; do echo "--- $EXP"; tail -30 "/tmp/run_${EXP}.log" || true; done

        bash -c 'set -a; source "$HOME/.egoverse_env"; set +a
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          for d in $(find /workspace/EgoVerse-graph/logs /workspace/norm_cache -type d \( -name checkpoints -o -name norm_stats \) 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
              sync "$d/" "s3://rldb/staged/articulated_cotrain/'"$JOB_NAME"'/$RN/$(basename $d)/"
          done' || true
        echo "artifacts flushed"
        exit $RC

  resources:
    default:
      cpu: {{cpu}}
      gpu: {{num_gpu}}
      memory: {{memory}}
      storage: {{storage}}

  timeout:
    queue_timeout: 1d
