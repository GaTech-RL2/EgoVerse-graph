# @package _global_
defaults:
  - /experiment/real/fold_and_stack_towels/variants/abc_rl2_towels_abcdit_multistream_visual_openloop
  # Shared parents supply task settings; these links select every component.
  - override /model: abc_arc/abc_dit_yam_visual
  - override /data: abc_arc/abc_visual
  - override /evaluator: eval_open_loop_sim
  - override /trainer: ddp
  - override /callbacks: checkpoints
  - override /logger: wandb
  - _self_
name: abc_rl2_towels_abcdit_multistream_logclock_visual_openloop
description: ABC-DiT XL ABC + RL2 towels multistream ARC D0.714 R2.10 M100, log-seconds duration clocks
abc:
  arc_clock_mode: duration
  arc_streams: translation_rotation
  arc_token_dim: 18
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          clock_mode: ${abc.arc_clock_mode}
          streams: translation_rotation
evaluator:
  clock_mode: ${abc.arc_clock_mode}
logger:
  wandb:
    tags:
    - abc_dit
    - abc
    - rl2
    - towels
    - clip_task
    - multistream
    - M100
    - duration_log_clock
    - open_loop
    - video
