# @package _global_
defaults:
  - /experiment/abc_arc/hpt_qwen_300M_knobs
  - override /model: abc_arc/hpt_abc_cotrain_300M_qwen_pooled
  - override /data: abc_arc/stationery_rl2_hpt_baseline
  - override /evaluator: eval_open_loop_sim
  - override /logger: wandb
  - _self_

name: stationery_rl2_hpt_baseline_openloop
description: 300M HPT, 100-step chunks, four RL2-only open-loop validation episodes
launch_params: {gpus_per_node: 2, nodes: 1}
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
hpt: {action_horizon: 100}
evaluator:
  action_mode: baseline
  ground_truth_action_key: actions_cartesian
  control_horizon: 100
  execute_fraction: 0.30
  limit_val_episodes: 4
  requires_ordered_validation: true
logger:
  wandb:
    project: abc-yam
    tags: [hpt, 300m, stationery, rl2, baseline, open_loop, video]
