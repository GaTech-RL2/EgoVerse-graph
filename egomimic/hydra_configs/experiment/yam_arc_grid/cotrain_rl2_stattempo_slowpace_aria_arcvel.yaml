# @package _global_
# RL2 cotrain, sort stationery, variant arcvel (E1 velocity-profile token, (100, 16)): the slow-pace YAM pool (Elmo + Aidan, 217 train eps,
# shared 24-episode held-out robot val) PLUS RL2 Aria human episodes, Aidan's 180M h640t8 recipe (240k, warmup 10k, seed 42),
# one robot batch (32) + one human batch (32 by default) per step. In-training validation is OPEN-LOOP (eval_open_loop_sim on
# the robot val: whole ordered episodes, execute_fraction 0.25, distance DTW off, ground truth actions_time) -- the metric
# the stationery runs are compared on -- instead of the teacher-forced BimanualTempoEval (Aidan 2026-10-03). Standalone, not
# inheriting scratch_rl2_stattempo_slowpace_arcdur, because that experiment's inline teacher-forced evaluator block would
# merge into this one. The data config is GENERATED at launch by scripts/e1/build_slowpace_aria_cotrain.py; launch with
# scripts/e1/launch_slowpace_aria_cotrain.sh.
defaults:
- _self_
- override /model: e1/hpt_flow_wrists_ft_arcdur_cotrain
- override /data: abc_arc/stationery_slowpace_aria_cotrain_arcvel
- override /trainer: ddp
- override /logger: wandb
- override /callbacks: checkpoints
- override /evaluator: eval_open_loop_sim
name: cotrain_rl2_stattempo_slowpace_aria_arcvel
description: h640t8_d384x10_cos10k_240k_s42_cotrain_rl2_stattempo_slowpace_aria_arcvel
ft:
  max_steps: 240000
  warmup_steps: 10000
init_weights_from: null
ckpt_path: null
mode: train
seed: 42
paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
  output_dir: ${hydra:runtime.output_dir}
  work_dir: null
launch_params:
  gpus_per_node: 1
  nodes: 1
runtime:
  slurm_requeue_owner: lightning
  slurm_save_signal: SIGUSR2
  slurm_signal_checkpoint_dir: ${paths.output_dir}/checkpoints
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: null
  max_epochs: -1
  min_epochs: 0
  accelerator: gpu
  devices: 1
  precision: bf16
  limit_train_batches: 100
  limit_val_batches: 1.0
  check_val_every_n_epoch: 200
  deterministic: false
  strategy: auto
  num_nodes: 1
  sync_batchnorm: false
  num_sanity_val_steps: 2
  max_steps: ${ft.max_steps}
callbacks:
  wandb_profiler:
    _target_: egomimic.utils.timing_callback.WandbProfilerLogger
    log_every_n_steps: 100
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch-{epoch:04d}-step-{step:08d}
    save_last: true
    save_top_k: -1
    every_n_epochs: null
    every_n_train_steps: 30000
    auto_insert_metric_name: false
logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    save_dir: null
    offline: false
    id: cotrain_rl2_stattempo_slowpace_aria_arcvel_20261001_s42
    anonymous: null
    project: arc
    log_model: false
    prefix: ''
    entity: rl2-group
    group: ''
    tags:
    - rl2
    - stationery
    - stattempo
    - tempo_slowpace
    - cotrain
    - aria
    - arcvel
    - openloop_val
    job_type: ''
    resume: never
norm_stats:
  norm_mode: quantile
  sample_frac: 0.2
  num_workers: 8
  save_cache_dir: null
  precomputed_norm_path: null
e1:
  variant: arcvel
  spread: stationery
  train_root: unused-s3-resolver
  valid_root: unused-s3-resolver
  train_mode: total
  valid_mode: total
  D: 0.4
  M: 100
  time_rows: 100
  chunk_length: 100
  h_match_frames: 40
  limit_val_batches: 40
  prog_horizon_m: 0.19
  progress_smooth_hz: null
  anchor_sampler: null
  velocity_norm: path
  fixed_spacing: false
  arcmatch_gt_span_m: null
  action_dim: 16
  action_horizon: 100
  image_weights: DEFAULT
arc_tokenizer:
  min_distance_unit: 0.4
  resampled_vector_length: 100
hpt:
  embed_dim: 640
  num_blocks: 8
  num_heads: 8
  stem_specs:
    random_horizon_masking: false
    cross_attn:
      crossattn_latent: 16
      crossattn_heads: 8
      crossattn_dim_head: 80
      crossattn_modality_dropout: 0.1
      modality_embed_dim: 640
  action_dim: 16
  action_horizon: 100
evaluator:
  limit_val_episodes: null
  execute_fraction: 0.25
  distance_dtw_enabled: false
  viz_every_n_epochs: 0
  ground_truth_action_key: actions_time
  action_mode: arc
  min_distance_unit: 0.4
  resampled_vector_length: 100
  token_layout: e1_profile
