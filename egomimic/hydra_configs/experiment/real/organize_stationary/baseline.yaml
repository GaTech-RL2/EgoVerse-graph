# @package _global_
defaults:
  - /experiment/_shared/visual_hpt300
  # Shared parents supply task settings; these links select every component.
  - override /model: abc_arc/hpt_bimanual_visual
  - override /data: abc_arc/organize_rl2_elmo_cotrain
  - override /evaluator: eval_open_loop_sim
  - override /trainer: ddp
  - override /callbacks: checkpoints
  - override /logger: wandb
  - _self_
name: organize_rl2_elmo_hpt300_cotrain_baseline
description: HPT300 ResNet-MLP stems, robot + human cotraining, 100-frame chunks
abc:
  task_predicate: row['task'] == 'organize_stationary'
  population: robot_human
  human_keymap_mode: cartesian
  human_action_mode: cartesian_gripper_padded
  arc_chunking_mode: multistream
  arc_distance: 0.42
  arc_rotation_distance: 0.4188790204786391
  arc_clock_mode: duration
  arc_streams: translation_rotation
  arc_source_buffer_frames: 200
evaluator:
  limit_val_episodes: null
logger:
  wandb:
    tags:
    - hpt300m
    - resnet_mlp
    - rl2
    - organize_stationary
    - elmo
    - cotrain
    - human_bimanual
    - baseline
    - open_loop
    - video
