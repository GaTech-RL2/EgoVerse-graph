# @package _global_
# Shared frozen YAM stationery recipe with robot-only complete-episode open-loop
# validation, for robot-only BC and (via _base/stattempo_aria) Aria cotrain.
# Keep evaluator selection in defaults so teacher-forced kwargs cannot leak in.
defaults:
- /experiment/_shared/frozen_yam/stattempo
- override /evaluator: eval_open_loop_sim
- _self_
trainer:
  limit_val_batches: 1.0
evaluator:
  # Recorded runs capped overlay trajectories by distance; the shared evaluator
  # now defaults to the chunking mode, which these recipes do not set.
  arc_video_trajectory_cap_mode: distance
  limit_val_episodes: null
  execute_fraction: 0.25
  distance_dtw_enabled: false
  viz_every_n_epochs: 0
  ground_truth_action_key: actions_time
  action_mode: baseline
  min_distance_unit: 0.4
  resampled_vector_length: 100
