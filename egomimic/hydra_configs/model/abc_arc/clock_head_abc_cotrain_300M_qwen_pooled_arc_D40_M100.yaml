# Dual-head language-conditioned flow model for ABC/mecka ARC tokens.
#
# The tokenizer layout for per_waypoint and duration modes is:
#   [M shape waypoints, M clock rows]
# The shape head retains the full 300M-style CrossTransformer.  The clock head
# is intentionally smaller because it predicts only timing/rate rows.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
    - _target_: egomimic.pipeline.stages_hpt.HPTStemStage
      selector_key: embodiment
      selector_aliases:
        3: human_bimanual
        7: yam_bimanual
      stems:
        observations.images.front_img_1:
          _target_: egomimic.models.stems.hpt_stems.ResNet
          output_dim: ${hpt.embed_dim}
          resnet_model: resnet18
          weights: null
          specs: ${hpt.stem_specs}
      domain_stems:
        yam_bimanual:
          observations.state.ee_pose:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: ${hpt.action_dim}
            output_dim: ${hpt.embed_dim}
            widths: ["${hpt.embed_dim}"]
            specs: ${hpt.stem_specs}
          observations.images.left_wrist_img:
            _target_: egomimic.models.stems.hpt_stems.ResNet
            output_dim: ${hpt.embed_dim}
            resnet_model: resnet18
            weights: null
            specs: ${hpt.stem_specs}
          observations.images.right_wrist_img:
            _target_: egomimic.models.stems.hpt_stems.ResNet
            output_dim: ${hpt.embed_dim}
            resnet_model: resnet18
            weights: null
            specs: ${hpt.stem_specs}
        human_bimanual:
          observations.state.ee_pose:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: ${hpt.action_dim}
            output_dim: ${hpt.embed_dim}
            widths: ["${hpt.embed_dim}"]
            specs: ${hpt.stem_specs}

    - _target_: egomimic.pipeline.stages_hpt.HPTTrunkStage
      embed_dim: ${hpt.embed_dim}
      token_postprocessing: action_token
      use_position_embedding: true
      max_tokens: 512
      use_domain_embedding: true
      domains: [yam_bimanual, human_bimanual]
      selector_key: embodiment
      selector_aliases:
        3: human_bimanual
        7: yam_bimanual
      trunk:
        _target_: egomimic.models.cores.hpt_transformer.SimpleTransformer
        embed_dim: ${hpt.embed_dim}
        num_blocks: ${hpt.num_blocks}
        drop_path_rate: 0.1
        weight_init_style: pytorch
        attn_target:
          _target_: egomimic.models.cores.hpt_transformer.MultiheadAttention
          _partial_: true
          embed_dim: ${hpt.embed_dim}
          num_heads: ${hpt.num_heads}
          batch_first: true

    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_dual_flow.DualFlowNoisingStage
      waypoint_horizon: ${abc.arc_waypoints}
      action_dim: ${hpt.action_dim}
      time_dist: beta
      beta_alpha: 1.5
      beta_beta: 1.0
    - _target_: egomimic.pipeline.stages_dual_flow.DualFlowDenoiserStage
      waypoint_horizon: ${abc.arc_waypoints}
      action_dim: ${hpt.action_dim}
      condition_input_dim: ${hpt.embed_dim}
      num_inference_steps: 50
      condition_as_tokens: true
      shape_model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: ${hpt.embed_dim}
        hidden_dim: 320
        act_dim: ${hpt.action_dim}
        act_seq: ${abc.arc_waypoints}
        n_heads: 8
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4
        time_conditioning: additive
      clock_model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 3
        cond_dim: ${hpt.embed_dim}
        hidden_dim: 160
        act_dim: ${hpt.action_dim}
        act_seq: ${abc.arc_waypoints}
        n_heads: 4
        dropout: 0.1
        mlp_layers: 2
        mlp_ratio: 2
        time_conditioning: additive
    - _target_: egomimic.pipeline.stages_dual_flow.DualFlowVelocityLossStage
      clock_loss_weight: 1.0

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
scheduler: null
