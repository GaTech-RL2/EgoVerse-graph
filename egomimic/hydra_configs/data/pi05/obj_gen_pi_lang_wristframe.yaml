# Wristframe variant of motion_gen_pi_lang: annotated-only eva + annotated-only
# aria (base/object descriptions). Actions are expressed in each wrist's own
# frame (cartesian_wristframe_ypr) instead of the head/camera frame. Pair with
# evaluator=eval_pi so the revert transform projects predictions back to cam
# frame for the viz video.
# Graph port: train_viz is a nested validation group; episode filters retained.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  eva_bimanual:
    _target_: egomimic.campaigns.pi05.data.PI05Dataset._from_resolver
    resolver:
      _target_: egomimic.campaigns.pi05.resolvers.S3EpisodeResolver
      folder_path: /storage/home/hcoda1/5/agao81/r-dxu345-0/pick_place
      key_map:
        _target_: egomimic.campaigns.pi05.eva.Eva.get_keymap
        keymap_mode: cartesian_pi
        annotation_key: annotations
      transform_list:
        _target_: egomimic.campaigns.pi05.eva.Eva.get_transform_list
        mode: cartesian_wristframe_ypr
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'') == ''eva_bimanual'' and (row.get(''zarr_processed_path'')
        or '''') != '''' and ''alignment'' not in ((row.get(''task_description'') or '''').lower()) and (row.get(''episode_hash'')
        or '''') != ''2026-04-22-02-30-32-296000'''
    mode: train
    valid_ratio: 0.05
  human_bimanual:
    _target_: egomimic.campaigns.pi05.data.PI05Dataset._from_resolver
    resolver:
      _target_: egomimic.campaigns.pi05.resolvers.S3EpisodeResolver
      folder_path: /storage/home/hcoda1/5/agao81/r-dxu345-0/pick_place
      key_map:
        _target_: egomimic.campaigns.pi05.human.Human.get_keymap
        keymap_mode: cartesian_pi
        annotation_key: annotations
      transform_list:
        _target_: egomimic.campaigns.pi05.human.Human.get_transform_list
        mode: cartesian_wristframe_ypr
        stride: 3
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'') == ''aria_bimanual'' and (row.get(''zarr_processed_path'')
        or '''') != '''' and any(s in ((row.get(''task_description'') or '''').lower()) for s in (''base'', ''object''))
        and (row.get(''episode_hash'') or '''') not in (''2026-04-26-00-17-53-000000'', ''2026-04-26-00-27-26-000000'',
        ''2026-05-01-02-52-58-000000'')'
    mode: train
    valid_ratio: 0.05
