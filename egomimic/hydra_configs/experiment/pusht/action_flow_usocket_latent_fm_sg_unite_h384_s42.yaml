# @package _global_
defaults:
  - /experiment/pusht/action_flow_usocket_candidate_common
  - override /data: pusht/unite_usocket_val01_h16_per_emb_proprio
  - override /model: bf/us_action_flow_latent_fm_sg_unite_h384
  - _self_

name: action_flow_usocket_latent_fm_sg_unite_h384_s42
description: "Action Flow stopgrad/JVP objective on separate released-UNITE H384 modules"
train:
  action_flow_method: latent_fm_stopgrad_unite

trainer:
  max_steps: 150000
  val_check_interval: 30000
  limit_val_batches: 8
  precision: bf16-mixed
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
  sample_frac: 1.0
  precomputed_norm_path: null

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
    save_last: link
    save_top_k: -1
    every_n_train_steps: 30000
    every_n_epochs: null
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

eval_checkpoint:
  use_ema: true

evaluator:
  energy_score_provenance:
    action_representation: x_y_cos_theta_sin_theta
    prediction_horizon: 16
    sampler: dopri5
    sampler_steps: 50
    model_autocast_precision: bf16
  action_flow_diagnostics:
    activation_layer_map: {0: 0, 1: 11}
    provenance:
      action_representation: x_y_cos_theta_sin_theta
      clean_endpoint: t0
      gaussian_endpoint: t1
      latent_shape: [8, 16]
      flow_samples_per_content: ${model.flow_samples_per_content}
      condition_dropout_probability: ${model.condition_dropout_probability}
      sampler: dopri5
      sampler_steps: ${model.num_inference_steps}
      flow_time_sampling: unite_lognormal_shifted_mapped_to_t0_clean
      reconstruction_noising: clean_fraction_uniform_0p7_to_1_probability_0p5

run_provenance:
  architecture:
    family: action_flow_with_separate_released_unite_modules
    tokenizer: UniteDiTBackbone_h384_d12_h12
    denoiser: UniteDiTBackbone_h384_d12_h12
    decoder: UniteActionDecoder_h384_d12_h12
    tokenizer_denoiser_weight_sharing: false
    action_shape: [16, 4]
    latent_shape: [8, 16]
    observation_condition_dim: 128
  objective:
    method: latent_fm_stopgrad_unite
    flow_clean_gradient_mode: all_stopgrad
    action_velocity_clean_gradient_mode: full
    reconstruction_is_optimizer_objective: true
    flow_weight: 1.0
    reconstruction_weight: 1.0
    action_velocity_weight: 1.0
    flow_samples_per_content: 14
    flow_mini_batch: 14
    endpoint_prediction_eps:
      train_eps: not_applicable_velocity_parameterization
      sample_eps: not_applicable_velocity_parameterization
  inference:
    sampler: dopri5
    steps: 50
    timestep_shift_alpha: 0.5
    atol: 1.0e-6
    rtol: 1.0e-3
    classifier_free_guidance: false
  requirements:
    r1_full_conditional_distribution: PASS_design_under_fixed_endpoint_cfm_assumptions
    r2_common_stochastic_latent: PASS_design
    r3_shared_conditional_generator: PASS_design
    r4_joint_learning_from_start: PASS_design
    r5_ordinary_pairs_and_context_free_decoder: PASS_design
    r6_flexible_nonlinear_interfaces: PASS_design
    r7_simple_objectives_with_disclosed_jvp_cost: PASS_design
    r8_no_required_action_path: PASS_optional_action_velocity_bias_disclosed
    r9_collapse_and_decoder_sensitivity: OPEN_requires_training_diagnostics
    r10_baseline_quality_and_compute: OPEN_requires_torus_controls_and_gpu_smoke

deployment:
  observation_adapter:
    _target_: egomimic.pipeline.pushshapes.USocketModelStateObservationAdapter
  action_decoder:
    _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
