# @package _global_
defaults:
  - override /data: libero/oat
  - override /trainer: default
  - override /evaluator: libero
  - override /callbacks: oat
  - override /logger: null

name: arc_oat
description: ${benchmark.suite}
normalizer:
  _target_: egomimic.rldb.zarr.libero_dataset.LiberoNormalizer
norm_stats:
  norm_mode: oat_limits
  sample_frac: 1.0
  num_workers: 0
trainer:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_epochs: 5001
  min_epochs: null
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 10

benchmark:
  suite: libero10
  dataset: ???
  batch_size: 256
  horizon: 32
  n_obs_steps: 2
  n_action_steps: 16
  tokenizer_checkpoint: null
  arc_waypoints: 16
  max_episode_steps: 550
  trials_per_task: 50
  repetitions: 5
  start_seed: 1000
