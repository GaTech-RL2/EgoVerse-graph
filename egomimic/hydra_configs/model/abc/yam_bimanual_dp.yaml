# Graph-native Diffusion Policy over YAM bimanual cartesian actions.
#
# The dependency chain is the ordinary DP one -- observations -> condition,
# actions -> target, target -> noised, denoise, loss -- so nothing here is
# ABC-specific except the widths. `action_dim: 14` is eef_frame + euler:
# [L xyz ypr g, R xyz ypr g]. Switching Yam.get_transform_list's rotation_mode
# to quat or 6D makes that 16 or 20, and BOTH action_dim and the denoiser's
# input_dim have to move with it -- DiffusionNoisingStage validates the target's
# width, so a mismatch fails at the first batch rather than training silently.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 3
  stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: observations.images.front_img_1
        ee_pose: observations.state.ee_pose
      encoder: ${abc.encoder}
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      # Yam's cartesian transform list concatenates into
      # `actions_cartesian`, not Planar's `actions`.
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: ${abc.action_horizon}
      action_dim: ${abc.action_dim}
      noise_scheduler: &abc_scheduler
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: ${abc.action_horizon}
      action_dim: ${abc.action_dim}
      condition_input_dim: ${abc.condition_dim}
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: ${abc.action_horizon}
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.ConditionalUnet1D
          input_dim: ${abc.action_dim}
          cond_dim: ${abc.condition_dim}
          ac_latent_seq: 1
          diffusion_step_embed_dim: 256
          down_dims: [256, 512, 1024]
          kernel_size: 3
        noise_scheduler: *abc_scheduler
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-6
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 500
  warmup_start_factor: 1.0e-8
  eta_min: 0.0

# Inference semantics belong to this model; station calibration is separate.
inference:
  input:
    history_length: 1
    keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    - embodiment
    history_keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    constants:
      embodiment: 7
  native_output:
    key: pred_action
    representation: normalized_action
    shape:
    - ${abc.action_horizon}
    - ${abc.action_dim}
    timing:
      kind: uniform_resampled_target
      temporally_resolved: true
      first_source_frame: 0
      last_source_frame: 44
      source_fps: 30.0
    frame: eef_frame
  output:
    key: actions
    representation: cartesian
    shape:
    - 45
    - 14
    timing:
      kind: control_period
      temporally_resolved: true
      dt: 0.03333333333333333
    frame: eef_frame
  compatibility:
    normalizer_schema:
      action_key: actions_cartesian
      native_shape:
      - ${abc.action_horizon}
      - ${abc.action_dim}
    tokenizer: null
  profiles:
    default:
      stage_id: sampler
      native_shape:
      - ${abc.action_horizon}
      - ${abc.action_dim}
      adapter:
        _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
        decoder:
          _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
          native_shape:
          - ${abc.action_horizon}
          - ${abc.action_dim}
          native_duration: 1.4666666666666666
          output_horizon: 45
          output_dt: 0.03333333333333333
          angular_indices:
          - 3
          - 4
          - 5
          - 10
          - 11
          - 12
        rotation_mode: euler
        action_frame: eef_frame
      overrides:
        inference_steps:
          label: Sampling steps
          description: Solver iterations per prediction.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 100
          target:
            kind: stage_attribute
            stage_id: sampler
            attribute_path: policy.num_inference_steps
        replan_every:
          label: Actions before replanning
          description: Execute this prefix before predicting again.
          type: integer
          min: 1
          max: 45
          step: 1
          default: 16
          target:
            kind: policy_attribute
            attribute_path: replan_every
