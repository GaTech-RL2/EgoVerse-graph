# @package _global_
defaults:
  - /experiment/abc_arc/robot_bc/abc_multitask4_hpt300_baseline_visual_openloop
  - _self_
name: abc_multitask4_hpt300_hybrid_visual_openloop
description: HPT300M ABC four-task visual-only hybrid ARC D81 M100 R24deg
abc:
  action_mode: hybrid_arc_tokenizer_cartesian
  # 873 training episodes, 2,574,495 complete 100-frame windows at 30Hz.
  # Mean combined left+right EEF travel = 0.8102208553 m (no validation leakage).
  arc_distance: 0.81
  arc_rotation_distance: 0.4188790204786391
hpt:
  action_horizon: ${abc.arc_token_rows}
evaluator:
  action_mode: arc
  ground_truth_action_key: actions_cartesian_untokenized
logger:
  wandb:
    tags: [hpt300m, abc, multitask4, visual_only, no_language, hybrid, M100, R24deg, per_waypoint, open_loop, video]
