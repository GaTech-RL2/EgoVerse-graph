# Wristframe variant of motion_gen_pi_lang: annotated-only eva + annotated-only
# aria (base/object descriptions). Actions are expressed in each wrist's own
# frame (cartesian_wristframe_ypr) instead of the head/camera frame. Pair with
# evaluator=eval_pi so the revert transform projects predictions back to cam
# frame for the viz video.
# Graph port: train_viz is a nested validation group; episode filters retained.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /storage/home/hcoda1/5/agao81/r-dxu345-0/pick_place
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
        camera_keys:
          observations.images.front_img_1: base_0_rgb
          observations.images.left_wrist_img: left_wrist_0_rgb
          observations.images.right_wrist_img: right_wrist_0_rgb
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
        extrinsics: &id001
          left:
          - - 0.01329544
            - -0.71757193
            - 0.69635749
            - -0.04409191
          - - -0.99959782
            - -0.02698416
            - -0.00872107
            - -0.23221381
          - - 0.02504862
            - -0.69596148
            - -0.7176421
            - 0.57323278
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
          right:
          - - -0.04733948
            - -0.76631195
            - 0.64072222
            - -0.01998031
          - - -0.9983006
            - 0.05811952
            - -0.00424732
            - 0.32539554
          - - -0.0339837
            - -0.63983444
            - -0.76776103
            - 0.64809634
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'') == ''eva_bimanual''
        and (row.get(''zarr_processed_path'') or '''') != '''' and ''alignment'' not in ((row.get(''task_description'')
        or '''').lower()) and (row.get(''episode_hash'') or '''') != ''2026-04-22-02-30-32-296000'''
    mode: train
    valid_ratio: 0.05
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /storage/home/hcoda1/5/agao81/r-dxu345-0/pick_place
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
        camera_keys:
          observations.images.front_img_1: base_0_rgb
          observations.images.left_wrist_img: left_wrist_0_rgb
          observations.images.right_wrist_img: right_wrist_0_rgb
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        stride: 3
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'') == ''aria_bimanual''
        and (row.get(''zarr_processed_path'') or '''') != '''' and any(s in ((row.get(''task_description'')
        or '''').lower()) for s in (''base'', ''object'')) and (row.get(''episode_hash'') or '''') not
        in (''2026-04-26-00-17-53-000000'', ''2026-04-26-00-27-26-000000'', ''2026-05-01-02-52-58-000000'')'
    mode: train
    valid_ratio: 0.05
