workflow:
  name: obs-streams-1007-v1
  tasks:
  - name: data-gate
    resource: gate
    image: docker.io/library/python:3.11-slim
    credentials:
      grabber-arc-r2-20260916: &id001
        R2_ACCESS_KEY_ID: r2_access_key_id
        R2_SECRET_ACCESS_KEY: r2_secret_access_key
        R2_ENDPOINT_URL: r2_endpoint_url
    environment:
      SOURCE_COMMIT: 6fe312726bd4efb4e805a863b85fa8c029c418b4
    command:
    - bash
    args:
    - /tmp/gate.sh
    files:
    - path: /tmp/gate.sh
      contents: 'set -Eeuo pipefail

        set +x

        export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONUNBUFFERED=1

        python -m venv /workspace/emimic

        source /workspace/emimic/bin/activate

        pip install --disable-pip-version-check boto3==1.43.98 numpy==2.3.5

        python /tmp/wait_data.py /tmp/campaign.json /tmp/evaluation-base.json ''{{output}}''

        '
    - path: /tmp/wait_data.py
      contents: "\"\"\"Release GPU work only after a pinned dataset and reset-overlap\
        \ audit pass.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib\
        \ import Path\nimport sys\nimport time\n\nimport boto3\nfrom botocore.config\
        \ import Config\nimport numpy as np\n\n\ndef main(spec, evaluation, output):\n\
        \    client = boto3.client(\"s3\", endpoint_url=os.environ[\"R2_ENDPOINT_URL\"\
        ],\n        aws_access_key_id=os.environ[\"R2_ACCESS_KEY_ID\"], aws_secret_access_key=os.environ[\"\
        R2_SECRET_ACCESS_KEY\"],\n        region_name=\"auto\", config=Config(retries={\"\
        max_attempts\": 8}))\n\n    def read(key, sha=None):\n        try:\n     \
        \       response = client.get_object(Bucket=\"rldb\", Key=key)\n        except\
        \ client.exceptions.NoSuchKey:\n            return None\n        raw = response[\"\
        Body\"].read()\n        expected = sha or response.get(\"Metadata\", {}).get(\"\
        sha256\")\n        if expected and hashlib.sha256(raw).hexdigest() != expected:\n\
        \            raise ValueError(\"Artifact hash mismatch: \" + key)\n      \
        \  return json.loads(raw)\n\n    data_prefix = spec[\"data_ready_key\"].rsplit(\"\
        /\", 1)[0] + \"/\"\n    deadline = time.monotonic() + 12*3600\n    while time.monotonic()\
        \ < deadline:\n        failed = read(data_prefix + \"FAILED.json\")\n    \
        \    if failed:\n            raise RuntimeError(\"Dataset preparation failed:\
        \ \" + json.dumps(failed))\n        ready = read(spec[\"data_ready_key\"])\n\
        \        if ready:\n            break\n        print(\"WAITING_FOR_DATA\"\
        , spec[\"data_ready_key\"], flush=True)\n        time.sleep(30)\n    else:\n\
        \        raise TimeoutError(\"No dataset completion receipt after 12 hours\"\
        )\n    started = read(data_prefix + \"STARTED.json\")\n    assert started[\"\
        script_sha256\"] == spec[\"data_preparation_sha256\"]\n    assert ready[\"\
        status\"] == \"PASS\" and ready[\"counts\"] == spec[\"expected_counts\"]\n\
        \    manifest = read(ready[\"manifest\"][\"key\"], ready[\"manifest\"][\"\
        sha256\"])\n    assert manifest[\"counts\"] == ready[\"counts\"]\n    bank\
        \ = read(evaluation[\"seed_bank\"][\"uri\"].removeprefix(\"s3://rldb/\"),\
        \ evaluation[\"seed_bank\"][\"sha256\"])\n    assert bank[\"contract\"] ==\
        \ evaluation[\"seed_bank_contract\"]\n    assert sorted(map(int, bank[\"levels\"\
        ])) == list(range(31))\n    overlaps, seed_overlaps = [], []\n    for label,\
        \ domain in evaluation[\"domains\"].items():\n        name = domain[\"domain\"\
        ][\"embodiment\"]\n        training = [e for e in manifest[\"episodes\"] if\
        \ e[\"embodiment\"] == name and e[\"split\"] == \"train\"]\n        poses\
        \ = np.asarray([e[\"episode_init\"][\"object_pose\"] + e[\"episode_init\"\
        ][\"goal_pose\"] for e in training])\n        known_seeds = {(e[\"obstacle_level\"\
        ], e[\"episode_init\"].get(\"reset_seed\")) for e in training\n          \
        \             if e[\"episode_init\"].get(\"reset_seed\") is not None}\n  \
        \      for level, rows in bank[\"levels\"].items():\n            assert len(rows[\"\
        selected\"]) == 50\n            for row in rows[\"selected\"]:\n         \
        \       init = row[\"initial_states\"][label]\n                delta = poses\
        \ - np.asarray(init[\"object_pose\"] + init[\"goal_pose\"])\n            \
        \    delta[:, [2, 5]] = (delta[:, [2, 5]] + np.pi) % (2*np.pi) - np.pi\n \
        \               if np.any(np.max(np.abs(delta), axis=1) <= bank[\"contract\"\
        ][\"initial_pose_tolerance\"]):\n                    overlaps.append([label,\
        \ int(level), row[\"seed\"]])\n                if (int(level), int(row[\"\
        seed\"])) in known_seeds:\n                    seed_overlaps.append([label,\
        \ int(level), row[\"seed\"]])\n    audit = {\"source_commit\": os.environ[\"\
        SOURCE_COMMIT\"], \"data_manifest_sha256\": ready[\"manifest\"][\"sha256\"\
        ],\n        \"seed_bank_sha256\": evaluation[\"seed_bank\"][\"sha256\"], \"\
        initial_pose_overlaps\": overlaps,\n        \"known_seed_overlaps\": seed_overlaps,\
        \ \"missing_training_seed_metadata_is_not_evidence_of_disjoint_seeds\": True}\n\
        \    raw = (json.dumps(audit, indent=2) + \"\\n\").encode()\n    client.put_object(Bucket=\"\
        rldb\", Key=spec[\"artifact_prefix\"] + \"preflight/reset-overlap-audit.json\"\
        ,\n        Body=raw, Metadata={\"sha256\": hashlib.sha256(raw).hexdigest()})\n\
        \    if overlaps or seed_overlaps:\n        raise RuntimeError(\"Frozen evaluation\
        \ resets overlap the new training corpus\")\n    output.mkdir(parents=True,\
        \ exist_ok=True)\n    (output / \"data-ready.json\").write_text(json.dumps(ready))\n\
        \    (output / \"reset-overlap-audit.json\").write_bytes(raw)\n    print(\"\
        DATA_GATE_PASSED\", ready[\"episodes\"], flush=True)\n\n\nif __name__ == \"\
        __main__\":\n    main(json.loads(Path(sys.argv[1]).read_text()), json.loads(Path(sys.argv[2]).read_text()),\
        \ Path(sys.argv[3]))\n"
