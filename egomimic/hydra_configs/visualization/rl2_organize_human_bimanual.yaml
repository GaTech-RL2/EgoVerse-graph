# SQL inventory is read-only; sample before opening any episode arrays.
# ARC settings mirror experiment/abc_arc/cotrain/organize_rl2_elmo_hpt300_cotrain_multistream.
name: rl2_organize_stationary_human_bimanual
source_fps: 30
cache_roots:
  - ${oc.env:EGOVERSE_ABC_DATASET_DIR}
  - ${oc.env:EGOVERSE_ZARR_CACHE_DIR,${oc.env:EGOVERSE_ABC_DATASET_DIR}}
inventory:
  query: >-
    SELECT episode_hash, lab, task, embodiment, operator, zarr_processed_path, is_deleted
    FROM app.episodes WHERE lab=:lab AND task=:task AND embodiment=:embodiment
    AND lower(operator)=:operator AND is_deleted=false AND zarr_processed_path != '' ORDER BY episode_hash
  parameters:
    lab: rl2
    task: organize_stationary
    embodiment: human_bimanual
    operator: elmo
data:
  valid_ratio: 0.05
  split_seed: 42
  key_map:
    _target_: egomimic.rldb.embodiment.human.Human.get_keymap
    keymap_mode: hybrid_arc_tokenizer_cartesian
    norm_mode: true
    annotation_key: null
    min_distance_unit: 0.42
    rotation_distance_unit: 0.4188790204786391
    arc_chunking_mode: multistream
    # Match the robot's 200-frame ARC read window, as in cotraining.
    source_buffer_frames: 200
  transform_list:
    _target_: egomimic.scripts.data_visualization.arc_tsne_inventory.native_source_transforms
    transforms:
      _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
      action_mode: hybrid_arc_tokenizer_cartesian
      coord_frame: eef_frame
      rotation_mode: euler
      stride: 1
      min_distance_unit: 0.42
      rotation_distance_unit: 0.4188790204786391
      arc_chunking_mode: multistream
      resampled_vector_length: 100
      velocity_mode: duration
      velocity_layout: clock
  filters:
    _target_: egomimic.rldb.filters.DatasetFilter
    filter_lambdas:
      - "lambda row: row['lab'] == 'rl2' and row['task'] == 'organize_stationary' and row['embodiment'] == 'human_bimanual' and str(row.get('operator') or '').lower() == 'elmo' and row['is_deleted'] == False"

