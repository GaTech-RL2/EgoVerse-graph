# Lambda copy of towels_rl2_394_arcdur: identical pool, split, pins, loader and transforms. The only change is data
# resolution: no SQL on the loaner, so a LocalEpisodeResolver reads the verified R2 copies in /workspace/users/agao81/datasets/egoverseS3ZarrDatasets and keeps
# exactly the 394 hashes listed in rl2_towels394_episodes.txt (resolver pin 394 + split pins 375 / 19).
# Loader batch is 16 PER RANK: these runs are 2-GPU DDP (Aidan 2026-09-25), so the global batch stays 32 as in the grid.
defaults:
- /data/abc_arc/towels_rl2_394_arcvel@_here_
- _self_
train_datasets:
  yam_bimanual:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /workspace/users/agao81/datasets/egoverseS3ZarrDatasets
      transform_list:
        variant: arcdur
      expected_episode_count: 394
      expected_episode_names_sha256: 9aa2c859f23324cf942e01d843c81c5ebb6659a25e68356d2c39f2b83aef928b
    filters:
      filter_lambdas: []
      episode_allowlist_file: package://egomimic/hydra_configs/data/abc_arc/rl2_towels394_episodes.txt
valid_datasets:
  yam_bimanual:
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: /workspace/users/agao81/datasets/egoverseS3ZarrDatasets
      transform_list:
        variant: arcdur
      expected_episode_count: 394
      expected_episode_names_sha256: 9aa2c859f23324cf942e01d843c81c5ebb6659a25e68356d2c39f2b83aef928b
    filters:
      filter_lambdas: []
      episode_allowlist_file: package://egomimic/hydra_configs/data/abc_arc/rl2_towels394_episodes.txt
train_dataloader_params:
  yam_bimanual:
    batch_size: 16
valid_dataloader_params:
  yam_bimanual:
    batch_size: 16
