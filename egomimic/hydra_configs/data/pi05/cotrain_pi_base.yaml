# Graph port: train_viz is a nested validation group; episode filters retained.
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
_recursive_: false
source_fps: 30.0
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseS3ZarrDataset
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
        extrinsics: &id001
          left:
          - - 0.01329544
            - -0.71757193
            - 0.69635749
            - -0.04409191
          - - -0.99959782
            - -0.02698416
            - -0.00872107
            - -0.23221381
          - - 0.02504862
            - -0.69596148
            - -0.7176421
            - 0.57323278
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
          right:
          - - -0.04733948
            - -0.76631195
            - 0.64072222
            - -0.01998031
          - - -0.9983006
            - 0.05811952
            - -0.00424732
            - 0.32539554
          - - -0.0339837
            - -0.63983444
            - -0.76776103
            - 0.64809634
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
      image_hw:
      - 480
      - 640
    filters: null
    mode: train
    valid_ratio: 0.05
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseS3ZarrDataset
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        stride: 3
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
      image_hw:
      - 480
      - 640
    filters: null
    mode: train
    valid_ratio: 0.05
valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseS3ZarrDataset
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
        extrinsics: *id001
      image_hw:
      - 480
      - 640
    filters: null
    mode: valid
    valid_ratio: 0.05
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /coc/flash7/scratch/egoverseS3ZarrDataset
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        stride: 3
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
      image_hw:
      - 480
      - 640
    filters: null
    mode: valid
    valid_ratio: 0.05
train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
  human_bimanual:
    batch_size: 32
    num_workers: 6
valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
  human_bimanual:
    batch_size: 32
    num_workers: 6
