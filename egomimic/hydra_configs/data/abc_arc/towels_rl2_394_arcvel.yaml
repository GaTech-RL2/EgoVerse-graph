# RL2-ONLY fold_towels, the 394-episode pool (2026-09-24): the t298 pool (299 SQL rows, 298 processed) + Aidan's 9-24
# evening batch of 96 (demo_200-259 = 60, then 36 more; demo_273 left out, a failed take that hit the 3000-frame cap).
# Same regime as towels_rl2_298_*: one loader path (bimanual_arc keymap + transform list), one split (seed 42,
# valid_ratio 0.05), one evaluator. Only `variant` differs: arcvel.
# The pool is PINNED by an episode_hash cutoff (the last episode is demo_20 = 2026-09-25-03-22-30-639000) AND by the
# expected train/valid episode counts + name hashes below, so a drifted pool (new uploads, a missing mirror copy) fails
# at construction instead of training on the wrong set.
# persistent_workers true: default re-forks loader workers each epoch and this stack deadlocks there (job 13307279).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.e1_resolvers.S3EpisodeResolverWithEmbodimentOverride
      embodiment_override: yam_bimanual
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
        horizon: 200
        embodiment: yam
        drop_wrist_images: false
        yam_source_frames: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
        variant: arcvel
        chunk_length: 200
        time_rows: 100
        min_distance_unit: 0.4
        resampled_vector_length: 100
        stride: 1
        rotation_mode: euler
        velocity_norm: path
        embodiment: yam
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row[''embodiment''] == ''yam_bimanual'' and row[''zarr_processed_path''] != ''''
        and row[''is_deleted''] == False and row[''lab''] == ''rl2'' and row[''task''] == ''fold_towels''
        and row[''rig_name''] == ''rl2_abc'' and str(row[''episode_hash'']) < ''2026-09-25-03-23'''
    mode: train
    valid_ratio: 0.05
    bounds_check: false
    split_seed: 42
    expected_train_episode_count: 375
    expected_valid_episode_count: 19
    expected_train_episode_names_sha256: ffe1c84955e4c81e2c316806925d9a14f302300a0e251a5a5c49eac56f8b5e26
    expected_valid_episode_names_sha256: 42d6798907567d9ac88f30ffc50670fe4527fde59ccb0bc2d18887d9af2978c2
