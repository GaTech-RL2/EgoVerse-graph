# @package _global_
# STATIONERY rollout pair (2026-09-07, Aidan): the lab's abc_fslongshirt_bc with the task swapped to
# 'sort the stationery into containers' (K = 400 -> 793 episodes / 15.9 h), run on Phoenix H200 (1 GPU,
# batch 64 = the lab's 2 x 32) for 30k steps with a checkpoint kept every 5k for rollouts. Model, token,
# evaluator and everything else are the lab's, so the checkpoints load in the lab's rollout stack.
# ABC-ONLY (no cotraining) time-indexed BC: fold_and_stack_the_t_shirts,
# yam_bimanual. The single-domain arm of the cotrain ablation.
#
# Robot data is held FIXED at the cotrain run's yam split -- 20 ABC episodes,
# 48,286 frames -- so the only thing removed relative to
# abc_fslongshirt_micro_foldclothes_cotrain_baseline adds the human split.
# Any delta between the two is attributable to cotraining, not to data volume.
#
# Its arc twin is abc_fslongshirt_arc_bc.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fslongshirt_bc
#
# `-m` is required: the submitit launcher only engages in multirun mode.
#
# The `override /hydra/launcher` line in the defaults below does NOT take
# effect -- hydra only honours a hydra/ group selection from the primary config
# or the command line, and an experiment loaded with `+experiment=` is neither.
# Verified: without a CLI flag the resolved choice is plain `submitit`
# (rl2-lab, a40), whatever this file says. Pass it explicitly:
#     hydra/launcher=submitit_skynet_a40      (non-preemptible, schedules fast)
#     hydra/launcher=submitit_skynet_l40s     (overcap -- PREEMPTIBLE)
# The default paths.dataset_dir (/coc/flash7/scratch/egoverseS3ZarrDataset) is
# owned by another user and mode drwxr-xr-x, so s5cmd's mkdir fails with
# "permission denied" for any episode not already cached there. This directory
# is writable and already holds the ABC episodes this run needs.
# Single domain and hpt_bc_flow_base inherits no foreign stems, so the stem/head
# side is clean. find_unused_parameters stays on for the image encoders:
# hpt_bc_flow_base declares front/left/right wrist encoders but only front_img_1
# feeds a stem, so the wrist ResNets never receive a gradient and plain `ddp`
# would abort with "Expected to have finished reduction in the prior iteration".
# Norm stats sampling fraction. The pass reads every sampled frame of every
# episode before training starts and is the bulk of startup. A finished run's
# stats land in <output_dir>/norm_stats/norm_stats.json -- pass that back via
# norm_stats.precomputed_norm_path=<path> to skip it on a relaunch of the SAME
# data config. Verify the file has BOTH embodiments populated first: cache_stats
# writes after each embodiment, so an interrupted run leaves a partial file that
# would silently leave one embodiment unnormalized.
defaults:
- /experiment/e1/fold_base
- override /model: e1/hpt_flow_wrists
- override /data: abc_arc/abc_stationery_bc
- override /evaluator: eval_arc_bimanual_cartesian_D40_M100
- override /trainer: ddp
- override /logger: wandb
- override /hydra/launcher: submitit_pace
- _self_
name: abc_stationery_bc
description: baseline
paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
trainer:
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 2
  max_steps: 30000
  max_epochs: 300
  min_epochs: 0
norm_stats:
  sample_frac: 0.2
launch_params:
  gpus_per_node: 1
  nodes: 1
logger:
  wandb:
    project: arc
    tags:
    - abc
    - bc
    - baseline
e1:
  variant: time
  action_dim: 14
  action_horizon: 100
  spread: stationery
  train_root: unused-s3-resolver
  valid_root: unused-s3-resolver
evaluator:
  velocity_mode: mean
  viz_func: null
  arcmatch_points: 100
  include_reconstruction_loss: true
callbacks:
  model_checkpoint:
    every_n_epochs: 50
    save_top_k: -1
