# @package _global_
# HPT180 ARC BC on all ABC YAM ``fold stack towels`` episodes.
# Launch target: +experiment=abc_arc/abc_towels_hpt180_arc_D40_M100_openloop
defaults:
  - /experiment/abc_arc/hpt_qwen_180M_knobs
  - override /model: abc_arc/hpt_abc_cotrain_180M_qwen_pooled_arc_D40_M100
  - override /data: abc_arc/abc_towels_hpt180_arc_D40_M100
  - override /evaluator: eval_open_loop_sim
  - override /logger: wandb
  - _self_

name: abc_towels_hpt180_arc_D40_M100_openloop
description: HPT180 ARC D=0.40/M=100, four ordered ABC towel validation episodes
launch_params: {gpus_per_node: 2, nodes: 1}
abc:
  action_horizon: 100
  arc_distance: 0.40
  arc_token_rows: 200
  arc_velocity_mode: per_waypoint
  arc_waypoints: 100
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
hpt:
  action_horizon: ${abc.arc_token_rows}
norm_stats:
  sample_frac: 0.20
evaluator:
  action_mode: arc
  control_horizon: 100
  execute_fraction: 0.30
  limit_val_episodes: 4
  requires_ordered_validation: true
  min_distance_unit: ${abc.arc_distance}
  resampled_vector_length: ${abc.arc_waypoints}
  velocity_mode: ${abc.arc_velocity_mode}
logger:
  wandb:
    project: abc-yam
    tags: [hpt, hpt180, towels, abc, arc, D40, M100, open_loop, video]
