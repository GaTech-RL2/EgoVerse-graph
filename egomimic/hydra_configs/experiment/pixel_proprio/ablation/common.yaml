# @package _global_
defaults:
- /experiment/pixel_proprio/joint_continuous
- override /model: pixel_proprio/joint_ablation
- _self_
modality_ablation:
  schema: joint-modality-factorial-v1
  active_streams: null
  nodes:
    joint_noising:
      _target_: egomimic.pipeline.stages_joint_state_action.JointNoisingStage
      noising:
        _target_: egomimic.models.joint_state_action.CoupledStateActionNoising
        maximum: 1.0
    joint_denoiser:
      _target_: egomimic.pipeline.stages_joint_state_action.JointDenoiserStage
      model:
        _target_: egomimic.models.joint_state_action.JointStateActionModel
        pose_dims: ${joint.pose_dims}
        action_dims: ${joint.action_dims}
        max_tokens: ${joint.max_tokens}
        image_dim: 768
        width: 768
        proprio_width: 256
        action_width: 256
        depth: 8
        heads: 6
        mlp_ratio: 4
        max_cameras: 2
        time_mode: ${data.mode}
        rope_axis_dims:
        - 64
        - 32
        - 32
        spatial_grid_size:
        - 10
        - 10
        attention_backend: ${world_model_attention.backend}
        attention_dtype: ${world_model_attention.dtype}
        token_execution: packed_valid
        compile_mode: ${joint.compile_mode}
        compile_dynamic: true
        active_streams: ${modality_ablation.active_streams}
    image_loss:
      _target_: egomimic.pipeline.stages_joint_state_action.JointLossStage
      stream: image
      weight: 1.0
      loss:
        _target_: egomimic.models.pixel_diffusion.PlainPixelMSE
        reduction: mean_per_example
    proprio_loss:
      _target_: egomimic.pipeline.stages_joint_state_action.JointLossStage
      stream: proprio
      weight: 1.0
      loss:
        _target_: egomimic.models.pixel_diffusion.PlainPixelMSE
        reduction: mean_per_example
    action_loss:
      _target_: egomimic.pipeline.stages_joint_state_action.JointLossStage
      stream: action
      weight: 1.0
      loss:
        _target_: egomimic.models.pixel_diffusion.PlainPixelMSE
        reduction: mean_per_example
    joint_sampler:
      _target_: egomimic.pipeline.stages_joint_state_action.JointSamplerStage
      sampler:
        _target_: egomimic.models.joint_state_action.JointStateActionSampler
        state_steps: 20
        action_steps: 20
  stage_ids: null
  graph: null
  claim: Effect of adding proprioception and/or command experts, tokens, supervision
    and corresponding observation conditioning on image quality
  initialization: Full-bank seed42 construction, then remove inactive experts; common
    parameters and constructor RNG remain paired
  training_noise: Full-contract noiser used in every arm; inactive values never enter
    attention
  preview_observed_indices:
  - 0
  - 4
  - 8
  - 12
  preview_query_indices:
  - 16
  - 20
  - 24
  - 28
  - 32
  - 36
  - 40
  - 44
  - 48
  - 52
  - 56
  - 60
  first_pass_seed: 42
  screening_budget_updates: 100000
trainer:
  max_steps: 100000
evaluator:
  prediction_streams: ${modality_ablation.active_streams}
logger:
  wandb:
    group: joint-modality-factorial-20261019-v1
    resume: never
