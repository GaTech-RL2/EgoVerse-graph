# @package _global_
defaults:
  - /experiment/abc_arc/abc_visual_hpt300_base
  - override /model: abc_arc/hpt_bimanual_visual
  - override /data: abc_arc/mecka_fold_clothes_40h_human_baseline
  - _self_
name: mecka_fold_clothes_40h_human_visual_baseline_openloop
description: HPT300M human-bimanual MECKA fold_clothes visual-only baseline
abc:
  task_predicate: "row['task'] == 'fold_clothes'"
data:
  train_datasets:
    human_bimanual:
      batch_keys: [observations.state.ee_pose, actions_cartesian]
      resolver:
        key_map: {annotation_key: null}
  valid_datasets:
    human_bimanual:
      batch_keys: [observations.state.ee_pose, actions_cartesian]
      resolver:
        key_map: {annotation_key: null}
evaluator:
  limit_val_episodes: 5
logger:
  wandb:
    tags: [hpt300m, mecka, human_bimanual, fold_clothes, visual_only, no_language, baseline, open_loop, video]
