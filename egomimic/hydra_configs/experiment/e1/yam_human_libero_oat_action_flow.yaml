# @package _global_
defaults:
  - /experiment/e1/yam_libero_oat_action_flow
  - override /model: libero/action_flow_yam_human
  - _self_
name: yam_human_libero_oat_action_flow
description: LIBERO-sized shared latent flow with native YAM and human codecs; no retiming augmentation
run_provenance:
  training_domain: yam_human_cotrain
stationary_speed:
  yam_rates: [1.0]
  human_rates: [1.0]
  sample_views_by_source: {yam_bimanual: 1, human_bimanual: 1}
data:
  proportional_train_batch_size: 32
  train_datasets:
    human_bimanual:
      resolver:
        image_hw: [128,128]
        transform_list:
          window_transform:
            sample_views: 1
          native_transforms:
            chunk_length: 32
  valid_datasets:
    human:
      human_bimanual:
        resolver:
          image_hw: [128,128]
          transform_list:
            window_transform:
              sample_views: 1
            native_transforms:
              chunk_length: 32
evaluator:
  human_action_horizon: 32
callbacks:
  # The proportional multi-source sampler owns the batch/epoch budget.
  batch_budget: null
  dit_half:
    source_keys: [yam_bimanual, human_bimanual]
