# @package _global_
defaults:
  - /experiment/abc_arc/hpt_qwen_300M_knobs
  - override /model: abc_arc/hpt_abc_cotrain_300M_qwen_pooled_arc_D40_M100
  - override /data: abc_arc/stationery_rl2_hpt_arc_D40_M100
  - override /evaluator: eval_open_loop_sim
  - override /logger: wandb
  - _self_

name: stationery_rl2_hpt_arc_D40_M100_openloop
description: 300M HPT ARC D=0.40/M=100, four RL2-only open-loop validation episodes
launch_params: {gpus_per_node: 2, nodes: 1}
trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
abc:
  arc_velocity_mode: per_waypoint
  arc_token_rows: 200
  arc_distance: 0.40
  arc_waypoints: 100
  action_horizon: 100
hpt:
  action_horizon: ${abc.arc_token_rows}
evaluator:
  action_mode: arc
  control_horizon: 100
  execute_fraction: 0.30
  min_distance_unit: ${abc.arc_distance}
  resampled_vector_length: ${abc.arc_waypoints}
  velocity_mode: ${abc.arc_velocity_mode}
  limit_val_episodes: 4
  requires_ordered_validation: true
logger:
  wandb:
    project: abc-yam
    tags: [hpt, 300m, stationery, rl2, arc, D40, M100, open_loop, video]
