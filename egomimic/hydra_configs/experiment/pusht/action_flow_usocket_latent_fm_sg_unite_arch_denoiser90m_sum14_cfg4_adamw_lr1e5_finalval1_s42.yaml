# @package _global_
defaults:
  - /experiment/pusht/action_flow_usocket_latent_fm_sg_unite_denoiser90m_sum14_cfg4_finalval1_s42
  - _self_

name: action_flow_usocket_latent_fm_sg_unite_arch_denoiser90m_sum14_cfg4_adamw_lr1e5_finalval1_s42
description: "Action Flow with UNITE encoder/90M denoiser/decoder architecture only and the standard AdamW 1e-5 schedule"

# Interpolating the optimizer and scheduler mappings replaces the released
# UNITE Muon/AdamW composite without duplicating the architecture definition.
standard_adamw_optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4

standard_adamw_scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 8000
  warmup_start_factor: 0.1
  eta_min: 1.0e-6

model:
  optimizer_named_parameters: false
  optimizer: ${standard_adamw_optimizer}
  scheduler: ${standard_adamw_scheduler}

trainer:
  max_steps: 240000
  val_check_interval: 240000

callbacks:
  model_checkpoint:
    every_n_train_steps: 40000

run_provenance:
  architecture:
    unite_usage: encoder_decoder_and_denoiser_architecture_only
    optimizer_parameter_partitioning: none
  optimizer_ablation:
    optimizer: adamw
    base_lr: 1.0e-5
    eta_min: 1.0e-6
    warmup_steps: 8000
    max_steps: 240000
    weight_decay: 1.0e-4
    fresh_initialization: true
    comparison_reference: usocket-latent-fm-sg-unite-denoiser90m-sum14-cfg4-finalval1-full-s42-ice-t-h100h200-20260910-v1
    controlled_changes_from_reference:
      - optimizer_and_lr_schedule
      - standard_240k_step_budget
      - standard_40k_checkpoint_cadence
