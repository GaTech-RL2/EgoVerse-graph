# Cotrain Diffusion Policy: yam_bimanual + human_bimanual, time-indexed actions.
#
# Graph DP equivalent of hpt_abc_mecka_cotrain_flow_shared_head_baseline.
# Both embodiments share all observation keys:
#   observations.images.front_img_1  (yam: 480x640, human: 360x640)
#   observations.state.ee_pose       (14D for both -- human is padded by
#                                     arc_tokenizer_cartesian_gripper_padded)
#   actions_cartesian                (100, 14) time-indexed chunk
#
# A single FusedObsEncoder serves both embodiments because:
#   (a) Both key names are identical after the keymap.
#   (b) VisualCore crops to crop_height x crop_width (324x576) before the
#       backbone, so 480x640 and 360x640 inputs produce the same-shaped feature
#       maps. image_size/image_width describe the pre-crop input for the
#       SpatialSoftmax grid; they are set to the smaller (human) size. If yam's
#       image_hw in the cotrain data config is [480, 640] and VisualCore
#       validates the raw size, change it to [360, 640].
#
# condition_dim = 64 (SpatialSoftmax, num_kp=32) + 14 (ee_pose) = 78.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 3
  stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: observations.images.front_img_1
        ee_pose: observations.state.ee_pose
      encoder:
        _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
        obs_specs:
          ee_pose: {input_dim: 14, input_slice: [0, 14]}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 360
            image_width: 640
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 324
            crop_width: 576
            crop_eval_mode: center
            crop_sample_mode: v02
            crop_scope: frame
            norm_layer: group
            pool_type: spatial_softmax
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: 100
      action_dim: 14
      noise_scheduler: &cotrain_baseline_scheduler
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: 100
      action_dim: 14
      condition_input_dim: 78
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: 100
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.ConditionalUnet1D
          input_dim: 14
          cond_dim: 78
          ac_latent_seq: 1
          diffusion_step_embed_dim: 256
          down_dims: [256, 512, 1024]
          kernel_size: 3
        noise_scheduler: *cotrain_baseline_scheduler
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-4
  weight_decay: 1.0e-4
# Constant LR matching the HPT cotrain runs (3e-4 constant, no scheduler).
scheduler: null

# Inference semantics belong to this model; station calibration is separate.
inference:
  input:
    history_length: 1
    keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    - embodiment
    history_keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    constants:
      embodiment: 7
  native_output:
    key: pred_action
    representation: normalized_action
    shape:
    - 100
    - 14
    timing:
      kind: uniform_resampled_target
      temporally_resolved: true
      first_source_frame: 0
      last_source_frame: 44
      source_fps: 30.0
    frame: eef_frame
  output:
    key: actions
    representation: cartesian
    shape:
    - 45
    - 14
    timing:
      kind: control_period
      temporally_resolved: true
      dt: 0.03333333333333333
    frame: eef_frame
  compatibility:
    normalizer_schema:
      action_key: actions_cartesian
      native_shape:
      - 100
      - 14
    tokenizer: null
  profiles:
    default:
      stage_id: sampler
      native_shape:
      - 100
      - 14
      adapter:
        _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
        decoder:
          _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
          native_shape:
          - 100
          - 14
          native_duration: 1.4666666666666666
          output_horizon: 45
          output_dt: 0.03333333333333333
          angular_indices:
          - 3
          - 4
          - 5
          - 10
          - 11
          - 12
        rotation_mode: euler
        action_frame: eef_frame
      overrides:
        inference_steps:
          label: Sampling steps
          description: Solver iterations per prediction.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 100
          target:
            kind: stage_attribute
            stage_id: sampler
            attribute_path: policy.num_inference_steps
        replan_every:
          label: Actions before replanning
          description: Execute this prefix before predicting again.
          type: integer
          min: 1
          max: 45
          step: 1
          default: 16
          target:
            kind: policy_attribute
            attribute_path: replan_every
