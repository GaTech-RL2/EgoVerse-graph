# Diffusion Policy over arc-length tokens for YAM bimanual cartesian actions.
#
# Arc tokenization happens loader-side (action_mode: arc_tokenizer_cartesian in
# the data config's transform_list), so `actions_cartesian` arrives as an
# (M+1, 14) arc token rather than a time-indexed chunk. ActionTargetBuilder
# passes it straight through as `target`; the diffusion stages model tokens.
#
# The ArcTokenizeStage / ArcDetokenizeStage in stages_arc.py are Planar-specific
# (native_action_dim in {2,3,4}) and are NOT used here.
#
# The only structural difference from abc/yam_bimanual_dp is action_horizon,
# which is driven by abc.arc_token_rows (M+1 = 101) in the experiment YAML
# rather than abc.action_horizon (16).
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 3
  stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: observations.images.front_img_1
        ee_pose: observations.state.ee_pose
      encoder: ${abc.encoder}
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: ${abc.action_dim}
      noise_scheduler: &abc_arc_scheduler
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: ${abc.action_dim}
      condition_input_dim: ${abc.condition_dim}
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: ${abc.arc_token_rows}
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.ConditionalUnet1D
          input_dim: ${abc.action_dim}
          cond_dim: ${abc.condition_dim}
          ac_latent_seq: 1
          diffusion_step_embed_dim: 256
          down_dims: [256, 512, 1024]
          kernel_size: 3
        noise_scheduler: *abc_arc_scheduler
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-6
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 240000
  warmup_steps: 500
  warmup_start_factor: 1.0e-8
  eta_min: 0.0

# Inference semantics belong to this model; station calibration is separate.
inference_interval_support:
  per_waypoint: true
  duration: true
  mean: false
inference:
  input:
    history_length: 1
    keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    - embodiment
    history_keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    constants:
      embodiment: 7
  native_output:
    key: pred_action
    representation: normalized_action
    shape:
    - ${abc.arc_token_rows}
    - ${abc.action_dim}
    timing:
      kind: ${abc.arc_velocity_mode}
      temporally_resolved: ${oc.select:model.inference_interval_support.${abc.arc_velocity_mode},false}
    frame: eef_frame
  output:
    key: actions
    representation: cartesian
    shape:
    - 100
    - 14
    timing:
      kind: control_period
      temporally_resolved: true
      dt: 0.03333333333333333
    frame: eef_frame
  compatibility:
    normalizer_schema:
      action_key: actions_cartesian
      native_shape:
      - ${abc.arc_token_rows}
      - ${abc.action_dim}
    tokenizer:
      _target_: egomimic.robot.arc_decoder.BimanualIntervalArcDecoder
      velocity_mode: ${abc.arc_velocity_mode}
      min_distance_unit: ${abc.arc_distance}
      resampled_vector_length: ${abc.arc_waypoints}
      dt: 0.03333333333333333
      action_horizon: 100
  profiles:
    default:
      stage_id: sampler
      native_shape:
      - ${abc.arc_token_rows}
      - ${abc.action_dim}
      adapter:
        _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
        decoder:
          _target_: egomimic.robot.arc_decoder.BimanualIntervalArcDecoder
          velocity_mode: ${abc.arc_velocity_mode}
          min_distance_unit: ${abc.arc_distance}
          resampled_vector_length: ${abc.arc_waypoints}
          dt: 0.03333333333333333
          action_horizon: 100
        rotation_mode: euler
        action_frame: eef_frame
      overrides:
        inference_steps:
          label: Sampling steps
          description: Solver iterations per prediction.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 100
          target:
            kind: stage_attribute
            stage_id: sampler
            attribute_path: policy.num_inference_steps
        replan_every:
          label: Actions before replanning
          description: Execute this prefix before predicting again.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 30
          target:
            kind: policy_attribute
            attribute_path: replan_every
