# @package _global_
defaults:
- /experiment/_shared/frozen_yam/base
- override /model: abc_arc/frozen_yam_hpt_flow
- override /data: abc_arc/stationery_slowpace366_bc_time
- override /trainer: ddp
- override /logger: wandb
- override /callbacks: checkpoints
- _self_
name: bc_rl2_stattempo_slowpace366_${frozen_yam.variant}
description: h640t8_d384x10_cos10k_240k_s42_${name}
ft:
  max_steps: 240000
  warmup_steps: 10000
init_weights_from: null
paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
  work_dir: null
trainer:
  default_root_dir: null
  max_epochs: -1
  min_epochs: 0
  devices: 1
  limit_val_batches: 80
  check_val_every_n_epoch: 200
  num_nodes: 1
  num_sanity_val_steps: 2
  max_steps: ${ft.max_steps}
callbacks:
  model_checkpoint:
    filename: epoch-{epoch:04d}-step-{step:08d}
    every_n_epochs: null
    every_n_train_steps: 30000
    auto_insert_metric_name: false
logger:
  wandb:
    save_dir: null
    id: ${name}_s42
    project: arc
    tags:
    - rl2
    - stationery
    - stattempo
    - slowpace366
    - bc
    - ${frozen_yam.variant}
    resume: never
norm_stats:
  sample_frac: 0.2
  save_cache_dir: null
frozen_yam:
  policy_domain: yam
  variant: time
  spread: stationery
  train_root: unused-s3-resolver
  valid_root: unused-s3-resolver
arc_tokenizer:
  min_distance_unit: 0.4
  resampled_vector_length: 100
hpt:
  embed_dim: 640
  num_blocks: 8
  stem_specs:
    cross_attn:
      crossattn_dim_head: 80
      modality_embed_dim: 640
  action_dim: 14
  action_horizon: 100
