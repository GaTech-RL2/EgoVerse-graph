# Graph PI stage; source model/prompt/optimizer settings retained.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-05
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.0
scheduler:
  _target_: transformers.optimization.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 2000
scheduler_interval: step
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
  - _target_: egomimic.pipeline.stages_pi05.PI05Stage
    _recursive_: false
    policy:
      _target_: egomimic.campaigns.pi05.policy.PI
      config:
        pytorch_training_precision: bfloat16
        pytorch_weight_path: ${pi05.pretrained_weights}
        reverse_kl_samples: 1
        model:
          pi05: true
          action_dim: 32
          action_horizon: 100
          max_token_len: 180
      tokenizer_model_name: google/paligemma-3b-mix-224
      tokenizer_max_length: 128
      sampling_mode: random
      annotation_key: annotations
      default_prompt: ''
      proprio_in_prompt: true
      embodiment_label: false
      state_num_bins: 256
      control_mode: null
      train_image_augs:
        _target_: torchvision.transforms.Compose
        transforms:
        - _target_: torchvision.transforms.Resize
          size: 224
          interpolation: 3
      eval_image_augs:
        _target_: torchvision.transforms.Compose
        transforms:
        - _target_: torchvision.transforms.Resize
          size: 224
          interpolation: 3
      camera_transforms: {}
      ac_keys:
        eva_bimanual: actions_cartesian
        human_bimanual: actions_cartesian
      domains:
      - eva_bimanual
      - human_bimanual
      action_converters:
        rules:
          EVA_BIMANUAL:
            _target_: egomimic.campaigns.pi05.action_encoding.RobotBimanualCartesianEuler
          HUMAN_BIMANUAL:
            _target_: egomimic.campaigns.pi05.action_encoding.HumanBimanualCartesianEuler
        fallback:
          _target_: egomimic.campaigns.pi05.action_encoding.BaseActionConverter
      action_encoding: cartesian_normalized_rot6d
    init_weights_ckpt: null
