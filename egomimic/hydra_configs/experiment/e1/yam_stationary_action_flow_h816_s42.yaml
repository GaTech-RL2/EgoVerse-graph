# @package _global_
# YAM Search Sort Stationary, front camera + robot state, 14-D Cartesian H100.
# Source, dataset and normalization identities are injected by the live launcher.
defaults:
  - /experiment/e1/abc_base
  - override /data: e1/yam_stationary_action_flow_val01
  - override /model: e1/yam_stationary_action_flow_h816
  - override /evaluator: e1/yam_action_flow
  - _self_

name: yam_stationary_action_flow_h816_s42
description: yam_stationary_action_flow_h816_s42
seed: 42
e1:
  variant: time
  spread: stationary
  data_root: ???
  train_root: null
  valid_root: null
  chunk_length: 100
  action_dim: 14
  action_horizon: 100

launch_params: {gpus_per_node: 1, nodes: 1}
trainer:
  max_steps: 80000
  max_epochs: -1
  limit_train_batches: 1.0
  val_check_interval: 5000
  # Four-condition batches across 256 batches retain the original 1024
  # validation windows while the one-H100 execution batch is reduced.
  limit_val_batches: 256
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  # Training forwards at microbatches 128 and 32 exhausted H100 memory in the
  # Action Flow decoder JVP. Eight x sixteen preserves the effective optimizer
  # batch without changing the number of optimizer steps.
  accumulate_grad_batches: 16
  strategy: auto
  precision: bf16-mixed
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

norm_stats:
  norm_mode: minmax
  sample_frac: 1.0
  num_workers: 8
  precomputed_norm_path: null

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
    save_last: link
    save_top_k: -1
    every_n_train_steps: 5000
    every_n_epochs: null
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

eval_checkpoint:
  use_ema: true

logger:
  wandb:
    project: pushshapes-action-flow

run_provenance:
  source_commit: null
  normalization_sha256: null
  split_manifest_sha256: 0921605ce6f5cddec682691cabd043f06badd277b3c66d3c359c01db90d95489
  dataset_content_aggregate_sha256: null
  split_seed: 42
  valid_ratio: 0.01
  train_episode_count_per_domain: 227
  valid_episode_count_per_domain: 2
  union_episode_count_per_domain: 229
  id_overlap_count: 0
  resolved_path_overlap_count: 0
  action_contract:
    representation: yam_cartesian_xyz_ypr_gripper_14d
    prediction_horizon: 100
    native_decoder: none
  architecture:
    family: action_flow_with_separate_released_unite_modules
    tokenizer: UniteDiTBackbone_h816_d12_h12
    denoiser: UniteDiTBackbone_h816_d12_h12
    decoder: UniteActionDecoder_h816_d12_h12
    action_shape: [100, 14]
    latent_shape: [8, 16]
    observation_condition_dim: 256
  objective:
    method: latent_fm_stopgrad_unite
    flow_clean_gradient_mode: all_stopgrad
    reconstruction_is_optimizer_objective: true
    flow_weight: 1.0
    reconstruction_weight: 1.0
    action_velocity_weight: 1.0
    flow_samples_per_content: 14
    flow_mini_batch: 14
  inference:
    sampler: dopri5
    steps: 50
    timestep_shift_alpha: 0.5
    classifier_free_guidance: false
  energy_score_contract:
    sample_count: 32
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    distance_type: yam_cartesian_14d_chunk_v1
