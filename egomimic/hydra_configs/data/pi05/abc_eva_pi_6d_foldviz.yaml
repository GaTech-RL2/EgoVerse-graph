# ABC_EVA_PI_6D_FOLDVIZ — abc_eva_pi_6d with the CORRECT abc top-camera
# extrinsics (extrinsics_key=abc_fold_viz) baked into the base->cam proprio
# conversion, matching the remote wristframe-6d runs. The legacy
# abc_eva_pi_6d.yaml keeps x5Dec13_2 for compatibility with the existing
# finetune checkpoints. Wrist-relative action targets are invariant to the
# extrinsics; only the proprio/State frame (and the eval-viz revert frame)
# changes — so this config requires ITS OWN norm stats
# (norm_stats/abc_eva_6d_foldviz, via norm_abc_eva_foldviz.sbatch).
#
# Primary consumer: the eva half of the combined pretrain (the eva blocks in
# mecka_abc_pi_6d.yaml mirror this config) and its norm precompute.
# Graph port: train_viz is a nested validation group; episode filters retained.
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
_recursive_: false
source_fps: 30.0
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
        camera_keys:
          observations.images.front_img_1: observations.images.front_img_1
          observations.images.left_wrist_img: observations.images.left_wrist_img
          observations.images.right_wrist_img: observations.images.right_wrist_img
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: 6D
        extrinsics: &id001
          left:
          - - -0.00540728648402
            - -0.91864395735192
            - 0.39504941573641
            - -0.07230219027034
          - - -0.99924104589933
            - -0.01027605228132
            - -0.03757306135427
            - -0.23692835817344
          - - 0.03857581422213
            - -0.39495275966919
            - -0.91789118319482
            - 0.9778307002508
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
          right:
          - - -0.00540728648402
            - -0.91864395735192
            - 0.39504941573641
            - -0.07230219027034
          - - -0.99924104589933
            - -0.01027605228132
            - -0.03757306135427
            - -0.23692835817344
          - - 0.03857581422213
            - -0.39495275966919
            - -0.91789118319482
            - 0.9778307002508
          - - 0.0
            - 0.0
            - 0.0
            - 1.0
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: str(row.get(''embodiment'', '''')) == ''eva_bimanual'''
      - 'lambda row: ''/abc/'' in str(row.get(''zarr_processed_path'', ''''))'
    mode: train
    valid_ratio: 0.05
valid_datasets:
  valid:
    eva_bimanual:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
      resolver:
        _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
        folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
        key_map:
          _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
          keymap_mode: cartesian
          annotation_key: annotations
          camera_keys:
            observations.images.front_img_1: observations.images.front_img_1
            observations.images.left_wrist_img: observations.images.left_wrist_img
            observations.images.right_wrist_img: observations.images.right_wrist_img
        transform_list:
          _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
          action_mode: cartesian
          coord_frame: eef_frame
          rotation_mode: 6D
          extrinsics: *id001
        image_hw:
        - 480
        - 640
      filters:
        _target_: egomimic.rldb.filters.DatasetFilter
        filter_lambdas:
        - 'lambda row: str(row.get(''embodiment'', '''')) == ''eva_bimanual'''
        - 'lambda row: ''/abc/'' in str(row.get(''zarr_processed_path'', ''''))'
      mode: valid
      valid_ratio: 0.05
  train_viz:
    eva_bimanual:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
      resolver:
        _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
        folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
        key_map:
          _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
          keymap_mode: cartesian
          annotation_key: annotations
          camera_keys:
            observations.images.front_img_1: observations.images.front_img_1
            observations.images.left_wrist_img: observations.images.left_wrist_img
            observations.images.right_wrist_img: observations.images.right_wrist_img
        transform_list:
          _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
          action_mode: cartesian
          coord_frame: eef_frame
          rotation_mode: 6D
          extrinsics: *id001
        image_hw:
        - 480
        - 640
      filters:
        _target_: egomimic.rldb.filters.DatasetFilter
        filter_lambdas:
        - 'lambda row: str(row.get(''embodiment'', '''')) == ''eva_bimanual'''
        - 'lambda row: ''/abc/'' in str(row.get(''zarr_processed_path'', ''''))'
      mode: train
      valid_ratio: 0.05
train_dataloader_params:
  eva_bimanual:
    batch_size: 64
    num_workers: 8
valid_dataloader_params:
  valid:
    eva_bimanual:
      batch_size: 64
      num_workers: 8
      shuffle: false
  train_viz:
    eva_bimanual:
      batch_size: 32
      num_workers: 2
      shuffle: false
