# @package _global_
# Non-ARC control matched to the ARC stream models' HPT trunk and flow-head
# capacity. It keeps the same ABC towel split and open-loop evaluator.
defaults:
  - /experiment/abc_arc/robot_bc/abc_towels_hpt180_baseline_visual_openloop
  - _self_

name: abc_towels_hpt180_baseline_param_matched_visual_openloop
description: HPT baseline parameter-matched to ARC shape/velocity ablations
abc:
  task_predicate: "row['task'] == 'fold and stack the towels'"

hpt:
  embed_dim: 640
  num_blocks: 19
  num_heads: 8
  action_dim: 14
  action_horizon: 100
  flow_blocks: 10
  flow_hidden_dim: 384

trainer:
  accumulate_grad_batches: 2

logger:
  wandb:
    id: pace_abc_towels_shape_velocity_baseline_20260930
    name: pace_abc_towels_shape_velocity_baseline_20260930
    resume: never
    tags: [hpt180, abc, towels, visual_only, no_language, baseline, parameter_matched, open_loop, video]
