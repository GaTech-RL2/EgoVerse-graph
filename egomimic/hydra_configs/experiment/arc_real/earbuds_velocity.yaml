# @package _global_
defaults:
- /model/base/real_yam_settings
- /model_contract/arc_clock_settings
- override /model: hpt/yam_300m_arc
- override /data: abc_arc/earbuds_arc
- override /evaluator: eval_open_loop_sim
- override /trainer: real_yam
- override /callbacks: real_yam
- override /logger: wandb
- _self_
yam:
  policy_domain: yam
  variant: arc
  spread: earbuds
  train_root: unused-s3-resolver
  valid_root: unused-s3-resolver
  train_mode: total
  valid_mode: total
  D: ${abc.arc_distance}
  M: ${abc.arc_waypoints}
  time_rows: 100
  chunk_length: 100
  h_match_frames: 40
  limit_val_batches: 40
  prog_horizon_m: 0.19
  anchor_sampler: null
  arcmatch_gt_span_m: null
  action_dim: 14
  action_horizon: 100
  image_weights: DEFAULT
  yam_source_frames: ${abc.arc_source_buffer_frames}
name: earbuds_velocity
description: h840t19_d320x6_cos10k_240k_${name}
arc_tokenizer:
  min_distance_unit: ${abc.arc_distance}
  resampled_vector_length: ${abc.arc_waypoints}
norm_stats:
  sample_frac: 0.2
  num_workers: 8
  save_cache_dir: null
hpt:
  action_horizon: ${abc.arc_token_rows}
  token_dim: ${abc.arc_token_dim}
ft:
  max_steps: 240000
  warmup_steps: 10000
init_weights_from: null
paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
  work_dir: null
logger:
  wandb:
    save_dir: null
    id: ${name}_s${seed}
    project: arc
    tags:
    - rl2
    - earbuds
    - plus69
    - hpt300
    - arcvel
    - interval_speed
    - translation
    - m200_d022
    - open_loop
    resume: never
evaluator:
  arc_video_trajectory_cap_mode: distance
  limit_val_episodes: null
  execute_fraction: 0.25
  distance_dtw_enabled: false
  viz_every_n_epochs: 0
  ground_truth_action_key: actions_time
  action_mode: arc
  min_distance_unit: ${abc.arc_distance}
  resampled_vector_length: ${abc.arc_waypoints}
  arc_execution_cap_mode: waypoints
  arc_chunking_mode: ${abc.arc_chunking_mode}
  rotation_distance_unit: ${abc.arc_rotation_distance}
  clock_mode: ${abc.arc_clock_mode}
  streams: ${abc.arc_streams}
abc:
  arc_streams: translation
  action_mode: hybrid_arc_tokenizer_cartesian
  arc_chunking_mode: multistream
  arc_distance: 0.22
  arc_rotation_distance: 1.7453292519943295
  arc_waypoints: 200
  arc_source_buffer_frames: 100
  arc_gripper_stream_mode: events
  arc_gripper_distance: null
