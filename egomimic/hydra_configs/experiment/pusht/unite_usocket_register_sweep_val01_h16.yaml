# @package _global_
defaults:
  - override /data: pusht/unite_usocket_val01_h16_per_emb_proprio
  - override /evaluator: eval_planar_v2
  - override /logger: wandb

name: unite_usocket_register_sweep_h16
description: clean_action_h16_registers_pooled_obs_adaln_joint_flow14

launch_params:
  gpus_per_node: 2
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  strategy: ddp_find_unused_parameters_true
  log_every_n_steps: 1
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

logger:
  wandb:
    project: pushshapes-flow-transfer

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
    every_n_train_steps: 20000
    every_n_epochs: null
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

eval_checkpoint:
  use_ema: true

run_provenance:
  split_manifest_path: egomimic/hydra_configs/data/pusht/planar_v2_usocket_dp_3k_split_seed42_v1.json
  split_manifest_sha256: 3683e3461596eef8df2432fa865779b3c77b2a2057dabd0fea125595729cf313
  split_seed: 42
  valid_ratio: 0.01
  train_episode_count_per_domain: 2970
  valid_episode_count_per_domain: 29
  union_episode_count_per_domain: 2999
  id_overlap_count: 0
  resolved_path_overlap_count: 0
  action_contract:
    representations:
      pushshapes_sim_u_socket: x_y_cos_theta_sin_theta
  unite_update_schedule:
    mode: joint_reconstruction_plus_flow
    flow_samples_per_reconstruction: 14
    total_optimizer_steps: 240000
  energy_score_contract:
    sample_count: 32
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    validation_view: first_deterministic_validation_batch_per_ddp_rank
    aggregation: condition_mean_then_equal_domain_macro_mean
  unite_training_diagnostics:
    validation_view: first_deterministic_validation_batch_per_ddp_rank
    noise_seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    raw_noise_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    trajectory: every_returned_sampler_state
    sampler: adaptive_dopri5
    returned_sampler_states: 50
    activation_capture: real_forward_hooks_no_replay_or_replacement
    layer_map: all_12_dit_blocks_block_00_through_block_11
    token_pooling: mean_over_tokens_then_one_row_per_validation_condition
    cka: biased_centered_linear_cka
    cknna: platonic_rep_unbiased_hsic_intersection_knn
    cknna_k: 10
    final_latent_cosine: flatten_all_tokens_and_latent_channels_per_condition
    aggregation: condition_mean_then_equal_domain_macro_mean
    artifact: one_immutable_checkpoint_step_rank_batch_artifact

evaluator:
  deterministic_seed: 420042
  unite_diagnostics:
    enabled: true
    noise_seed_bank_path: egomimic/hydra_configs/evaluator/energy_score_seed_bank_k32_v1.json
    noise_seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    raw_noise_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    cknna_k: 10
    max_batches_per_rank: 1
    artifact_root: ${paths.output_dir}/validation_predictions/unite_training_diagnostics
    validation_view:
      definition: first_deterministic_validation_batch_per_ddp_rank
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      per_rank_batch_size: 16
      world_size: ${trainer.devices}
    provenance:
      action_representations: ${run_provenance.action_contract.representations}
      prediction_horizon: ${model.action_horizon}
      sampler: adaptive_dopri5
      returned_sampler_states: 50
      sampler_atol: 1.0e-6
      sampler_rtol: 1.0e-3
      cfg_scale: 4.0
      model_autocast_precision: bf16
      ode_state_precision: fp32
      ode_derivative_precision: fp32
      layer_map: all_12_dit_blocks_block_00_through_block_11
      activation_capture: real_forward_hooks_no_replay_or_replacement
  energy_score_max_batches_per_rank: 1
  energy_score_validation_view:
    definition: first_deterministic_validation_batch_per_ddp_rank
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    per_rank_batch_size: 16
    world_size: ${trainer.devices}
  energy_score_provenance:
    action_representations: ${run_provenance.action_contract.representations}
    prediction_horizon: ${model.action_horizon}
    sampler: dopri5
    sampler_evaluation_points: 50
    sampler_atol: 1.0e-6
    sampler_rtol: 1.0e-3
    model_autocast_precision: bf16
    dopri5_state_precision: fp32
    dopri5_derivative_precision: fp32
    dopri5_error_control_precision: fp32
  semantic_blocks: [[0, 2], [2, 4]]
  native_decoder:
    _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder

# Simulator I/O is an application boundary, not part of PipelineAlgo.
deployment:
  observation_adapter:
    _target_: egomimic.pipeline.pushshapes.USocketModelStateObservationAdapter
  action_decoder:
    _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
