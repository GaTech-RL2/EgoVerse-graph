# ARC Projection base: shared HPT/flow network, one projected-point clock per arm.
defaults:
- /model/e1/hpt_flow_wrists_ft_arcdur@_here_
- _self_
projection_variant: arc_projection_dur
projection_layout: e1_projection_dur
projection_offset_m: [0.02, 0.02, 0.02]
projection_min_speed: 0.000001
projection_speed_smooth_frames: 7
# The dur leaf sets absolute waypoint times (isotonic decode); velocity is delta-only.
projection_duration_timing: delta
data_contracts:
  yam:
    preprocessing:
      '7':
        transforms:
          projection_offset_m: ${model.projection_offset_m}
          projection_min_speed: ${model.projection_min_speed}
          speed_smooth_frames: ${model.projection_speed_smooth_frames}
          duration_timing: ${model.projection_duration_timing}
  human:
    preprocessing:
      '3':
        transforms:
          projection_offset_m: ${model.projection_offset_m}
          projection_min_speed: ${model.projection_min_speed}
          speed_smooth_frames: ${model.projection_speed_smooth_frames}
          duration_timing: ${model.projection_duration_timing}
inference:
  input: ${model.inference_contracts.arcdur.input}
  native_output: ${model.inference_contracts.arcdur.native_output}
  output: ${model.inference_contracts.arcdur.output}
  compatibility:
    normalizer_schema: ${model.inference_contracts.arcdur.compatibility.normalizer_schema}
    source_frames: ${model.contract_source_frames.${e1.policy_domain}}
    tokenizer:
      variant: ${model.projection_variant}
      layout: ${model.projection_layout}
      progress_metric: end_effector_local_projected_point
      projection_offset_m: ${model.projection_offset_m}
      min_speed: ${model.projection_min_speed}
      speed_smooth_frames: ${model.projection_speed_smooth_frames}
      duration_timing: ${model.projection_duration_timing}
      distance: ${e1.D}
      waypoints: ${e1.M}
      velocity_norm: ${e1.velocity_norm}
      fixed_spacing: ${e1.fixed_spacing}
      progress_smooth_hz: ${e1.progress_smooth_hz}
  profiles:
    default:
      stage_id: sampler
      native_shape:
      - ${model.action_horizon}
      - ${model.action_token_dim}
      adapter:
        _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
        decoder:
          _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
          token_layout: ${model.projection_layout}
          speed_encoding: interval
          duration_timing: ${model.projection_duration_timing}
          projection_offset_m: ${model.projection_offset_m}
          projection_min_speed: ${model.projection_min_speed}
          min_distance_unit: ${e1.D}
          resampled_vector_length: ${e1.M}
          dt: 0.03333333333333333
          action_horizon: ${e1.time_rows}
          first_stream: 1
          execute_percent: 50
        rotation_mode: euler
        action_frame: eef_frame
      overrides: ${model.inference_contracts.arcdur.profiles.default.overrides}
