# @package _global_
# Elmo 2026-10-16: the earbuds rollout lacks placement precision because the
# chunk is long and 100 waypoints are too sparse. One change against earbuds_updated_arcvel_nosmooth_hpt300:
# M 100 -> 200 waypoints (D stays 0.4 m). The model's token rows follow M; the decoded chunk stays 100 frames.
defaults:
- /experiment/yam_arc_grid/earbuds_updated_arcvel_nosmooth_hpt300
- _self_
name: earbuds_updated_arcvel_nosmooth_m200_hpt300
e1:
  M: 200
  action_horizon: ${e1.M}
hpt:
  action_horizon: ${e1.M}
arc_tokenizer:
  resampled_vector_length: ${e1.M}
model:
  action_horizon: ${e1.M}
  graph:
    noising:
      action_horizon: ${e1.M}
    sampler:
      action_horizon: ${e1.M}
      model:
        act_seq: ${e1.M}
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          resampled_vector_length: ${e1.M}
  valid_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          resampled_vector_length: ${e1.M}
logger:
  wandb:
    id: ${name}_20261016_s42
    tags: [rl2, wireless_earbuds_updated, hpt300, arcvel, no_speed_smoothing, m200]
