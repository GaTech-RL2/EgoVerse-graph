# @package _global_
defaults:
  - /experiment/oat/libero_base
  - override /data: ravens/continuous
  - override /evaluator: ravens
  - override /logger: wandb
  - _self_
description: Continuous-control red blocks into green bowls; randomized scenes, one goal
normalizer:
  _target_: egomimic.benchmarks.ravens.replay.RavensNormalizer
benchmark:
  suite: ravens-continuous-v1
  task_module: place_red_in_green
  task_class: PlaceRedInGreen
  dataset: ???
  decoded_replay_cache: false
  batch_size: 32
  horizon: 32
  n_obs_steps: 2
  n_action_steps: 16
  control_hz: 20
  max_episode_steps: 4000
trainer:
  max_epochs: -1
  max_steps: 80000
  accumulate_grad_batches: 1
  check_val_every_n_epoch: null
  val_check_interval: 15000
  log_every_n_steps: 10
callbacks:
  model_checkpoint:
    every_n_epochs: null
    every_n_train_steps: 15000
    save_on_train_epoch_end: false
    filename: epoch-{epoch:04d}-step-{step:09d}
    save_top_k: -1
  batch_budget:
    global_batch_size: 32
  ema:
    final_checkpoint_path: ${paths.output_dir}/checkpoints/terminal-epoch-{epoch:04d}-step-{step:09d}.ckpt
val_at_end: false
seed: 42
