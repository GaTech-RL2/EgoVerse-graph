# Graph PI stage; source model/prompt/optimizer settings retained.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-05
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.0
scheduler:
  _target_: transformers.optimization.get_constant_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 2000
scheduler_interval: step
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 0
  stages:
  - _target_: egomimic.pipeline.stages_pi05.PI05Stage
    _recursive_: false
    policy:
      _target_: egomimic.models.pi05.policy.PI
      config:
        pytorch_training_precision: bfloat16
        pytorch_weight_path: ${pi05.pretrained_weights}
        reverse_kl_samples: 4
        model:
          pi05: true
          action_dim: 32
          action_horizon: 100
          max_token_len: 180
      tokenizer_model_name: google/paligemma-3b-mix-224
      tokenizer_max_length: 128
      sampling_mode: random
      annotation_key: annotations
      default_prompt: ''
      proprio_in_prompt: true
      embodiment_label: false
      state_num_bins: 256
      control_mode: null
      train_image_augs:
        _target_: torchvision.transforms.Compose
        transforms:
        - _target_: torchvision.transforms.Resize
          size: 224
          interpolation: 3
      eval_image_augs:
        _target_: torchvision.transforms.Compose
        transforms:
        - _target_: torchvision.transforms.Resize
          size: 224
          interpolation: 3
      camera_transforms: {}
      ac_keys:
        human_bimanual: actions_cartesian
      domains:
      - human_bimanual
      action_encoding: cartesian_normalized_rot6d
      action_converters:
        rules:
          HUMAN_BIMANUAL:
            _target_: egomimic.utils.action_encoding.RobotBimanualCartesianEuler
        fallback:
          _target_: egomimic.utils.action_encoding.BaseActionConverter
    init_weights_ckpt: null

# Inference semantics belong to this model; station calibration is separate.
deployment_domain: human_bimanual
inference_domains:
  human_bimanual:
    input:
      history_length: 1
      keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      - embodiment
      - annotations
      history_keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      constants:
        embodiment: 3
    native_output:
      frame: ${model.coordinate_frame}
      key: pred_action
      representation: normalized_action
      shape:
      - 100
      - 20
      timing:
        kind: uniform_resampled_target
        temporally_resolved: true
        dt: 0.00909090909090909
        first_source_frame: 0
        last_source_frame: 27
        source_fps: 30.0
    output:
      frame: ${model.coordinate_frame}
      key: actions
      representation: cartesian
      shape:
      - 28
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - 100
        - 20
        embodiment: 3
      tokenizer: null
      action_encoding: cartesian_normalized_rot6d
      backend_native_output:
        shape:
        - 100
        - 32
        conversion:
          rules:
            HUMAN_BIMANUAL:
              _target_: egomimic.utils.action_encoding.RobotBimanualCartesianEuler
          fallback:
            _target_: egomimic.utils.action_encoding.BaseActionConverter
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - 100
        - 20
        adapter:
          _target_: egomimic.pipeline.action_adapter.CanonicalSequenceAdapter
          shape:
          - 28
          - 14
          decoder:
            _target_: egomimic.pipeline.sequence_decoder.SequentialActionDecoder
            decoders:
            - _target_: egomimic.robot.action_decoder.CartesianRotationDecoder
              has_gripper: true
            - _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
              native_shape:
              - 100
              - 14
              native_duration: 0.9
              output_horizon: 28
              output_dt: 0.03333333333333333
              angular_indices:
              - 3
              - 4
              - 5
              - 10
              - 11
              - 12
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 10
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: backend.num_steps
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: 28
            step: 1
            default: 28
            target:
              kind: policy_attribute
              attribute_path: replan_every
inference: ${model.inference_domains.${model.deployment_domain}}

# Model-owned data semantics; independent of the selected dataset paths.
coordinate_frame: eef_frame
deployment_frames:
  eef_frame: eef_frame
  camframe: model_frame
data_requirements:
  preprocessing:
    '3':
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        include_grip_keypoints: true
      transforms:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian
        coord_frame: ${model.coordinate_frame}
        rotation_mode: 6D
        stride: 3
        keypoint_gripper: true
      source_fps: 30.0
