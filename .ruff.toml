line-length = 88
target-version = "py311"

exclude = [
  "external",
  # Checkpoint-era ARC compatibility codecs retain source-pinned bytes.
  "egomimic/robot/arc_codecs",
  # Vendored released OAT implementations retain their upstream formatting.
  # First-party factory/diffusion/ARC adapters remain linted normally.
  "egomimic/models/oat/common",
  "egomimic/models/oat/model",
  "egomimic/models/oat/perception",
  "egomimic/models/oat/policy",
  "egomimic/models/oat/tokenizer",
  "egomimic/robot/eva/stanford_repo",
  "*.ipynb",
  "egomimic/robot/oculus_reader"
]

[lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
# Keep the pinned yam-pipeline reference solver byte-for-byte identical.
"egomimic/robot/yam/streaming_ik.py" = ["I001"]

[format]
# Source-pinned upstream implementations: preserve byte-for-byte provenance.
exclude = ["egomimic/robot/yam/quest_mapper.py", "egomimic/robot/yam/streaming_ik.py"]
