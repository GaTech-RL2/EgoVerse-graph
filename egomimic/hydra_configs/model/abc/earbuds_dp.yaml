# Standard epsilon-prediction Diffusion Policy on the same native 100-frame,
# three-camera YAM observations as the earbuds ARC recipe. The shared model
# contract prevents inheriting the historical ABC DP 45-frame rollout clock.
defaults:
- /model_contract/e1_wrists@_here_
- _self_

_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
action_horizon: 100
action_token_dim: 14
condition_dim: 206 # Three 64D image features plus the 14D bimanual proprio pose.
sampling_steps: 100
sampling_attribute: policy.num_inference_steps

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 3
  stages:
  - ${model.graph.encoder}
  - ${model.graph.target}
  - ${model.graph.noising}
  - ${model.graph.sampler}
  - ${model.graph.loss}

graph:
  encoder:
    _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    inputs:
      front_img_1: observations.images.front_img_1
      left_wrist_img: observations.images.left_wrist_img
      right_wrist_img: observations.images.right_wrist_img
      ee_pose: observations.state.ee_pose
    encoder:
      _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
      obs_specs:
        ee_pose:
          input_dim: 14
          input_slice: [0, 14]
      img_encoders:
        front_img_1: &image_encoder
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 480
          image_width: 640
          num_kp: 32
          feature_dimension: 64
          pretrained: false
          crop_aug: true
          crop_height: 432
          crop_width: 576
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: group
          pool_type: spatial_softmax
        left_wrist_img: *image_encoder
        right_wrist_img: *image_encoder
  target:
    _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: actions_cartesian
  noising:
    _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
    action_horizon: ${model.action_horizon}
    action_dim: ${model.action_token_dim}
    noise_scheduler: &noise_scheduler
      _target_: egomimic.models.ddim_scheduler.DDIMScheduler
      num_train_timesteps: 100
      beta_schedule: squaredcos_cap_v2
      prediction_type: epsilon
  sampler:
    _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
    action_horizon: ${model.action_horizon}
    action_dim: ${model.action_token_dim}
    condition_input_dim: ${model.condition_dim}
    policy:
      _target_: egomimic.models.diffusion_policy.DiffusionPolicy
      action_horizon: ${model.action_horizon}
      num_inference_steps: ${model.sampling_steps}
      model:
        _target_: egomimic.models.denoising_nets.ConditionalUnet1D
        input_dim: ${model.action_token_dim}
        cond_dim: ${model.condition_dim}
        ac_latent_seq: 1
        diffusion_step_embed_dim: 256
        down_dims: [256, 512, 1024]
        kernel_size: 3
      noise_scheduler: *noise_scheduler
  loss:
    _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

# Preserve the conventional YAM DP optimizer and schedule. These differ from
# the ARC recipe's weight decay / warmup / terminal LR and must be disclosed
# when comparing the complete model recipes.
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-6
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: ${ft.max_steps}
  warmup_steps: 500
  warmup_start_factor: 1.0e-8
  eta_min: 0.0
scheduler_interval: step
