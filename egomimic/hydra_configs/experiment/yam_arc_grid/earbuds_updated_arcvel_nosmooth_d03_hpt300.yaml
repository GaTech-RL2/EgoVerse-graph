# @package _global_
# Elmo 2026-10-16: the earbuds rollout lacks placement precision because the
# chunk is long. One change against earbuds_updated_arcvel_nosmooth_hpt300: D 0.4 -> 0.3 m of translation
# path per chunk (M stays 100), so waypoints sit 3 mm apart instead of 4 mm and each chunk is shorter.
defaults:
- /experiment/yam_arc_grid/earbuds_updated_arcvel_nosmooth_hpt300
- _self_
name: earbuds_updated_arcvel_nosmooth_d03_hpt300
e1:
  D: 0.3
arc_tokenizer:
  min_distance_unit: ${e1.D}
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          min_distance_unit: ${e1.D}
  valid_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          min_distance_unit: ${e1.D}
logger:
  wandb:
    id: ${name}_20261016_s42
    tags: [rl2, wireless_earbuds_updated, hpt300, arcvel, no_speed_smoothing, d03]
