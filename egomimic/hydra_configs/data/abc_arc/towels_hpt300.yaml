defaults:
- /data/abc_arc/stationery_tempo_fast_time@_here_
- _self_
train_datasets:
  yam_bimanual:
    resolver:
      transform_list:
        variant: ${e1.variant}
    filters:
      filter_lambdas:
      - 'lambda row: row[''lab''] == ''rl2'' and row[''task''] == ''fold_towels'' and row[''embodiment'']
        == ''yam_bimanual'' and not row[''is_deleted''] and not row[''is_eval''] and row[''num_frames'']
        > 0 and bool(row[''zarr_processed_path'']) and not row[''zarr_processing_error'']'
valid_datasets:
  yam_bimanual:
    resolver:
      transform_list:
        variant: ${e1.variant}
    filters:
      filter_lambdas:
      - 'lambda row: row[''lab''] == ''rl2'' and row[''task''] == ''fold_towels'' and row[''embodiment'']
        == ''yam_bimanual'' and not row[''is_deleted''] and not row[''is_eval''] and row[''num_frames'']
        > 0 and bool(row[''zarr_processed_path'']) and not row[''zarr_processing_error'']'
