name: action_flow_cotrain_chain4919_usocket2999_private_codec_h384_d18_sum14_cfg4_val8_s42
description: "Balanced ChainGripper/U-Socket Action Flow with private H384 codecs and a shared depth-18 UNITE field"

train:
