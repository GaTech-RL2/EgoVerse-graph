# dp300pt: dp300_wrists_arcdur with ImageNet-pretrained ResNet-18 encoders (pretrained: true) and their stock
# BatchNorm kept (norm_layer: batch; the group swap would re-init the pretrained norm layers). Aidan 2026-09-28:
# "all models should be inited from the pretrained resnet weights". Encoders stay unfrozen. No EMA, so BN is safe.
#
# DP-300M arcdur model for the towels394 grid (Aidan 2026-09-27: "on the same model size using DP", matched to
# HPT-300M, front + both wrist cameras). The lab's graph DP-300M (model/abc_arc/yam_mecka_cotrain_dp_300M_arc_D40_M100:
# 64-keypoint spatial-softmax VisualCore encoders, ConditionalUnet1D down_dims [512, 1024, 2048], DDIM 100 steps,
# epsilon loss) with three changes for this grid: one encoder per camera (the three views the HPT runs see,
# 480x640 frames, 90 % random crop), condition 3 x 128 + 14 = 398, and the E1 arcdur action (100, 16) instead
# of canonical arc tokens. Optimizer and warmup-cosine schedule match the HPT runs (the source config had none).
_target_: egomimic.pl_utils.pl_model.ModelWrapper
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
  - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    inputs:
      front_img_1: observations.images.front_img_1
      left_wrist_img: observations.images.left_wrist_img
      right_wrist_img: observations.images.right_wrist_img
      ee_pose: observations.state.ee_pose
    encoder:
      _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
      obs_specs:
        ee_pose:
          input_dim: 14
          input_slice:
          - 0
          - 14
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 480
          image_width: 640
          num_kp: 64
          feature_dimension: 128
          pretrained: true
          crop_aug: true
          crop_height: 432
          crop_width: 576
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: batch
          pool_type: spatial_softmax
        left_wrist_img:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 480
          image_width: 640
          num_kp: 64
          feature_dimension: 128
          pretrained: true
          crop_aug: true
          crop_height: 432
          crop_width: 576
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: batch
          pool_type: spatial_softmax
        right_wrist_img:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 480
          image_width: 640
          num_kp: 64
          feature_dimension: 128
          pretrained: true
          crop_aug: true
          crop_height: 432
          crop_width: 576
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: batch
          pool_type: spatial_softmax
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: actions_cartesian
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
    action_horizon: 100
    action_dim: 16
    noise_scheduler:
      _target_: egomimic.models.ddim_scheduler.DDIMScheduler
      num_train_timesteps: 100
      beta_schedule: squaredcos_cap_v2
      prediction_type: epsilon
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
    action_horizon: 100
    action_dim: 16
    condition_input_dim: 398
    policy:
      _target_: egomimic.models.diffusion_policy.DiffusionPolicy
      action_horizon: 100
      num_inference_steps: 100
      model:
        _target_: egomimic.models.denoising_nets.ConditionalUnet1D
        input_dim: 16
        cond_dim: 398
        ac_latent_seq: 1
        diffusion_step_embed_dim: 512
        down_dims:
        - 512
        - 1024
        - 2048
        kernel_size: 3
      noise_scheduler:
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: ${ft.max_steps}
  warmup_steps: ${ft.warmup_steps}
  warmup_start_factor: 0.1
  eta_min: 1.0e-05
scheduler_interval: step
