# @package _global_
# Time-indexed BASELINE twin of abc_fstshirt_mecka_freefold_cotrain_arcD40M100.
#
# Same episodes, same limits, same trunk/stems/head as the arc run. The only
# difference is the action space: a time-parameterized chunk instead of
# (M+1, 14) arc-length tokens. That is what makes the two runs comparable.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fstshirt_mecka_freefold_cotrain_baseline
defaults:
  - override /model: abc_arc/yam_mecka_cotrain_dp_baseline
  - override /data: abc_arc/abc_fstshirt_mecka_freefold_baseline_cotrain
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_pace
  - _self_

name: abc_fstshirt_mecka_freefold_cotrain_baseline
description: baseline

paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/arc_abc

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

logger:
  wandb:
    project: abc-yam
    tags:
      - abc
      - cotrain
      - baseline

# Arc metrics ON, matching the arc twin's tokenizer settings, so the two arms
# land on the same arcmatch charts. This evaluator serves both: it detects the
# run type from the prediction's shape, so this baseline's pose chunk is
# de-interpolated to the raw window instead of detokenized.
evaluator:
  arc_metrics: true
  include_reconstruction_loss: false
  arcmatch_distance: 0.40
  arcmatch_points: 32
  arc_chunk_rows: 45
  resampled_vector_length: 100
  velocity_mode: per_waypoint
  rot_lever_m: 0.1
