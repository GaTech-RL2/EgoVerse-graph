# @package _global_
defaults:
  - /experiment/pusht/planar_v2_base
  - override /data: pusht/action_flow_usocket_val01_h16_common4
  - override /model: bf/us_action_flow_bc_nt16_d8_h512
  - _self_

name: action_flow_bc_usocket_recon1_s42
description: h16_z8_adaln12x512_k14_recon1_action1
seed: 42

launch_params: {gpus_per_node: 1, nodes: 1}

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 1.0
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  strategy: auto
  sync_batchnorm: false
  log_every_n_steps: 10
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

model:
  reconstruction_weight: 1.0

norm_stats:
  norm_mode: quantile
  sample_frac: 1.0
  num_workers: 4
  precomputed_norm_path: null

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
    # A symlink avoids two byte-distinct serializations at the same semantic
    # step, which the preemption runner correctly treats as a checkpoint fork.
    save_last: link
    save_top_k: -1
    every_n_train_steps: 40000
    every_n_epochs: null

logger:
  wandb:
    project: pushshapes-action-flow

planar:
  action_dims: {pushshapes_sim_u_socket: 4}
  action_horizon: 16
  observation_horizon: 1
  batch_size: 32
  eval_native_decoder:
    _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder

evaluator:
  native_decoder: ${planar.eval_native_decoder}
  semantic_blocks: [[0, 2], [2, 4]]
  # Typed EnergyScore distance over the complete H16 chunk. Translation uses
  # normalized XY; rotation is recovered through the bound train normalizer and
  # native atan2 decoder, wrapped on S1, and divided by pi to be dimensionless.
  energy_score_distance:
    type: usocket_normalized_xy_wrapped_theta_v1
    complete_normalized_chunk_shape: [16, 4]
    normalized_translation_indices: [0, 1]
    native_theta_index: 2
    rotation_scale_radians: 3.141592653589793
    semantic_weights: {translation: 0.5, rotation: 0.5}
    native_decoder: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
  deterministic_seed: 420042
  energy_score_max_batches_per_rank: 1
  energy_score_validation_view:
    definition: first_deterministic_validation_batch_per_ddp_rank
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    per_rank_batch_size: 16
    world_size: 1
  energy_score_provenance:
    source_commit: ${run_provenance.source_commit}
    normalization_sha256: ${run_provenance.normalization_sha256}
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    resolved_config_path: ${paths.output_dir}/.hydra/config.yaml
    wandb:
      entity: ${logger.wandb.entity}
      project: ${logger.wandb.project}
      run_id: ${logger.wandb.id}
    distance_contract: ${evaluator.energy_score_distance}
    dataset_content:
      manifest_path: ${run_provenance.content_manifest_path}
      manifest_sha256: ${run_provenance.content_manifest_sha256}
      aggregate_sha256: ${run_provenance.dataset_content_aggregate_sha256}
    action_representation: x_y_cos_theta_sin_theta
    prediction_horizon: 16
    sampler: reverse_euler
    sampler_steps: ${model.num_inference_steps}
    model_autocast_precision: bf16
  action_flow_diagnostics:
    enabled: true
    noise_seed_bank_path: ${hydra:runtime.cwd}/egomimic/hydra_configs/evaluator/energy_score_seed_bank_k32_v1.json
    noise_seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    raw_noise_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    max_batches_per_rank: 1
    max_samples: 16
    jacobian_samples: 2
    capture_activations: true
    activation_layer_map: {0: 0, 1: 11}
    cknna_k: 10
    native_error:
      enabled: true
      type: usocket_native_xy_wrapped_theta_mse_v1
      space: decoded_native_x_y_theta_radians
      native_theta_index: 2
      wrap_period_radians: 6.283185307179586
      reduction: mean_squared_error_over_horizon_and_native_coordinates
      normalizer: bound_train_only_evaluator_normalizer
      native_decoder: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
    artifact_root: ${paths.output_dir}/validation_predictions/action_flow_diagnostics
    validation_view:
      definition: first_deterministic_validation_batch_per_rank
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      per_rank_batch_size: 16
      world_size: 1
    provenance:
      source_commit: ${run_provenance.source_commit}
      normalization_sha256: ${run_provenance.normalization_sha256}
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      dataset_content:
        manifest_sha256: ${run_provenance.content_manifest_sha256}
        aggregate_sha256: ${run_provenance.dataset_content_aggregate_sha256}
      action_representation: x_y_cos_theta_sin_theta
      clean_endpoint: t0
      gaussian_endpoint: t1
      latent_shape: [16, 8]
      flow_samples_per_content: ${model.flow_samples_per_content}
      condition_dropout_probability: ${model.condition_dropout_probability}
      sampler: reverse_euler
      sampler_steps: ${model.num_inference_steps}
      fixed_level_coupling: one_clean_latent_and_one_gaussian_per_condition
      decoder_jacobian_evaluation: declared_bridge_state_at_each_fixed_noise_level
      activation_capture: real_forward_hooks_without_replay_or_replacement

run_provenance:
  # The portable launcher replaces these with exact immutable identities before
  # any optimizer/validation run. Null keeps read-only local Hydra composition
  # deterministic without inventing a source or normalization identity.
  source_commit: null
  normalization_sha256: null
  content_manifest_path: egomimic/hydra_configs/data/pusht/manifests/usocket_3000_v2_clean_content_v1.json
  content_manifest_sha256: a1c81fb0ce8967aba795383a293180f9ba08a0ecfdd6f4a878afb20b39733761
  dataset_content_aggregate_sha256: 80f835ad37c3d5c5b7b2d5c3e1656c307ee567a1f63f51081165bf404b8ceb52
  split_manifest_path: egomimic/hydra_configs/data/pusht/planar_v2_usocket_dp_3k_split_seed42_v1.json
  split_manifest_sha256: 3683e3461596eef8df2432fa865779b3c77b2a2057dabd0fea125595729cf313
  split_seed: 42
  valid_ratio: 0.01
  train_episode_count_per_domain: 2970
  valid_episode_count_per_domain: 29
  union_episode_count_per_domain: 2999
  id_overlap_count: 0
  resolved_path_overlap_count: 0
  dataset_observation_alignment: pre_step
  action_contract:
    representation: x_y_cos_theta_sin_theta
    prediction_horizon: 16
    native_decoder: atan2
  objective:
    flow_weight: 1.0
    reconstruction_weight: ${model.reconstruction_weight}
    action_velocity_weight: 1.0
    flow_samples_per_content: ${model.flow_samples_per_content}
    decoded_noise_scale_weight: 0.0
    monotonic_weight: 0.0
  inference:
    sampler: reverse_euler
    steps: ${model.num_inference_steps}
    classifier_free_guidance: false
  energy_score_contract:
    sample_count: 32
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    distance: ${evaluator.energy_score_distance}

deployment:
  action_decoder:
    _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
