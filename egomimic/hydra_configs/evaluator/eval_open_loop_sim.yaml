defaults:
- viz@viz_func: cartesian/base
- _self_
_target_: egomimic.eval.open_loop_sim.OpenLoopSimEval
action_key: actions_cartesian
ground_truth_action_key: actions_cartesian_untokenized
execute_fraction: 0.3
control_horizon: 100
control_dt: 0.03333333333333333
action_mode: auto
arc_chunking_mode: multistream
arc_execution_cap_mode: waypoints
arc_video_trajectory_cap_mode: ${oc.select:abc.arc_chunking_mode,multistream}
min_distance_unit: ${oc.select:abc.arc_distance,0.40}
rotation_distance_unit: ${oc.select:abc.arc_rotation_distance,1.7453292519943295}
resampled_vector_length: ${oc.select:abc.arc_waypoints,100}
clock_mode: ${oc.select:abc.arc_clock_mode,velocity}
streams: ${oc.select:abc.arc_streams,full_separation}
gripper_distance_unit: ${oc.select:abc.arc_gripper_distance,null}
log_step: null
results_path: ${paths.output_dir}/open_loop_sim.json
records_dump_path: null
trajectory_snapshot_path: null
video_only: false
distance_dtw_enabled: true
dtw_max_cells: 50000000
dtw_max_prediction_steps: 30000
dtw_max_segment_steps: null
require_episode_start: true
limit_val_episodes: null
requires_ordered_validation: true
obs_pose_key: observations.state.ee_pose
image_key: observations.images.front_img_1
revert_transforms:
  yam_bimanual:
    _target_: egomimic.rldb.embodiment.yam._build_yam_bimanual_revert_eef_frame_transform_list
    is_quat: false
    to_camera_frame: true
  human_bimanual:
    _target_: egomimic.rldb.embodiment.human._build_human_cartesian_revert_eef_frame_transform_list
    is_quat: false
    gripper_padded: true
video_output_dir: ${paths.output_dir}/val_videos
video_overlay_mode: executed_chunk
video_chunk_frames: 1000
max_episode_frames: 6000
viz_every_n_epochs: 1
viz_max_batches: null
