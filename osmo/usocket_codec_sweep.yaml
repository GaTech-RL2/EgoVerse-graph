# U-Socket ARC codec training shortlist on OSMO -- 1 node x 8 L40S/H100.
#
# Packs three runs on one node at 2 GPUs each (planar_v2_base already sets
# launch_params.gpus_per_node: 2). Lightning DDP runs the ranks directly in
# this container; there is no submitit.
#
# Cells:
#   planar_v2_usocket_arc_velocity_D80_M56_R26deg  primary
#   planar_v2_usocket_arc_velocity_D80_M56_R18deg  angular alternate
#   planar_v2_usocket_dp_standard                  non-ARC DP control
#
# The two ARC cells differ in exactly three lines (name, description,
# arc_rotation_distance), so the R comparison is otherwise fully controlled.
#
# Unlike the abc_arc configs, data/pusht/planar_v2_usocket.yaml uses
# LocalEpisodeResolverWithEmbodimentOverride -- a LOCAL resolver that will not
# fetch anything. It also pins expected_episode_names_sha256, so the episode
# set must arrive byte-identical. This workflow therefore stages the corpus
# from the R2 mirror into the exact folder_path the config names, and leaves
# the config untouched so provenance cannot drift.

workflow:
  name: "{{job_name}}"

  tasks:
  - name: train
    image: nvcr.io/nvidia/pytorch:25.06-py3

    credentials:
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-aws:
        AWS_ACCESS_KEY_ID: aws_access_key_id
        AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        AWS_DEFAULT_REGION: aws_region
      egoverse-wandb:
        WANDB_API_KEY: wandb_api_key

    environment:
      BRANCH: "{{branch}}"
      EXPERIMENTS: "{{experiments}}"
      GPUS_PER_RUN: "{{gpus_per_run}}"
      JOB_NAME: "{{job_name}}"
      WANDB_ENTITY: "{{wandb_entity}}"
      MAX_STEPS: "{{max_steps}}"
      CKPT_EVERY: "{{ckpt_every}}"
      WORKDIR: /workspace
      # The exact path data/pusht/planar_v2_usocket.yaml hardcodes.
      USOCKET_DIR: /coc/flash7/paphiwetsa3/datasets/Tsim_v2/u_socket_3000_v2_clean
      EXPECTED_EPISODES: "2999"
      NCCL_DEBUG: WARN
      TOKENIZERS_PARALLELISM: "false"
      HYDRA_FULL_ERROR: "1"

    command: ["bash"]
    args: ["/tmp/entry.sh"]

    files:
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        exec > >(tee /tmp/entry_script.log) 2>&1
        set -euxo pipefail

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          git curl unzip ca-certificates build-essential \
          libgl1 libglib2.0-0 libegl1 libosmesa6 ffmpeg

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"

        curl -sSfL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
          | tar xz -C /usr/local/bin s5cmd

        curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws

        mkdir -p "$WORKDIR" && cd "$WORKDIR"
        git clone --depth 1 --branch "$BRANCH" --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse-graph.git" EgoVerse-graph
        cd "$WORKDIR/EgoVerse-graph"
        git rev-parse HEAD

        # The rotation fix must be in the tree we are about to train on. A
        # branch that silently lacks it trains every R cell on identical
        # tokens, which is exactly the failure this sweep exists to avoid.
        for EXP in $EXPERIMENTS; do
          case "$EXP" in
            *arc_velocity*)
              F="egomimic/hydra_configs/experiment/pusht/${EXP}.yaml"
              test -f "$F" || { echo "FATAL: $F missing on $BRANCH"; exit 1; }
              grep -q "rotation_distance_unit" "$F" || {
                echo "FATAL: $F does not wire rotation_distance_unit"; exit 1; }
              ;;
          esac
        done
        echo "preflight: rotation wiring present in all ARC cells"

        uv sync --frozen
        source .venv/bin/activate

        bash ./egomimic/utils/aws/setup_secret.sh
        test -s "$HOME/.egoverse_env"
        set -a; source "$HOME/.egoverse_env"; set +a

        # Fail in seconds rather than after the stage + norm-stats phases.
        python - <<'PY'
        import os, sys, wandb
        entity = os.environ["WANDB_ENTITY"]
        api = wandb.Api()
        teams = [t if isinstance(t, str) else getattr(t, "name", str(t))
                 for t in (getattr(api.viewer, "teams", None) or [])]
        ents = sorted({e for e in (api.default_entity, *teams) if e})
        print(f"wandb user={api.viewer.username} entities={ents}")
        if entity not in ents:
            sys.exit(f"FATAL: wandb key has no access to '{entity}'. Accessible: {ents}")
        print(f"wandb entity '{entity}' OK")
        PY

        ulimit -n 65536 || true

        # ------------------------------------------------- dataset staging
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        S5="s5cmd --endpoint-url $R2_ENDPOINT_URL"

        mkdir -p "$USOCKET_DIR"
        df -h "$USOCKET_DIR" | tail -1

        # Locate the mirror. The prefix is not recorded anywhere in the repo,
        # so search the likely roots and print what is actually there on miss;
        # that turns a wrong guess into one diagnosable failure instead of a
        # blind retry.
        SRC=""
        for P in \
          "s3://rldb/staged/Tsim_v2/u_socket_3000_v2_clean/" \
          "s3://rldb/staged/u_socket_3000_v2_clean/" \
          "s3://rldb/staged/pushshapes_u_socket/u_socket_3000_v2_clean/" ; do
          if $S5 ls "$P" >/dev/null 2>&1 && [ -n "$($S5 ls "$P" 2>/dev/null | head -1)" ]; then
            SRC="$P"; break
          fi
        done
        if [ -z "$SRC" ]; then
          echo "FATAL: could not locate the u_socket mirror. Listings follow:"
          echo "--- s3://rldb/staged/"; $S5 ls "s3://rldb/staged/" 2>&1 | head -40 || true
          echo "--- s3://rldb/staged/Tsim_v2/"; $S5 ls "s3://rldb/staged/Tsim_v2/" 2>&1 | head -40 || true
          exit 1
        fi
        echo "staging from $SRC"
        $S5 --numworkers 64 sync "${SRC}*" "$USOCKET_DIR/"

        NEP=$(find "$USOCKET_DIR" -maxdepth 1 -mindepth 1 -name '*.zarr' | wc -l)
        [ "$NEP" -eq 0 ] && NEP=$(find "$USOCKET_DIR" -maxdepth 1 -mindepth 1 -type d | wc -l)
        echo "episodes staged: $NEP (expected $EXPECTED_EPISODES)"
        du -sh "$USOCKET_DIR" || true
        if [ "$NEP" -ne "$EXPECTED_EPISODES" ]; then
          echo "FATAL: expected $EXPECTED_EPISODES episodes, found $NEP."
          echo "The config pins expected_episode_names_sha256; a partial stage"
          echo "would fail the hash check hours later, so stopping now."
          exit 1
        fi

        # ------------------------------------------ checkpoint persistence
        # ${paths.output_dir} is node-local and dies with the container, and
        # this workflow declares no outputs. Push continuously to R2.
        cat > /tmp/ckpt_sync.sh <<'CSEOF'
        #!/bin/bash
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        DEST="s3://rldb/staged/usocket_codec/$1"
        while true; do
          for d in $(find /workspace/EgoVerse-graph/logs -type d -name checkpoints 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
              sync "$d/" "$DEST/$RN/checkpoints/" >>/tmp/ckpt_sync.log 2>&1
          done
          for f in $(find /workspace/EgoVerse-graph/logs -name norm_stats.json 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$f")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp "$f" "$DEST/$RN/norm_stats.json" >>/tmp/ckpt_sync.log 2>&1
          done
          sleep 420
        done
        CSEOF
        chmod +x /tmp/ckpt_sync.sh
        (setsid nohup /tmp/ckpt_sync.sh "$JOB_NAME" >/dev/null 2>&1 &)

        drain_pids () {
          for dp in $1; do
            while kill -0 "$dp" 2>/dev/null; do sleep 30; done
          done
        }

        # ---- phase 1: norm stats, ONE GPU per experiment, no DDP.
        # trainHydra computes stats before trainer.fit, so under gpus_per_node=2
        # rank 1 waits at the process-group store while rank 0 does the whole
        # pass, and the store gives up at 1800s with DistStoreError. Computing
        # them once on a single GPU removes that barrier.
        NORM_ROOT=/workspace/norm_cache
        mkdir -p "$NORM_ROOT"
        NPIDS=""
        i=0
        for EXP in $EXPERIMENTS; do
          mkdir -p "$NORM_ROOT/$EXP"
          ( CUDA_VISIBLE_DEVICES=$i python egomimic/trainHydra.py \
              +experiment=pusht/"$EXP" \
              launch_params.gpus_per_node=1 \
              norm_stats.save_cache_dir="$NORM_ROOT/$EXP" \
              trainer.max_steps=1 trainer.max_epochs=1 trainer.min_epochs=1 \
              trainer.limit_train_batches=1 trainer.limit_val_batches=0 \
              trainer.num_sanity_val_steps=0 \
              ~logger ~callbacks \
              name="normstats_${EXP}" \
              > "/tmp/norm_${EXP}.log" 2>&1 ) &
          NPIDS="$NPIDS $!"
          i=$((i + 1))
        done
        echo "phase 1: $(echo $NPIDS | wc -w) norm-stats passes, 1 GPU each"
        FIRSTN=$(echo $EXPERIMENTS | awk '{print $1}')
        touch "/tmp/norm_${FIRSTN}.log"; tail -f "/tmp/norm_${FIRSTN}.log" & NTAIL=$!
        drain_pids "$NPIDS"
        kill $NTAIL 2>/dev/null || true

        # cache_stats writes after each embodiment, so an interrupted pass
        # leaves a partial file that would silently train unnormalized.
        for EXP in $EXPERIMENTS; do
          NJ="$NORM_ROOT/$EXP/norm_stats/norm_stats.json"
          if [ ! -s "$NJ" ]; then
            echo "FATAL: no norm stats for $EXP"; tail -40 "/tmp/norm_${EXP}.log"; exit 1
          fi
          if ! python -c "import json,sys; d=json.load(open(sys.argv[1])); st=d['stats']; c={e:len(k) for e,k in st.items()}; ok=bool(st) and all(len(k)>0 for k in st.values()); print('  norm stats',sys.argv[2],c,'COMPLETE' if ok else 'PARTIAL'); sys.exit(0 if ok else 1)" "$NJ" "$EXP"; then
            echo "FATAL: partial norm stats for $EXP -- refusing to train on it"; exit 1
          fi
        done
        echo "phase 1 complete: all caches verified"

        # ---- phase 2: training, GPUS_PER_RUN each.
        RC=0
        PIDS=""
        i=0
        for EXP in $EXPERIMENTS; do
          LO=$((i * GPUS_PER_RUN))
          DEVS=$(seq -s, $LO $((LO + GPUS_PER_RUN - 1)))
          PORT=$((29500 + i * 17))
          echo "launching $EXP on GPU(s) $DEVS port $PORT"
          ( CUDA_VISIBLE_DEVICES="$DEVS" MASTER_PORT=$PORT \
            python egomimic/trainHydra.py \
              +experiment=pusht/"$EXP" \
              launch_params.gpus_per_node="$GPUS_PER_RUN" \
              norm_stats.precomputed_norm_path="$NORM_ROOT/$EXP/norm_stats/norm_stats.json" \
              trainer.max_steps="$MAX_STEPS" \
              callbacks.model_checkpoint.every_n_epochs=0 \
              +callbacks.model_checkpoint.every_n_train_steps="$CKPT_EVERY" \
              callbacks.model_checkpoint.save_top_k=-1 \
              logger.wandb.entity="$WANDB_ENTITY" \
              > "/tmp/run_${EXP}.log" 2>&1 ) &
          PIDS="$PIDS $!"
          i=$((i + 1))
        done

        FIRST=$(echo $EXPERIMENTS | awk '{print $1}')
        touch "/tmp/run_${FIRST}.log"; tail -f "/tmp/run_${FIRST}.log" & TAILPID=$!
        drain_pids "$PIDS"
        for p in $PIDS; do
          if ! wait $p 2>/dev/null; then RC=1; echo "run pid $p exited nonzero"; fi
        done
        kill $TAILPID 2>/dev/null || true

        echo "================ RESULTS ================"
        for EXP in $EXPERIMENTS; do echo "--- $EXP"; tail -30 "/tmp/run_${EXP}.log" || true; done

        bash -c 'set -a; source "$HOME/.egoverse_env"; set +a
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          for d in $(find /workspace/EgoVerse-graph/logs /workspace/norm_cache -type d \( -name checkpoints -o -name norm_stats \) 2>/dev/null); do
            RN=$(basename $(dirname $(dirname "$d")))
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" --numworkers 32 \
              sync "$d/" "s3://rldb/staged/usocket_codec/'"$JOB_NAME"'/$RN/$(basename $d)/"
          done' || true
        echo "artifacts flushed"
        exit $RC

  resources:
    default:
      cpu: {{cpu}}
      gpu: {{num_gpu}}
      memory: {{memory}}
      storage: {{storage}}

  timeout:
    queue_timeout: 1d
