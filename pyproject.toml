[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egomimic"
version = "1.0"
description = "Egomimic Scripts Package"
requires-python = ">=3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchdiffeq==0.2.5",
    "pyyaml",
    "matplotlib",
    "packaging",
    "h5py",
    "ipython",
    "rich",
    "wandb",
    "hydra-core",
    "hydra-submitit-launcher==1.2.0",
    "black",
    "gpustat",
    "pynvml",
    "termcolor",
    "pyquaternion",
    "rospkg",
    "einops",
    "timm",
    "av==12.0.0",
    "opencv-python",
    "dm-control==1.0.8",
    "mink==1.1.0",
    "mujoco==3.4.0",
    "submitit",
    "arm_pytorch_utilities",
    "pytorch-kinematics",
    "lightning",
    "argparse",
    "pandas",
    "zarr==3.1.5",
    "tabulate",
    "transformers==4.53.2",
    "boto3",
    "cloudpathlib",
    "sqlalchemy",
    "psycopg[binary]",
    "ray",
    "typing_extensions",
    "pyarrow",
    "simplejpeg",
    "prettytable",
    "datasets==4.0.0",
    "diffusers==0.30.3",
    "s5cmd",
    "mediapy",
    "pytest",
    "pre-commit",
    "ruff==0.8.6",
    "scaleapi",
    "openai",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
robot = ["pure-python-adb"]
aria = ["projectaria-tools[all]==2.0.0"]
yam = [
    "pure-python-adb",
    "pyrealsense2",
    "dynamixel-sdk==4.0.5",
    "aiohttp",
    "i2rt @ git+https://github.com/rohan-bansal/i2rt.git@2b851d7f4511b6bda442db85e98ec1122835221b",
]
pi05 = [
    "safetensors",
    "flax==0.10.2",
    "jax==0.5.3",
    "augmax==0.4.1",
    "beartype==0.19.0",
    "jaxtyping==0.2.36",
    "orbax-checkpoint==0.11.13",
    "sentencepiece>=0.2.0",
    "ml-collections==1.0.0",
    "numpy>=1.26.0,<2.0.0",
    "fsspec[gcs]>=2024.6.0",
    "tyro>=0.9.5",
]

# OpenPI's full dependency bundle conflicts with this project's AV and
# simulator pins. Keep the destination EgoVerse environment policy: lock the
# model runtime here, then install the immutable OpenPI source with --no-deps.
# See docs/integration/DEPENDENCIES.md. No resolver override hides the conflict.

# Project Aria 2.0.0 pins rerun-sdk==0.22.1, while i2rt (the Yam SDK)
# requires rerun-sdk>=0.32.2. i2rt also pins numpy==2.2.6, while Pi05's
# OpenPI requires numpy<2. Keep these environments separate.
[tool.uv]
conflicts = [
    [
        { extra = "aria" },
        { extra = "yam" },
    ],
    [
        { extra = "pi05" },
        { extra = "yam" },
    ],
]

[tool.setuptools.packages.find]
where = ["."]
include = ["egomimic*"]

[tool.setuptools.package-data]
egomimic = [
    "resources/*",
    "robot/eva/stanford_repo/models/meshes/X5/*.STL",
    "robot/eva/stanford_repo/LICENSE",
    "scripts/data_visualization/inspector_lib/assets/*.css",
    "hydra_configs/**/*.yaml",
    "hydra_configs/**/*.json",
    "robot/teleop_dashboard_static/*.html",
    "robot/teleop_dashboard_static/*.js",
    "robot/teleop_dashboard_static/*.css",
    "robot/rollout_dashboard_static/*.html",
    "robot/rollout_dashboard_static/*.js",
    "robot/rollout_dashboard_static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
