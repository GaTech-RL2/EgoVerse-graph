# @package _global_
defaults:
  - /experiment/pusht/action_flow_chain_latent_fm_sg_unite_h384_sum14_cfg4_val8_s42
  - override /data: pusht/action_flow_chain_points6_manual3000_val01_h16
  - override /model: bf/cotrain_uc_action_flow_latent_fm_sg_unite_h384d12h12
  - override /callbacks: action_flow_avln_cotrain
  - _self_

# Single-domain control: identical routed model family, but only ChainGripper
# contributes optimizer updates. The unused U-Socket codec remains inactive.
name: action_flow_chain_manual3000_avln_30k_s42
description: "Manual ChainGripper 3000 only; 6D Action Flow AV-LN"
model:
  _target_: egomimic.pl_utils.pl_model.ModelWrapper
  training_behavior:
    _target_: egomimic.pl_utils.training_behavior_action_flow.ActionFlowTrainingBehavior
  diagnostic_provider:
    _target_: egomimic.eval.pipeline_diagnostics.ActionFlowDiagnosticProvider
  flow_loss_aggregation: sum_samples
  cfg_scale: 4.0
trainer:
  max_steps: 30000
  val_check_interval: 10000
  limit_val_batches: 8
callbacks:
  model_checkpoint:
    every_n_train_steps: 5000
    save_top_k: -1
planar:
  action_dims: {pushshapes_sim_chain_gripper: 6}
  action_model_dim: 6
  eval_native_decoder:
    _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder
evaluator:
  native_decoder: ${planar.eval_native_decoder}
  semantic_blocks: [[0, 2], [2, 4], [4, 6]]
  energy_score_distance: null
  energy_score_provenance:
    action_representation: left_xy_center_xy_right_xy_points6
    distance_contract:
      space: normalized_action_chunk
      formula: mean_equal_weight_semantic_block_rms
      semantic_blocks: [[0, 2], [2, 4], [4, 6]]
  action_flow_diagnostics:
    native_error: null
    provenance:
      action_representation: left_xy_center_xy_right_xy_points6
run_provenance:
  training_domains: [pushshapes_sim_chain_gripper]
  architecture:
    family: action_flow_private_codecs_shared_field_h384d12h12_chain_only_control
    action_shape: [16, 6]
  action_contract:
    representation: left_xy_center_xy_right_xy_points6
    prediction_horizon: 16
    native_decoder: chain_gripper_points6_native
  energy_score_contract:
    distance:
      space: normalized_action_chunk
      formula: mean_equal_weight_semantic_block_rms
      semantic_blocks: [[0, 2], [2, 4], [4, 6]]
  train_episode_count_per_domain: 2970
  valid_episode_count_per_domain: 30
  union_episode_count_per_domain: 3000
deployment:
  observation_adapter:
    _target_: egomimic.pipeline.pushshapes.ChainGripperModelStateObservationAdapter
  action_decoder:
    _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder
