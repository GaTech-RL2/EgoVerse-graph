# RL2 Yam station replay profile. Match the physical starting joints to the
# selected replay frame before execution; the rollout velocity gate rejects a jump.
robot:
  kind: yam
  arms:
  - left
  - right
  channels:
    left: can_follower_l
    right: can_follower_r
  gripper_type: linear_4310
  zero_gravity_mode: true
  enable_auto_recovery: true
  frequency: 50
  home_duration: 1.5
  home:
    left:
    - -0.008
    - 0.007
    - 0.004
    - -0.070
    - 0.001
    - -0.015
    - 0.999
    right:
    - 0.007
    - 0.006
    - 0.005
    - -0.073
    - -0.013
    - -0.022
    - 0.999
  kinematics:
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    site_name: tcp_site
  cameras:
    front_img_1:
      type: realsense
      enabled: true
      # Matches the calibrated agentview camera in yam-pipeline.
      serial_number: '230322272195'
      height: 480
      width: 640
      fps: 30
    left_wrist_img:
      type: realsense
      enabled: true
      serial_number: '218622270679'
      height: 480
      width: 640
      fps: 30
    right_wrist_img:
      type: realsense
      enabled: true
      serial_number: '230322270555'
      height: 480
      width: 640
      fps: 30
frequency: 30
max_joint_velocity: 1.0
max_steps: 3000
preview:
  enabled: true
  width: 640
policy:
  kind: zarr_replay
  path: ${oc.env:YAM_REPLAY_PATH}
  joint_action_key: actions/joint_position
  gripper_action_key: actions/gripper
  arm_order: null  # Read the recorded root arm_order attribute.
  require_complete: true
  chunk_size: 30
  start: 0
  stop: null
