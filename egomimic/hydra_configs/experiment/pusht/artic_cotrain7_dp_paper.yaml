# @package _global_
# Baseline: Paper Diffusion Policy on the common-five action space, no ARC
# token. Same data, same seven embodiments, same held-out pair -- the only
# difference from the four ARC arms is the action representation.
defaults:
  - /experiment/pusht/artic_cotrain7_base
  - override /data: pusht/artic_cotrain7_dp
  - override /model: bf/bf_planar_v2_dp_paper
  - _self_

name: artic_c7_dp_paper
description: artic7_paper_DP_DDPM100_obs2_EMA

planar:
  raw_action_horizon: 16
  action_horizon: 16
  observation_horizon: 2
  action_target_offset: 1
  batch_size: 32
  transform_target: egomimic.rldb.embodiment.pushshapes.get_planar_paper_transform_list
  eval_native_decoder: null

evaluator:
  native_decoder: null
  native_decoders:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 3
    pushshapes_sim_gripper:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
    pushshapes_sim_suction:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
    pushshapes_sim_triangle:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 3
    pushshapes_sim_flipper:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
    pushshapes_sim_spring:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4

run_provenance:
  action_contract:
    observation_alignment: pre_step
    observation_horizon: 2
    training_action_target_offset: 1
    prediction_horizon: 16
    rollout_action_chunk_start_index: 0
    replan_every: 8
    execution_slice: "[0,8)"

eval_checkpoint:
  use_ema: true
callbacks:
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9999
    use_warmup: true
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_decay: 0.0
    validate_with_ema: true
