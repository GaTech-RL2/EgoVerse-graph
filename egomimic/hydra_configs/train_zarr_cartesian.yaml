defaults:
  - model: null
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb
  - data: null
  - callbacks: checkpoints
  - evaluator: null
  - override hydra/launcher: submitit
  - _self_

name: test
description: test
ckpt_path: null
mode: train
norm_stats_only: false

# Every training run emits a checkpoint-bound model inference contract. Robot
# calibration, camera mapping, prompts, and safety limits remain station-owned.
# Unsupported/non-Cartesian models still emit a fail-closed artifact explaining
# why the generic YAM graph rollout cannot load them.
inference_config:
  enabled: true
  output_path: ${paths.output_dir}/checkpoints/inference-config.yaml
  flow_inference_steps: 10
  diffusion_inference_steps: null
  max_flow_inference_steps: 100
  replan_every: 30
  # Required only when an ARC recipe has no evaluator.dt.
  action_dt: null

hydra:
  run:
    # Dir should be experiment_name/description_{timestamp}
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 1
  nodes: 1

runtime:
  # Lightning owns SIGUSR1/scontrol by default. An external ICE runner must
  # opt in explicitly and prove that child/framework requeue is disabled.
  slurm_requeue_owner: lightning
  # Runner-owned mode forwards SIGUSR2 only to request a full-state save.
  slurm_save_signal: SIGUSR2
  slurm_signal_checkpoint_dir: ${paths.output_dir}/checkpoints

seed: 42

# Normalization and norm-stat cache settings (override per-run as needed).
norm_stats:
  norm_mode: quantile
  sample_frac: 1.0
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
