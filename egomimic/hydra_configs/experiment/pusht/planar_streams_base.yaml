# @package _global_
planar:
  action_dim: 5
  action_dims:
    pushshapes_sim_u_socket: ${planar.action_dim}
    pushshapes_sim_chain_gripper: ${planar.action_dim}
  observation_horizon: 2
  action_target_offset: 1
  raw_action_horizon: 16
  action_horizon: 16
  transform_target: egomimic.rldb.embodiment.pushshapes.get_planar_paper_transform_list
  arc_distance: 80.0
  arc_waypoints: 16
  arc_dt: 0.0333333333333333
  arc_rotation_distance: 0.4537856055185257
  arc_timing_mode: duration
  eval_native_decoder: null
  batch_size: 16
  cotrain_data_root: /workspace/cotrain/data
  arc_waypoint_sampling: uniform
  data_manifest_sha256: ${oc.env:DATA_MANIFEST_SHA256,unset}
  translation_groups: xy
evaluator:
  native_decoder: null
  native_decoders:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 3
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
eval_checkpoint:
  use_ema: true
callbacks:
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9999
    use_warmup: true
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_decay: 0.0
    validate_with_ema: true
  run_progress:
    _target_: egomimic.utils.run_progress.RunProgressCallback
    path: ${paths.output_dir}/training-progress.json
    every_n_steps: 100
    require_homogeneous: true
trainer:
  limit_train_batches: 1.0
  limit_val_batches: 0
  precision: bf16-mixed
defaults:
- /experiment/pusht/planar_v2_base
- override /data: pusht/planar_cotrain_streams
- override /model: bf/bf_planar_v2_dp_paper
- _self_
name: planar_streams_dp
description: Pinned four-source Planar DP and independently timed ARC comparison
model:
  pipeline:
    homogeneous_training: true
launch_params:
  gpus_per_node: 4
  nodes: 1
run_provenance:
  campaign: obstacle-streams-20261007
  data_manifest_sha256: ${planar.data_manifest_sha256}
  source_alignment: 'manifest-specific offset: pre-step=1, post-step=2 with obs2'
  training_seed: 42
  effective_batch_size: 128
  optimizer_updates: 240000
  source_weighting: equal embodiment batches; frame-uniform mixture of ChainGripper
    sources
  decoded_image_cache: true
  split: families grouped by action identity, initial state, and known generation
    parent
  timing_layout: shape_then_timing
  action_contract:
    prediction_horizon: ${planar.action_horizon}
    raw_action_horizon: ${planar.raw_action_horizon}
    rollout_action_chunk_start_index: 0
    execution_rule: DP first 8 controls; ARC earliest active stream half-support clock
  evaluation_protocol: custom frozen 31-layout 50-seed benchmark; not canonical OEC-56
