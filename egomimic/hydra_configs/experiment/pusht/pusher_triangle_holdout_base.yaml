# @package _global_
planar:
  action_dim: 5
  action_dims:
    pushshapes_sim_circle_small: ${planar.action_dim}
    pushshapes_sim_stick: ${planar.action_dim}
    pushshapes_sim_pentagon: ${planar.action_dim}
    pushshapes_sim_triangle: ${planar.action_dim}
  observation_horizon: 2
  action_target_offset: 1
  raw_action_horizon: 16
  action_horizon: 16
  transform_target: egomimic.rldb.embodiment.pushshapes.get_planar_paper_transform_list
  arc_distance: 80.0
  arc_waypoints: 16
  arc_dt: 0.0333333333333333
  arc_rotation_distance: 0.4537856055185257
  arc_timing_mode: duration
  eval_native_decoder: null
  batch_size: 8
  cotrain_data_root: /workspace/pusher-holdout/data
  arc_waypoint_sampling: uniform
  data_manifest_sha256: ${oc.env:PUSHER_CACHE_MANIFEST_SHA256,unset}
  translation_groups: xy
evaluator:
  native_decoder: null
  native_decoders:
    pushshapes_sim_circle_small:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: ${planar.action_horizon}
      native_action_dim: 2
    pushshapes_sim_stick:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: ${planar.action_horizon}
      native_action_dim: 2
    pushshapes_sim_pentagon:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: ${planar.action_horizon}
      native_action_dim: 3
    pushshapes_sim_triangle:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: ${planar.action_horizon}
      native_action_dim: 3
eval_checkpoint:
  use_ema: true
callbacks:
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9999
    use_warmup: true
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_decay: 0.0
    validate_with_ema: true
  run_progress:
    _target_: egomimic.utils.run_progress.RunProgressCallback
    path: ${paths.output_dir}/training-progress.json
    every_n_steps: 100
    require_homogeneous: true
trainer:
  limit_train_batches: 1.0
  limit_val_batches: 0
  precision: bf16-mixed
defaults:
- /experiment/pusht/planar_v2_base
- override /data: pusht/pusher_triangle_holdout
- override /model: bf/bf_planar_v2_dp_paper
- _self_
name: pusher_triangle_holdout_dp16
description: Transfer obstacle skills to triangle using clean target demonstrations
model:
  pipeline:
    homogeneous_training: true
launch_params:
  gpus_per_node: 4
  nodes: 1
run_provenance:
  campaign: pusher-holdout-20261012
  holdout: triangle_obstacles
  data_manifest_sha256: ${planar.data_manifest_sha256}
  training_seed: ${seed}
  optimizer_updates: 240000
  effective_batch_size: 128
  source_weighting: Equal embodiment batches; frame-uniform clean/obstacle mixture
    within each embodiment
  alignment: Pre-step RGB/state, obs2, action offset1, native command index0 at rollout
  normalization: Training selection only; no triangle obstacles
  decoded_image_cache: true
  primary_replanning: fixed 8 native control steps for every method
  action_contract:
    prediction_horizon: ${planar.action_horizon}
    raw_action_horizon: ${planar.raw_action_horizon}
    rollout_action_chunk_start_index: 0
    execution_steps: 8
pusher:
  held_out: triangle
  holdout_kind: obstacle
  source_selection:
    circle_small:
    - circle_small_clean
    - circle_small_obstacle
    stick:
    - stick_clean
    - stick_obstacle
    pentagon:
    - pentagon_clean
    - pentagon_obstacle
    triangle:
    - triangle_clean
