# PushT view; shared resolver/split lives in parents/episode_split.yaml.
defaults:
- /data/pusht/parents/episode_split@train_datasets.pushshapes_sim_chain_gripper
- /data/pusht/parents/episode_split@valid_datasets.pushshapes_sim_chain_gripper
- _self_
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
_recursive_: false
train_datasets:
  pushshapes_sim_chain_gripper: &id001
    resolver:
      folder_path: ${oc.env:DP_DATASET_DIR}
      embodiment_override: pushshapes_sim_chain_gripper
      expected_episode_count: 4919
      expected_episode_names_sha256: aec6051fcf76b941f480c52b71fc9a38e192caa3ff49d93929b6607daa9e0002
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes_retiming.get_standard_dp_retimed_keymap
        action_horizon: ${planar.raw_action_horizon}
        rates: ${planar.retiming_rates}
        observation_horizon: ${planar.observation_horizon}
        action_target_offset: ${planar.action_target_offset}
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes_retiming.get_standard_dp_retimed_transform_list
        rates: ${planar.retiming_rates}
        action_horizon: ${planar.action_horizon}
        action_target_offset: ${planar.action_target_offset}
        min_distance_unit: ${planar.arc_distance}
        resampled_vector_length: ${planar.arc_waypoints}
        dt: ${planar.arc_dt}
        rotation_radius: ${planar.arc_rotation_radius}
        hybrid_rotation_unit: ${planar.hybrid_rotation_unit}
        velocity_mode: ${planar.arc_velocity_mode}
        waypoint_sampling: ${planar.arc_waypoint_sampling}
        curvature_dense_samples: ${planar.arc_curvature_dense_samples}
        curvature_floor: ${planar.arc_curvature_floor}
    mode: train
    split_seed: ${seed}
    expected_train_episode_count: 4870
    expected_train_episode_names_sha256: 3f5d78892b8efa0b312869c1638753d9795611d7680c64db0080fd62b07f91e7
    expected_valid_episode_count: 49
    expected_valid_episode_names_sha256: 4a10302d2bdad7f0b09b435ed1f865c98303e7488c726bedd71e1cc6803749b3
valid_datasets:
  pushshapes_sim_chain_gripper:
    <<: *id001
    mode: valid
train_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: ${planar.batch_size}
    num_workers: 6
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 3
valid_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: ${planar.batch_size}
    num_workers: 4
    pin_memory: true
