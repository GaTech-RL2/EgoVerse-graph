# @package _global_
defaults:
- /world_model_attention: flash4_bf16_mixed
- override /model: pixel_proprio/imagenet_joint
- override /data: pixel_proprio/imagenet_imagefolder
- override /trainer: default
- _self_
name: native_mot_imagenet1k_qk_swiglu_rms
description: image160_patch16_classname_qwen_full314227000_s42
seed: 42
norm_stats: null
normalizer: null
val_at_end: false
data_context_loader:
  _target_: egomimic.rldb.imagenet_imagefolder.load_data_context
inference_config:
  enabled: false
world_model_execution:
  compile_mode: default
evaluator:
  _target_: egomimic.eval.image_proprio_eval.ImageProprioEval
  objective: image_generation
  sample_seed: 42
  active_streams_from_data: false
  pixel_diagnostics:
    artifact_dir: ${paths.output_dir}/pixel_diagnostics
    max_samples_per_source_kind: 32
    write_video: false
    contact_sheet_frames: 1
    log_wandb: true
trainer:
  accelerator: gpu
  precision: ${world_model_attention.trainer_precision}
  devices: 4
  num_nodes: 1
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: true
  min_epochs: 0
  max_epochs: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 20000
  check_val_every_n_epoch: null
  max_steps: 300000
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  gradient_clip_val: null
callbacks:
  model_checkpoint:
    filename: epoch_{epoch:04d}-step_{step:09d}
    every_n_epochs: 0
    every_n_train_steps: 20000
    save_on_train_epoch_end: false
    save_top_k: -1
    save_last: link
runtime:
  strict_fp32: ${world_model_attention.strict_fp32}
  disable_tf32: ${world_model_attention.disable_tf32}
  slurm_requeue_owner: none
logger:
  wandb:
    project: mot-world-model
    entity: rl2-group
    group: elmo-imagenet-qk-swiglu-rms
    resume: never
    tags:
    - ImageNet1k
    - image-generation
    - full-joint-architecture
    - image-only-supervision
    - class-name-Qwen
    - QK-RMS-SwiGLU
