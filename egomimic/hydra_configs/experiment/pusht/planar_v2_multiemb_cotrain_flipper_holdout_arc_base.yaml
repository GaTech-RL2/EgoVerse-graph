      resampled_vector_length: ${planar.arc_waypoints}
      action_horizon: ${planar.raw_action_horizon}
      native_action_dim: 4
      timing_mode: ${planar.arc_timing_mode}
      dt: ${planar.arc_dt}
    pushshapes_sim_circle_small:
      _target_: egomimic.pipeline.pushshapes.PlanarArcTimedNativeDecoder
      resampled_vector_length: ${planar.arc_waypoints}
      action_horizon: ${planar.raw_action_horizon}
      native_action_dim: 2
      timing_mode: ${planar.arc_timing_mode}
      dt: ${planar.arc_dt}
    pushshapes_sim_stick:
      _target_: egomimic.pipeline.pushshapes.PlanarArcTimedNativeDecoder
      resampled_vector_length: ${planar.arc_waypoints}
      action_horizon: ${planar.raw_action_horizon}
