# @package _global_
# Slow-pace 366 robot-only BC, codec arcvel (7-frame speed smoothing): the 10-05 Lambda baseline
# bc_rl2_stattempo_slowpace_arcvel_lambda on the stack. Same leaf as ..._arcvel_nosmooth with the
# default smoothing.
defaults:
- /experiment/yam_arc_grid/_base/stattempo_openloop
- override /model: e1/hpt_flow_wrists_ft_arcdur
- override /data: abc_arc/stationery_slowpace366_bc_time
- _self_
name: bc_rl2_stattempo_slowpace366_arcvel
description: h640t8_d384x10_cos10k_240k_s42_${name}
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcvel
  valid_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcvel
e1:
  variant: arcvel
  action_dim: 16
hpt:
  action_dim: 16
evaluator:
  action_mode: arc
  token_layout: e1_profile
logger:
  wandb:
    id: ${name}_s42
    tags: [rl2, stationery, stattempo, slowpace366, bc, arcvel, openloop_val]
