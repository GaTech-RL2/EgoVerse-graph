# Graph port of EgoVerse ec5c903c; see docs/integration/RECIPE_PARITY.md.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 5.0e-05
  weight_decay: 0.0001
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
  - _target_: egomimic.pipeline.stages_hpt.HPTStemStage
    domain_first: true
    preserve_config_order: true
    selector_aliases:
      '6': eva_bimanual
      '3': human_bimanual
    stems:
      observations.images.front_img_1:
        _target_: egomimic.models.stems.composed.EncodedPolicyStem
        stem:
          _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
          input_dim: 256
          output_dim: 256
          widths:
          - 256
          specs:
            random_horizon_masking: false
            cross_attn:
              crossattn_latent: 16
              crossattn_heads: 8
              crossattn_dim_head: 64
              crossattn_modality_dropout: 0.1
              modality_embed_dim: 256
        feature_position_encoding: true
        encoder:
          _target_: egomimic.models.stems.hpt_stems.ResNet
          output_dim: 256
          num_of_copy: 1
        train_transform:
          _target_: torchvision.transforms.Compose
          transforms:
          - _target_: torchvision.transforms.ColorJitter
            brightness: 0.1
            contrast: 0.1
            saturation: 0.1
            hue: 0.05
          - _target_: torchvision.transforms.Normalize
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
        eval_transform:
          _target_: torchvision.transforms.Compose
          transforms:
          - _target_: torchvision.transforms.Normalize
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
    domain_stems:
      human_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.composed.EncodedPolicyStem
          stem:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: 12
            output_dim: 256
            widths:
            - 256
            specs:
              random_horizon_masking: false
              cross_attn:
                crossattn_latent: 16
                crossattn_heads: 8
                crossattn_dim_head: 64
                crossattn_modality_dropout: 0.1
                modality_embed_dim: 256
          feature_position_encoding: true
      eva_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.composed.EncodedPolicyStem
          stem:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: 14
            output_dim: 256
            widths:
            - 256
            specs:
              random_horizon_masking: false
              cross_attn:
                crossattn_latent: 16
                crossattn_heads: 8
                crossattn_dim_head: 64
                crossattn_modality_dropout: 0.1
                modality_embed_dim: 256
          feature_position_encoding: true
        observations.images.right_wrist_img:
          _target_: egomimic.models.stems.composed.EncodedPolicyStem
          stem:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: 256
            output_dim: 256
            widths:
            - 256
            specs:
              random_horizon_masking: false
              cross_attn:
                crossattn_latent: 16
                crossattn_heads: 8
                crossattn_dim_head: 64
                crossattn_modality_dropout: 0.1
                modality_embed_dim: 256
          feature_position_encoding: true
          encoder:
            _target_: egomimic.models.stems.hpt_stems.ResNet
            output_dim: 256
            num_of_copy: 1
          train_transform:
            _target_: torchvision.transforms.Compose
            transforms:
            - _target_: torchvision.transforms.ColorJitter
              brightness: 0.1
              contrast: 0.1
              saturation: 0.1
              hue: 0.05
            - _target_: torchvision.transforms.Normalize
              mean:
              - 0.485
              - 0.456
              - 0.406
              std:
              - 0.229
              - 0.224
              - 0.225
          eval_transform:
            _target_: torchvision.transforms.Compose
            transforms:
            - _target_: torchvision.transforms.Normalize
              mean:
              - 0.485
              - 0.456
              - 0.406
              std:
              - 0.229
              - 0.224
              - 0.225
        observations.images.left_wrist_img:
          _target_: egomimic.models.stems.composed.EncodedPolicyStem
          stem:
            _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
            input_dim: 256
            output_dim: 256
            widths:
            - 256
            specs:
              random_horizon_masking: false
              cross_attn:
                crossattn_latent: 16
                crossattn_heads: 8
                crossattn_dim_head: 64
                crossattn_modality_dropout: 0.1
                modality_embed_dim: 256
          feature_position_encoding: true
          encoder:
            _target_: egomimic.models.stems.hpt_stems.ResNet
            output_dim: 256
            num_of_copy: 1
          train_transform:
            _target_: torchvision.transforms.Compose
            transforms:
            - _target_: torchvision.transforms.ColorJitter
              brightness: 0.1
              contrast: 0.1
              saturation: 0.1
              hue: 0.05
            - _target_: torchvision.transforms.Normalize
              mean:
              - 0.485
              - 0.456
              - 0.406
              std:
              - 0.229
              - 0.224
              - 0.225
          eval_transform:
            _target_: torchvision.transforms.Compose
            transforms:
            - _target_: torchvision.transforms.Normalize
              mean:
              - 0.485
              - 0.456
              - 0.406
              std:
              - 0.229
              - 0.224
              - 0.225
  - _target_: egomimic.pipeline.stages_hpt.HPTTrunkStage
    embed_dim: 256
    token_postprocessing: action_token
    action_token_count: 64
    squeeze_action_token: false
    use_domain_embedding: false
    trunk:
      _target_: egomimic.models.cores.hpt_transformer.SimpleTransformer
      embed_dim: 256
      num_blocks: 16
      drop_path_rate: 0.1
      weight_init_style: pytorch
      attn_target:
        _target_: egomimic.models.cores.hpt_transformer.MultiheadAttention
        _partial_: true
        embed_dim: 256
        num_heads: 8
        batch_first: true
        bias: true
        add_bias_kv: true
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: actions_cartesian
  - _target_: egomimic.pipeline.stages_routing.BranchStage
    selector_aliases:
      '6': eva_bimanual
      '3': human_bimanual
    reads_by_mode:
      train:
      - target
      - condition
      inference:
      - condition
    writes_by_mode:
      train:
      - pred_action
      - loss/regression
      inference:
      - pred_action
      - log/*
    branches:
      human_bimanual:
        _target_: egomimic.pipeline.core.Pipeline
        stages:
        - _target_: egomimic.pipeline.stages_regression.SequenceRegressionStage
          model:
            _target_: egomimic.models.heads.hpt_decoder.MultiBlockTransformerDecoder
            input_dim: 256
            output_dim: 12
            action_horizon: 100
            latent_token_len: 64
            num_heads: 8
            dim_head: 64
            dropout: 0.1
            num_layers: 8
            final_norm: true
          action_horizon: 100
          action_dim: 12
          loss: smooth_l1
          beta: 0.05
        stage_ids:
          sampler: 0
      eva_bimanual:
        _target_: egomimic.pipeline.core.Pipeline
        stages:
        - _target_: egomimic.pipeline.stages_regression.SequenceRegressionStage
          model:
            _target_: egomimic.models.heads.hpt_decoder.MultiBlockTransformerDecoder
            input_dim: 256
            output_dim: 14
            action_horizon: 100
            latent_token_len: 64
            num_heads: 8
            dim_head: 64
            dropout: 0.1
            num_layers: 8
            final_norm: true
          action_horizon: 100
          action_dim: 14
          loss: smooth_l1
          beta: 0.05
        stage_ids:
          sampler: 0
  stage_ids:
    stems: 0
    trunk: 1
    sampler: 3
deployment_domain: eva_bimanual
inference_domains:
  eva_bimanual:
    input:
      history_length: 1
      keys:
      - observations.state.ee_pose
      - observations.images.right_wrist_img
      - observations.images.left_wrist_img
      - observations.images.front_img_1
      - embodiment
      history_keys:
      - observations.state.ee_pose
      - observations.images.right_wrist_img
      - observations.images.left_wrist_img
      - observations.images.front_img_1
      constants:
        embodiment: 6
    native_output:
      frame: camframe
      key: pred_action
      representation: normalized_action
      shape:
      - 100
      - 14
      timing:
        kind: uniform_resampled_target
        temporally_resolved: true
        dt: 0.014814814814814815
        first_source_frame: 0
        last_source_frame: 44
        source_fps: 30
    output:
      frame: camframe
      key: actions
      representation: cartesian
      shape:
      - 45
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - 100
        - 14
        embodiment: 6
      tokenizer: null
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - 100
        - 14
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
            native_shape:
            - 100
            - 14
            native_dt: 0.014814814814814815
            output_horizon: 45
            output_dt: 0.03333333333333333
            angular_indices:
            - 3
            - 4
            - 5
            - 10
            - 11
            - 12
          rotation_mode: euler
          action_frame: model_frame
        overrides:
          replan_every:
            label: Actions before replanning
            description: Control-rate execution prefix.
            type: integer
            min: 1
            max: 45
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
  human_bimanual:
    input:
      history_length: 1
      keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      - embodiment
      history_keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      constants:
        embodiment: 3
    native_output:
      frame: camframe
      key: pred_action
      representation: normalized_action
      shape:
      - 100
      - 12
      timing:
        kind: uniform_resampled_target
        temporally_resolved: true
        dt: 0.00909090909090909
        first_source_frame: 0
        last_source_frame: 27
        source_fps: 30
    output:
      frame: camframe
      key: actions
      representation: cartesian
      shape:
      - 28
      - 12
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - 100
        - 12
        embodiment: 3
      tokenizer: null
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - 100
        - 12
        adapter:
          _target_: egomimic.pipeline.action_adapter.CanonicalSequenceAdapter
          shape:
          - 28
          - 12
          decoder:
            _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
            native_shape:
            - 100
            - 12
            native_dt: 0.00909090909090909
            output_horizon: 28
            output_dt: 0.03333333333333333
            angular_indices:
            - 3
            - 4
            - 5
            - 9
            - 10
            - 11
        overrides:
          replan_every:
            label: Actions before replanning
            description: Control-rate execution prefix.
            type: integer
            min: 1
            max: 28
            step: 1
            default: 28
            target:
              kind: policy_attribute
              attribute_path: replan_every
inference: ${model.inference_domains.${model.deployment_domain}}

# Required preprocessing semantics, independent of episode selection or location.
data_requirements:
  preprocessing:
    '6':
      transforms:
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
      source_fps: 30.0
    '3':
      transforms:
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
        stride: 3
      source_fps: 30.0
