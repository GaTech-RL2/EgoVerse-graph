# @package _global_
defaults:
  - /experiment/pusht/planar_v2_base
  - override /data: pusht/action_flow_chain_points6_4920_val01_h16
  - override /evaluator: eval_planar_v2
  - override /logger: wandb
  - _self_

seed: 42
launch_params: {gpus_per_node: 1, nodes: 1}

trainer:
  max_steps: 150000
  max_epochs: -1
  min_epochs: null
  limit_train_batches: 1.0
  val_check_interval: 10000
  limit_val_batches: 8
  check_val_every_n_epoch: null
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  strategy: auto
  sync_batchnorm: false
  log_every_n_steps: 10
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
  sample_frac: 1.0
  num_workers: 4
  precomputed_norm_path: null

callbacks:
  model_checkpoint:
    filename: "epoch-{epoch}-step-{step}"
    save_last: link
    save_top_k: -1
    every_n_train_steps: 20000
    every_n_epochs: null
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

eval_checkpoint:
  use_ema: true

logger:
  wandb:
    project: pushshapes-action-flow

planar:
  action_dims: {pushshapes_sim_chain_gripper: 6}
  action_model_dim: 6
  action_horizon: 16
  observation_horizon: 1
  batch_size: 32
  eval_native_decoder:
    _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder

evaluator:
  native_decoder: ${planar.eval_native_decoder}
  semantic_blocks: [[0, 2], [2, 4], [4, 6]]
  energy_score_distance: null
  deterministic_seed: 420042
  energy_score_max_batches_per_rank: 1
  energy_score_validation_view:
    definition: first_deterministic_validation_batch_per_ddp_rank
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    per_rank_batch_size: 32
    world_size: 1
  energy_score_provenance:
    source_commit: ${run_provenance.source_commit}
    normalization_sha256: ${run_provenance.normalization_sha256}
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    resolved_config_path: ${paths.output_dir}/.hydra/config.yaml
    wandb:
      entity: ${logger.wandb.entity}
      project: ${logger.wandb.project}
      run_id: ${logger.wandb.id}
    distance_contract: null
    dataset_content:
      manifest_path: ${run_provenance.content_manifest_path}
      manifest_sha256: ${run_provenance.content_manifest_sha256}
      aggregate_sha256: ${run_provenance.dataset_content_aggregate_sha256}
    action_representation: left_xy_center_xy_right_xy_points6
    prediction_horizon: 16
    sampler: ${run_provenance.inference.sampler}
    sampler_steps: ${model.num_inference_steps}
    model_autocast_precision: bf16

run_provenance:
  source_commit: null
  normalization_sha256: null
  content_manifest_path: ${oc.env:CHAIN4920_CONTENT_MANIFEST,/required/chain4920_content_manifest.json}
  content_manifest_sha256: ${oc.env:CHAIN4920_CONTENT_MANIFEST_SHA256,required}
  dataset_content_aggregate_sha256: ${oc.env:CHAIN4920_CONTENT_AGGREGATE_SHA256,required}
  split_manifest_path: ${oc.env:CHAIN4920_SPLIT_MANIFEST,/required/chain4920_split_manifest.json}
  split_manifest_sha256: ${oc.env:CHAIN4920_SPLIT_MANIFEST_SHA256,required}
  split_seed: 42
  valid_ratio: 0.01
  train_episode_count_per_domain: 4871
  valid_episode_count_per_domain: 49
  union_episode_count_per_domain: 4920
  id_overlap_count: 0
  resolved_path_overlap_count: 0
  dataset_observation_alignment: pre_step
  action_contract:
    representation: left_xy_center_xy_right_xy_points6
    prediction_horizon: 16
    native_decoder: ChainGripperPointsNativeDecoder
  inference:
    sampler: dopri5
    steps: 50
    classifier_free_guidance: true
    cfg_scale: 4.0
    cfg_interval: [0.0, 1.0]
  energy_score_contract:
    sample_count: 32
    seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    distance: null

deployment:
  observation_adapter:
    _target_: egomimic.pipeline.pushshapes.ChainGripperModelStateObservationAdapter
  action_decoder:
    _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder
  chain_gripper_control_mode: points
