# @package _global_
defaults:
- override /evaluator: frozen_yam_time
- _self_
frozen_yam:
  policy_domain: human
  variant: ???
  spread: ???
  train_root: ???
  valid_root: ???
  train_mode: total
  valid_mode: total
  D: 0.4
  M: 100
  time_rows: 100
  chunk_length: 100
  h_match_frames: 40
  limit_val_batches: 40
  prog_horizon_m: 0.19
  anchor_sampler: null
  arcmatch_gt_span_m: null
  action_dim: 14
  action_horizon: 100
  image_weights: DEFAULT
name: frozen_yam_${frozen_yam.variant}
description: ${frozen_yam.spread}_s${seed}
arc_tokenizer:
  min_distance_unit: ${frozen_yam.D}
  resampled_vector_length: ${frozen_yam.M}
trainer:
  strategy: auto
  sync_batchnorm: false
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 0
  limit_val_batches: ${frozen_yam.limit_val_batches}
callbacks:
  model_checkpoint:
    every_n_epochs: 50
    save_top_k: -1
norm_stats:
  sample_frac: 0.25
  num_workers: 8
hpt:
  embed_dim: 256
  num_blocks: 16
  num_heads: 8
  stem_specs:
    random_horizon_masking: false
    cross_attn:
      crossattn_latent: 16
      crossattn_heads: 8
      crossattn_dim_head: 64
      crossattn_modality_dropout: 0.1
      modality_embed_dim: ${hpt.embed_dim}
  action_dim: ${frozen_yam.action_dim}
  action_horizon: ${frozen_yam.action_horizon}
