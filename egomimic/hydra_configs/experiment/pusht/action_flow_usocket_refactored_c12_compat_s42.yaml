# @package _global_
defaults:
  - /experiment/pusht/action_flow_usocket_latent_fm_sg_unite_h384_sum14_cfg4_val8_s42
  - _self_

# Opt-in reproduction recipe. The composed ModelWrapper remains selected.
name: action_flow_usocket_refactored_c12_compat_s42
normalizer:
  _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset
  compatibility_mode: legacy_c12
data:
  compatibility_mode: legacy_c12
  train_datasets:
    pushshapes_sim_u_socket:
      compatibility_mode: legacy_c12
  valid_datasets:
    pushshapes_sim_u_socket:
      compatibility_mode: legacy_c12
model:
  training_behavior:
    compatibility_mode: legacy_c12
  pipeline:
    compatibility_mode: legacy_c12
val_at_start: false

# Native working-run cadence. The launcher must explicitly bound the test
# budget; never replace native startup with a forced shared-state load.
trainer:
  max_steps: 30000
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  val_check_interval: 10000
  check_val_every_n_epoch: null
  limit_val_batches: 8
callbacks:
  model_checkpoint:
    every_n_train_steps: 5000
    save_top_k: -1
  wandb_profiler:
    _target_: egomimic.utils.timing_callback.WandbProfilerLogger
    log_every_n_steps: 100
  ema:
    decay: 0.9978
    validate_with_ema: true
