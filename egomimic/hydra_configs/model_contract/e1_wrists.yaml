inference: ${model.inference_contracts.${e1.variant}}
source_identities:
  human: 3
  yam: 7
data_contracts:
  human:
    preprocessing:
      '3':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          horizon: ${e1.chunk_length}
          embodiment: human
          drop_wrist_images: false
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${e1.variant}
          embodiment: human
          chunk_length: ${e1.chunk_length}
          time_rows: ${e1.time_rows}
          min_distance_unit: ${e1.D}
          resampled_vector_length: ${e1.M}
          stride: 1
          rotation_mode: euler
          progress_smooth_hz: ${e1.progress_smooth_hz}
          velocity_norm: ${e1.velocity_norm}
          fixed_spacing: ${e1.fixed_spacing}
        source_fps: 30.0
  yam:
    preprocessing:
      '7':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          embodiment: yam
          drop_wrist_images: false
          yam_source_frames: ${model.contract_source_frames.yam}
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${e1.variant}
          time_rows: ${e1.time_rows}
          min_distance_unit: ${e1.D}
          resampled_vector_length: ${e1.M}
          stride: 1
          rotation_mode: euler
          progress_smooth_hz: ${e1.progress_smooth_hz}
          velocity_norm: ${e1.velocity_norm}
          fixed_spacing: ${e1.fixed_spacing}
          embodiment: yam
        source_fps: 30.0
data_requirements: ${model.data_contracts.${e1.policy_domain}}
contract_source_frames:
  yam: ${oc.select:e1.yam_source_frames,100}
  human: ${e1.chunk_length}
direct_time_data_requirements:
  preprocessing:
    '7':
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transforms:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
      source_fps: 30.0
