# @package _global_
# ABC-ONLY (no cotraining) ARC-TOKENIZED BC at D = 0.40 m / M = 100:
# fold_and_stack_the_t_shirts, yam_bimanual. The single-domain arm of the
# cotrain ablation.
#
# Arc tokenization is loader-side (arc_tokenizer_cartesian in the data config).
# The model sees `actions_cartesian` as (101, 14) arc tokens and models them
# directly with DP -- no graph-side ArcTokenizeStage.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fstshirt_arc_bc
defaults:
  - override /model: abc_arc/yam_bimanual_dp_arc_D40_M100
  - override /data: abc_arc/abc_fstshirt_arc_bc_D40_M100
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_pace
  - _self_

name: abc_fstshirt_arc_bc
description: arcD40M100

paths:
  dataset_dir: /storage/project/r-dxu345-0/shared/arc_abc

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

logger:
  wandb:
    project: abc-yam
    tags:
      - abc
      - bc
      - arc

abc:
  action_dim: 14
  action_horizon: 16
  # How the arc token carries timing:
  #   mean          M waypoints + one velocity row  -> M + 1  = 101 rows
  #   per_waypoint  M waypoints + M velocity rows   -> 2 * M   = 200 rows
  #   duration      M waypoints + M duration rows   -> 2 * M   = 200 rows
  # per_waypoint / duration recover a chunk that accelerates, decelerates or
  # dwells; on this data per_waypoint cut round-trip xyz error from 8.4cm to
  # 0.02cm on a decelerating chunk. duration stores Δt instead of rate.
  # The 2M layout is also divisible by 4, which ConditionalUnet1D's two
  # downsample stages require -- 101 is odd and crashes the skip-connection
  # concat.
  arc_velocity_mode: per_waypoint
  # Arc scoring settings, shared with the baseline twin.
  arc_distance: 0.40
  arc_waypoints: 100
  arcmatch_points: 32
  arc_chunk_rows: 45
  arc_token_rows: 200
  condition_dim: 78
  encoder:
    _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
    obs_specs:
      ee_pose: {input_dim: 14, input_slice: [0, 14]}
    img_encoders:
      front_img_1:
        _target_: egomimic.models.stems.visual_core.VisualCore
        in_channels: 3
        image_size: 480
        image_width: 640
        num_kp: 32
        feature_dimension: 64
        pretrained: false
        crop_aug: true
        crop_height: 432
        crop_width: 576
        crop_eval_mode: center
        crop_sample_mode: v02
        crop_scope: frame
        norm_layer: group
        pool_type: spatial_softmax

# Same knobs the baseline twin sets, so the two arms score in one space.
evaluator:
  arc_metrics: true
  include_reconstruction_loss: false
  arcmatch_distance: ${abc.arc_distance}
  arcmatch_points: ${abc.arcmatch_points}
  arc_chunk_rows: ${abc.arc_chunk_rows}
