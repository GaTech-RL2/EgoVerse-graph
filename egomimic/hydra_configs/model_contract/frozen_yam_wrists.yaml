inference_contracts:
  time:
    input:
      constants:
        embodiment: ${model.source_identities.${frozen_yam.policy_domain}}
      history_length: 1
      keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - observations.images.left_wrist_img
      - observations.images.right_wrist_img
      - embodiment
      history_keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - observations.images.left_wrist_img
      - observations.images.right_wrist_img
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${model.action_horizon}
      - ${model.action_token_dim}
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${model.action_horizon}
      - ${model.action_token_dim}
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - ${model.action_horizon}
        - ${model.action_token_dim}
      tokenizer: null
      source_frames: ${model.contract_source_frames.${frozen_yam.policy_domain}}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${model.action_horizon}
        - ${model.action_token_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.TimeChunkRetimer
            action_horizon: ${model.action_horizon}
            dt: 0.03333333333333333
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: ${model.sampling_steps}
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: ${model.sampling_attribute}
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${model.action_horizon}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
          arc_speed_percent: ${model.arc_decoder_controls.arc_speed_percent}
          arc_hold_speed_percent: ${model.arc_decoder_controls.arc_hold_speed_percent}
arc_decoder_controls:
  multistream_fastest_stream:
    label: Fastest-stream termination
    description: 1 ends the chunk when the first moving stream reaches its waypoint cap; 0 executes the fixed prefix
      of Actions before replanning.
    type: integer
    min: 0
    max: 1
    step: 1
    default: 1
    target:
      kind: decoder_attribute
      attribute_path: first_stream
  execute_waypoint_percent:
    label: Execute first % of waypoints
    description: Waypoint cap while fastest-stream termination is on; must be a whole prefix of the token's waypoints.
    type: integer
    min: 2
    max: 100
    step: 1
    default: 50
    target:
      kind: decoder_attribute
      attribute_path: execute_percent
  arc_speed_percent:
    label: Replay speed (%)
    description: Decoder replay tempo of the moving phases, not a learned speed condition.
    type: integer
    min: 25
    max: 400
    step: 5
    default: 100
    target:
      kind: decoder_attribute
      attribute_path: speed_percent
  arc_hold_speed_percent:
    label: Hold speed (%)
    description: Replay tempo of holds (grasp dwell, placement); 100 preserves the demonstrated hold time while
      the moving phases change tempo.
    type: integer
    min: 25
    max: 400
    step: 5
    default: 100
    target:
      kind: decoder_attribute
      attribute_path: hold_speed_percent
inference: ${model.inference_contracts.${frozen_yam.variant}}
source_identities:
  human: 3
  yam: 7
data_contracts:
  human:
    preprocessing:
      '3':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          horizon: ${frozen_yam.chunk_length}
          embodiment: human
          drop_wrist_images: false
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${frozen_yam.variant}
          embodiment: human
          chunk_length: ${frozen_yam.chunk_length}
          time_rows: ${frozen_yam.time_rows}
          min_distance_unit: ${frozen_yam.D}
          resampled_vector_length: ${frozen_yam.M}
          stride: 1
          rotation_mode: euler
        source_fps: 30.0
  yam:
    preprocessing:
      '7':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          embodiment: yam
          drop_wrist_images: false
          yam_source_frames: ${model.contract_source_frames.yam}
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${frozen_yam.variant}
          time_rows: ${frozen_yam.time_rows}
          min_distance_unit: ${frozen_yam.D}
          resampled_vector_length: ${frozen_yam.M}
          stride: 1
          rotation_mode: euler
          embodiment: yam
          yam_source_frames: ${model.contract_source_frames.yam}
        source_fps: 30.0
data_requirements: ${model.data_contracts.${frozen_yam.policy_domain}}
contract_source_frames:
  yam: ${oc.select:frozen_yam.yam_source_frames,100}
  human: ${frozen_yam.chunk_length}
direct_time_data_requirements:
  preprocessing:
    '7':
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transforms:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
      source_fps: 30.0
