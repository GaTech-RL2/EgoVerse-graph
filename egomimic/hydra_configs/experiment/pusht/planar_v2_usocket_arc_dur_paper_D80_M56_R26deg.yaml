# @package _global_
defaults:
  - /experiment/pusht/planar_v2_usocket_base
  - override /model: bf/bf_planar_v2_arc_stacked_paper_dp
  - _self_

name: planar_v2_usocket_arc_dur_paper_D80_M56_R26deg
description: arcdur_paper_D80_M56_R26deg_DDPM100_obs2_EMA

# Paper-DP training contract (obs horizon 2, action_target_offset 1, DDPM,
# EMA, batch 32) applied to the stacked width-6 ARC token. Only the action
# REPRESENTATION differs from planar_v2_usocket_dp_paper.
planar:
  raw_action_horizon: 80
  action_horizon: 16
  observation_horizon: 2
  action_target_offset: 1
  batch_size: 32
  arc_distance: 80.0
  arc_waypoints: 56
  arc_rotation_distance: 0.4537856055185257
  arc_dt: 0.0333333333333333
  arc_token_rows: 56
  transform_target: egomimic.rldb.embodiment.usocket_arc_velocity.get_usocket_arc_duration_transform_list
  eval_native_decoder:
    _target_: egomimic.rldb.embodiment.usocket_arc_velocity.USocketArcDurationNativeDecoder
    resampled_vector_length: ${planar.arc_waypoints}
    action_horizon: ${planar.action_horizon}
    native_action_dim: 3
    dt: ${planar.arc_dt}

# The shared U-Socket data config builds transform_list for the OLD hybrid
# tokenizer and passes neither dt nor rotation_distance_unit, so without these
# the angular budget is silently uncapped and every R value is identical.
data:
  train_datasets:
    pushshapes_sim_u_socket:
      resolver:
        transform_list:
          dt: ${planar.arc_dt}
          rotation_distance_unit: ${planar.arc_rotation_distance}
  valid_datasets:
    pushshapes_sim_u_socket:
      resolver:
        transform_list:
          dt: ${planar.arc_dt}
          rotation_distance_unit: ${planar.arc_rotation_distance}

# eval_planar_v2 hardcodes the width-5 partition; this token is width 6.
evaluator:
  semantic_blocks: [[0, 2], [2, 3], [3, 5], [5, 6]]

eval_checkpoint:
  use_ema: true
callbacks:
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9999
    use_warmup: true
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_decay: 0.0
    validate_with_ema: true
