# @package _global_
defaults:
  - /experiment/ravens/base
  - override /model: libero/action_flow_oat_dp_matched
  - _self_
name: ravens_place_red_in_green_action_flow
trainer:
  gradient_clip_val: 3.0
callbacks:
  ema:
    _target_: egomimic.pl_utils.oat_matched_training.ActionFlowFixedEMACallback
    decay: 0.9978
    use_warmup: false
  av_only_layer_norm:
    _target_: egomimic.pipeline.action_flow_av_norm.AVOnlyLayerNormCallback
    expected_norms_per_decoder: 25
    require_routed: false
  dit_half:
    _target_: egomimic.utils.libero_dit_half.LiberoDiTHalf
    source_key: ravens_ur5
