model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch}"
  save_last: true
  save_top_k: -1
  every_n_epochs: 10
ema:
  _target_: egomimic.pl_utils.oat_training.OATEMACallback
  final_checkpoint_path: ${paths.output_dir}/checkpoints/last.ckpt
  decay: 0.9999
  use_warmup: true
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_decay: 0.0
  validate_with_ema: true
batch_budget:
  _target_: egomimic.pl_utils.oat_training.OATBatchBudgetCallback
  global_batch_size: 1024
  report_path: ${paths.output_dir}/training-budget.json
