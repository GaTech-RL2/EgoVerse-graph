# Matched Action Flow observation prefix, multiplier conditioning, ~261M total.
defaults:
- /model/bf/bf_planar_v2_dp_standard@_here_
- _self_
condition_dim: 128
unet_down_dims:
- 648
- 1296
- 2592
pipeline:
  stages:
  - _target_: egomimic.pipeline.stages_sampler.KeyedFeatureProjection
    selector_key: embodiment
    selector_aliases:
      19: pushshapes_sim_u_socket
      20: pushshapes_sim_chain_gripper
    input_key: state_agent_model
    output_key: proprio_condition
    output_dim: 64
    projections:
      pushshapes_sim_u_socket:
        input_dim: 4
        hidden_dim: 64
        semantic: x_y_cos_theta_sin_theta
      pushshapes_sim_chain_gripper:
        input_dim: 4
        hidden_dim: 64
        semantic: x_y_cos_theta_sin_theta
  - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
    n_obs_steps: 1
    inputs:
      front_img_1: front_img_1
      proprio_condition: proprio_condition
    encoder:
      _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
      obs_specs:
        proprio_condition:
          input_dim: 64
          input_slice:
          - 0
          - 64
      img_encoders:
        front_img_1:
          _target_: egomimic.models.stems.visual_core.VisualCore
          in_channels: 3
          image_size: 96
          num_kp: 32
          feature_dimension: 64
          pretrained: false
          crop_aug: true
          crop_height: 84
          crop_width: 84
          crop_eval_mode: center
          crop_sample_mode: v02
          crop_scope: frame
          norm_layer: group
          pool_type: spatial_softmax
  - _target_: egomimic.pipeline.stages_speed.SharedSpeedCondition
    conditioning_input: retiming_multiplier
    condition_dim: 128
    output_key: condition
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
    action_horizon: 16
    action_dim: 5
    noise_scheduler:
      _target_: egomimic.models.ddim_scheduler.DDIMScheduler
      num_train_timesteps: 100
      beta_schedule: squaredcos_cap_v2
      prediction_type: epsilon
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
    action_horizon: 16
    action_dim: 5
    condition_input_dim: 128
    policy:
      _target_: egomimic.models.diffusion_policy.DiffusionPolicy
      action_horizon: 16
      num_inference_steps: 100
      model:
        _target_: egomimic.models.denoising_nets.ConditionalUnet1D
        input_dim: 5
        cond_dim: 128
        ac_latent_seq: 1
        diffusion_step_embed_dim: 256
        down_dims: ${model.unet_down_dims}
        kernel_size: 3
      noise_scheduler:
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage
    active_action_dims_by_embodiment: ${oc.select:planar.active_action_dims,null}
