_target_: egomimic.pl_utils.pl_model.ModelWrapper
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01
scheduler: null
training_behavior:
  _target_: egomimic.pl_utils.world_model_behavior.WorldModelTrainingBehavior
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    world_model: 0
  stages:
    - _target_: egomimic.pipeline.stages_world_model.WorldModelStage
      warmup_steps: 10000
      pose_ramp_steps: 10000
      image_weight: 1.0
      track_weight: 1.0
      pose_weight: 1.0
      sampler_steps: 20
      model:
        _target_: egomimic.models.world_model.MoTWorldModel
        # REQUIRED from prepared measured-pose schemas; never use policy action widths.
        pose_dims: ???
        image_dim: 768
        width: 384
        depth: 8
        heads: 6
        mlp_ratio: 4
        image_adapter_dim: 48
        max_cameras: 3
        max_tracks: 1120
        max_tokens: 8192
        time_mode: ${data.mode}
