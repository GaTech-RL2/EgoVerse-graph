# @package _global_
# Shared Cartesian clock contract; task recipes own D, R, M and the data pool.
abc:
  arc_clock_mode: velocity
  arc_streams: full_separation
  arc_stream_dims:
    full_separation: 20
    translation_rotation: 18
    translation: 16
    projection: 16
  # Duration rows are absolute seconds from the anchor; velocity rows are incoming rates.
  arc_timing_layouts:
    velocity: first_delay_incoming_v1
    duration: first_delay_absolute_v1
  arc_token_dim: ${abc.arc_stream_dims.${abc.arc_streams}}
  arc_token_rows: ${abc.arc_waypoints}
run_provenance:
  action_contract:
    representation: ${abc.action_mode}
    arc_chunking_mode: ${abc.arc_chunking_mode}
    translation_distance_m: ${abc.arc_distance}
    rotation_distance_radians: ${abc.arc_rotation_distance}
    waypoints: ${abc.arc_waypoints}
    clock_mode: ${abc.arc_clock_mode}
    streams: ${abc.arc_streams}
    timing_layout: ${abc.arc_timing_layouts.${abc.arc_clock_mode}}
    hold_window_frames: 400
    gripper_stream_mode: ${oc.select:abc.arc_gripper_stream_mode,events}
    gripper_distance_unit: ${oc.select:abc.arc_gripper_distance,null}
    control_dt: ${evaluator.control_dt}
