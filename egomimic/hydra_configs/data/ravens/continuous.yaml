_target_: egomimic.rldb.zarr.data_module.LiberoDataModule
train_datasets:
  ravens_ur5: &dataset
    _target_: egomimic.rldb.zarr.libero_dataset.LiberoDataset._from_resolver
    resolver:
      _target_: egomimic.benchmarks.ravens.replay.RavensReplayResolver
      folder_path: ${benchmark.dataset}
      suite: ${benchmark.suite}
      task_module: ${benchmark.task_module}
      task_class: ${benchmark.task_class}
      decoded_cache: ${benchmark.decoded_replay_cache}
      key_map:
        _target_: egomimic.rldb.zarr.libero_dataset.keymap
        n_obs_steps: ${benchmark.n_obs_steps}
        horizon: ${benchmark.horizon}
    mode: train
    valid_ratio: 0.1
    split_seed: ${seed}
valid_datasets:
  ravens_ur5:
    <<: *dataset
    mode: valid
train_dataloader_params:
  ravens_ur5: &loader
    batch_size: ${benchmark.batch_size}
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    drop_last: true
valid_dataloader_params:
  ravens_ur5:
    <<: *loader
    drop_last: false
    shuffle: false
