# @package _global_
# Slow-pace 366 robot-only BC, codec arcvel without speed smoothing (Elmo, 2026-10-15).
# Matches the 10-05 Lambda baseline bc_rl2_stattempo_slowpace_arcvel_lambda (h640t8, 240k, 366 / 24
# episodes, open-loop row-cut validation); only speed_smooth_frames (7 -> 1) and run identity differ.
defaults:
- /experiment/yam_arc_grid/_base/stattempo_openloop
- override /model: e1/hpt_flow_wrists_ft_arcdur
- override /data: abc_arc/stationery_slowpace366_bc_time
- _self_
name: bc_rl2_stattempo_slowpace366_arcvel_nosmooth
description: h640t8_d384x10_cos10k_240k_s42_${name}
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcvel
          speed_smooth_frames: 1
  valid_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcvel
          speed_smooth_frames: 1
e1:
  variant: arcvel
  action_dim: 16
hpt:
  action_dim: 16
evaluator:
  action_mode: arc
  token_layout: e1_profile
model:
  inference_contracts:
    arcvel:
      compatibility:
        tokenizer:
          speed_smooth_frames: 1
logger:
  wandb:
    id: ${name}_20261015_s42
    tags: [rl2, stationery, stattempo, slowpace366, bc, arcvel, openloop_val, no_speed_smoothing]
