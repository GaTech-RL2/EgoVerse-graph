# @package _global_
# Slow-pace 366 robot-only BC, codec arcdur with absolute waypoint times (Elmo, 2026-10-15).
# Matches the 10-05 Lambda baseline bc_rl2_stattempo_slowpace_arcdur_lambda (h640t8, 240k, 366 / 24
# episodes, open-loop row-cut validation); only the duration timing and run identity differ.
defaults:
- /experiment/yam_arc_grid/_base/stattempo_openloop
- override /model: e1/hpt_flow_wrists_ft_arcdur
- override /data: abc_arc/stationery_slowpace366_bc_time
- _self_
name: bc_rl2_stattempo_slowpace366_arcdur_abstime
description: h640t8_d384x10_cos10k_240k_s42_${name}
data:
  train_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcdur
          duration_timing: absolute
  valid_datasets:
    yam_bimanual:
      resolver:
        transform_list:
          variant: arcdur
          duration_timing: absolute
e1:
  variant: arcdur
  action_dim: 16
hpt:
  action_dim: 16
evaluator:
  action_mode: arc
  token_layout: e1_dur
  duration_timing: absolute
model:
  inference_contracts:
    arcdur:
      native_output:
        timing:
          kind: per_waypoint_absolute_time
      compatibility:
        tokenizer:
          duration_timing: absolute
      profiles:
        default:
          adapter:
            decoder:
              duration_timing: absolute
logger:
  wandb:
    id: ${name}_20261015_s42
    tags: [rl2, stationery, stattempo, slowpace366, bc, arcdur, openloop_val, absolute_waypoint_time]
