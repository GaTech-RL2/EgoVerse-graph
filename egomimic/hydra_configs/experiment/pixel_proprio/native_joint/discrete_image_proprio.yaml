# @package _global_
defaults:
- /experiment/pixel_proprio/native_joint/common
- _self_
name: native_mot_discrete_image_proprio_s42_300k
description: Historical image core with minimal joint state extension, historical compilation preserved
modality_ablation:
  active_streams: [image, proprio]
  stage_ids: {joint_noising: 0, joint_denoiser: 1, image_loss: 2, proprio_loss: 3, joint_sampler: 4}
  graph:
  - ${modality_ablation.nodes.joint_noising}
  - ${modality_ablation.nodes.joint_denoiser}
  - ${modality_ablation.nodes.image_loss}
  - ${modality_ablation.nodes.proprio_loss}
  - ${modality_ablation.nodes.joint_sampler}
evaluator:
  objective: visual_proprio
joint:
  pose_dims: {libero_gripper: 36}
  max_tokens: 3216
data:
  mode: discrete
  sampling_strategy: discrete_window
  discrete_frames: 16
  stride: 4
  batch_size: 16
  distributed_world_size: 2
trainer:
  devices: 2
