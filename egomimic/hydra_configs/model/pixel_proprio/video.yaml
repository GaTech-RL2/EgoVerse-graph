_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.00005
  weight_decay: 0.01
scheduler: null
training_behavior:
  _target_: egomimic.pl_utils.world_model_behavior.WorldModelTrainingBehavior
train_log_on_step: true
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    pixel_noising: 0
    pixel_denoiser: 1
    pixel_loss: 2
    pixel_sampler: 3
    image_proprio: 1 # Existing stable initialization name, same registered model.
  stages:
    - _target_: egomimic.pipeline.stages_pixel_video.PixelVideoNoisingStage
      noising:
        _target_: egomimic.models.pixel_diffusion.LinearGaussianImageNoising
        maximum: 1.0
    - _target_: egomimic.pipeline.stages_pixel_video.PixelVideoDenoiserStage
      model:
        _target_: egomimic.models.image_proprio.ImageProprioModel
        objective: visual_only
        phase_a_condition_on_proprio: false
        pose_dims: null
        action_dims: null
        image_dim: 768 # 16 * 16 * 3 raw RGB values; no image encoder.
        width: 768
        depth: 8
        heads: 6
        mlp_ratio: 4
        max_cameras: 2
        use_camera_embedding: true
        use_modality_embedding: false
        use_embodiment_embedding: false
        use_phase_embedding: false
        noise_conditioning: adaln_zero
        position_encoding: spatiotemporal_rope
        rope_axis_dims: [64, 32, 32]
        spatial_grid_size: [10, 10]
        max_tokens: ${pixel_video.max_tokens}
        time_mode: ${data.mode}
        attention_backend: ${oc.select:world_model_attention.backend,sdpa}
        attention_dtype: ${oc.select:world_model_attention.dtype,native}
        strict_fp32: ${runtime.strict_fp32}
        attention_query_chunk_size: ${oc.select:world_model_attention.query_chunk_size,0}
        activation_checkpointing: ${oc.select:world_model_attention.activation_checkpointing,false}
        allow_patch_compression: false
        loss_reduction: ${oc.select:world_model_execution.loss_reduction,token_mean}
        token_execution: ${oc.select:world_model_execution.token_execution,padded}
        compile_mode: ${oc.select:world_model_execution.compile_mode,none}
        compile_dynamic: ${oc.select:world_model_execution.compile_dynamic,false}
        compile_backend: ${oc.select:world_model_execution.compile_backend,inductor}
    - _target_: egomimic.pipeline.stages_pixel_video.PixelVideoLossStage
      weight: 1.0
      loss:
        _target_: egomimic.models.pixel_diffusion.PlainPixelMSE
        reduction: ${oc.select:world_model_execution.loss_reduction,token_mean}
    - _target_: egomimic.pipeline.stages_pixel_video.PixelVideoSamplerStage
      sampler:
        _target_: egomimic.models.pixel_diffusion.LinearDDIMImageSampler
        steps: 20
