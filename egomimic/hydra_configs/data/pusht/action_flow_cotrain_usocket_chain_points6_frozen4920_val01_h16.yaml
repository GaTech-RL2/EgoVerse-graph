train_dataloader_params:
  pushshapes_sim_u_socket:
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
  pushshapes_sim_chain_gripper:
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

