<style>
  :root{

  .slide h2{margin:0;font-size:21px;font-weight:640;letter-spacing:-.2px}

  .grid{display:grid;gap:14px;flex:1;min-height:0}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;display:flex;flex-direction:column;min-height:0}
  .card h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--dim);
    text-transform:uppercase;letter-spacing:.7px}
  canvas{width:100%;flex:1;min-height:0;display:block}
  .note{color:var(--dim);font-size:12.5px;margin:5px 0 0}
  .note code,code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#21262d;padding:1px 5px;border-radius:4px;font-size:12px;color:#d2a8ff}
  footer{display:flex;align-items:center;gap:16px;padding:9px 30px 14px}
  .dots{display:flex;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#30363d;cursor:pointer;
    transition:background .2s,transform .2s}
  .dot.on{background:var(--tr);transform:scale(1.32)}
  .hint{color:var(--dim);font-size:12px}
  button{background:#21262d;border:1px solid var(--line);color:var(--ink);

  button:hover{background:#30363d}
  .key{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12.5px}
  .sw{width:12px;height:3px;border-radius:2px;display:inline-block}
  .legend{display:flex;flex-wrap:wrap;gap:4px 0;margin:2px 0 0}
  table.tok{border-collapse:collapse;font-family:ui-monospace,monospace;font-size:11.5px}
  table.tok th,table.tok td{border:1px solid var(--line);padding:3px 7px;text-align:right}
  table.tok th{color:var(--dim);font-weight:600;background:#1c2128}
  .hl-dur{background:rgba(63,185,80,.16)}
  .hl-vel{background:rgba(188,140,255,.16)}
  .big{font-size:27px;font-weight:680;letter-spacing:-.5px}
  .eq{font-family:ui-monospace,monospace;font-size:13px;color:#c9d1d9;
    background:#0b0f14;border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin:6px 0}

const C = {tr:'#58a6ff', rot:'#f0883e', dur:'#3fb950', vel:'#bc8cff', dim:'#8b949e',
           ink:'#e6edf3', grid:'#21262d', ref:'#6e7681'};
document.getElementById('src').textContent =
  DATA.meta.episode + '  frames[' + DATA.meta.start + ',' + (DATA.meta.start+DATA.meta.frames) + ')'
  + '  D=' + DATA.meta.D + 'px  M=' + M + '  R=' + DATA.meta.R_deg.toFixed(0) + '°';

/* ---------- tiny plotting kit ---------- */
function fit(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(10,r.width*d);cv.height=Math.max(10,r.height*d);
  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,r.width,r.height];}
function ext(a){let lo=Infinity,hi=-Infinity;for(const v of a){if(v<lo)lo=v;if(v>hi)hi=v;}
  if(lo===hi){lo-=1;hi+=1;} return [lo,hi];}
function Ax(g,w,h,xd,yd,pad){
  pad=pad||{l:46,r:12,t:10,b:26};
  const X=v=>pad.l+(v-xd[0])/(xd[1]-xd[0])*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v-yd[0])/(yd[1]-yd[0])*(h-pad.t-pad.b);
  g.strokeStyle=C.grid;g.lineWidth=1;g.fillStyle=C.dim;g.font='10px ui-monospace,monospace';
  for(let i=0;i<=4;i++){const v=yd[0]+(yd[1]-yd[0])*i/4,y=Y(v);
    g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();
    g.textAlign='right';g.fillText(fmt(v),pad.l-6,y+3);}
  for(let i=0;i<=4;i++){const v=xd[0]+(xd[1]-xd[0])*i/4,x=X(v);
    g.textAlign='center';g.fillText(fmt(v),x,h-8);}
  return {X,Y,pad};
}
function fmt(v){const a=Math.abs(v);
  if(a>=1000)return v.toFixed(0); if(a>=100)return v.toFixed(0);
  if(a>=10)return v.toFixed(1); if(a>=1)return v.toFixed(1);
  if(a===0)return '0'; return v.toFixed(2);}
function line(g,ax,xs,ys,col,wd,n){g.strokeStyle=col;g.lineWidth=wd||2;g.beginPath();
  const k=(n===undefined)?xs.length:Math.min(n,xs.length);
  for(let i=0;i<k;i++){const X=ax.X(xs[i]),Y=ax.Y(ys[i]);i?g.lineTo(X,Y):g.moveTo(X,Y);}
  g.stroke();}
function dots(g,ax,xs,ys,col,r,n){g.fillStyle=col;
  const k=(n===undefined)?xs.length:Math.min(n,xs.length);
  for(let i=0;i<k;i++){g.beginPath();g.arc(ax.X(xs[i]),ax.Y(ys[i]),r||2.4,0,7);g.fill();}}
function hline(g,ax,w,y,col,label){g.save();g.setLineDash([5,4]);g.strokeStyle=col;g.lineWidth=1.5;
  g.beginPath();g.moveTo(ax.pad.l,ax.Y(y));g.lineTo(w-ax.pad.r,ax.Y(y));g.stroke();g.restore();
  if(label){g.fillStyle=col;g.font='11px ui-monospace,monospace';g.textAlign='right';
    g.fillText(label,w-16,ax.Y(y)-5);}}
function title(g,w,t,col){g.fillStyle=col||C.dim;g.font='11px ui-monospace,monospace';
  g.textAlign='left';g.fillText(t,46,12);}
function key(items){return '<div class="legend">'+items.map(i=>
  '<span class="key"><span class="sw" style="background:'+i[1]+'"></span>'+i[0]+'</span>').join('')+'</div>';}

/* ---------- slides ---------- */
const S = [];

/* 1 — the raw window */
S.push({title:'One action chunk, as collected',
  sub:'80 frames at 30 Hz',
  lede:'The policy must emit this. <b>x and y sweep a long path while θ turns only a little</b> — the two channels move on completely different scales, and neither moves at a constant rate.',
  html:'<div class="grid g3">'+
    '<div class="card"><h3>path in the plane</h3><canvas id="c1a"></canvas></div>'+
    '<div class="card"><h3>x, y vs time</h3><canvas id="c1b"></canvas>'+key([['x',C.tr],['y','#79c0ff']])+'</div>'+
    '<div class="card"><h3>θ vs time</h3><canvas id="c1c"></canvas>'+key([['θ (rad)',C.rot]])+'</div></div>'+
    '<p class="note">Total travel <b>'+DATA.clocks.translation_total.toFixed(0)+' px</b> and <b>'+
    (DATA.clocks.angle_total*180/Math.PI).toFixed(0)+'°</b> of turning across the window.</p>',
  draw:(p)=>{
    const R=DATA.raw;
    {const [g,w,h]=fit(document.getElementById('c1a'));
     const xd=ext(R.x),yd=ext(R.y),n=Math.max(2,Math.round(p*R.x.length));
     const ax=Ax(g,w,h,xd,yd);
     line(g,ax,R.x,R.y,'#2d3748',1.5);
     line(g,ax,R.x,R.y,C.tr,2.2,n);
     if(n>1){const i=n-1;g.fillStyle='#fff';g.beginPath();g.arc(ax.X(R.x[i]),ax.Y(R.y[i]),4,0,7);g.fill();
       const L=26,th=R.theta[i];g.strokeStyle=C.rot;g.lineWidth=2.5;g.beginPath();
       g.moveTo(ax.X(R.x[i]),ax.Y(R.y[i]));
       g.lineTo(ax.X(R.x[i])+L*Math.cos(th),ax.Y(R.y[i])-L*Math.sin(th));g.stroke();}
     title(g,w,'tool pose, heading in orange');}
    {const [g,w,h]=fit(document.getElementById('c1b'));
     const yd=ext(R.x.concat(R.y)),ax=Ax(g,w,h,[0,R.t[R.t.length-1]],yd);
     const n=Math.round(p*R.t.length);
     line(g,ax,R.t,R.x,C.tr,2,n); line(g,ax,R.t,R.y,'#79c0ff',2,n);}
    {const [g,w,h]=fit(document.getElementById('c1c'));
     const ax=Ax(g,w,h,[0,R.t[R.t.length-1]],ext(R.theta));
     line(g,ax,R.t,R.theta,C.rot,2,Math.round(p*R.t.length));}
  }});

/* 2 — two clocks */
S.push({title:'Two arc clocks, not one',
  sub:'cumulative distance travelled, per stream',
  lede:'Instead of indexing by time, the codec indexes by <b>how far each stream has travelled</b>. Translation accumulates <code>|Δxy|</code>; rotation accumulates <code>|Δθ|</code>. They are separate cumulative sums with <b>separate budgets</b>, D and R.',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>translation clock — cumsum |Δxy|</h3><canvas id="c2a"></canvas>'+
    key([['arc length (px)',C.tr],['budget D = '+DATA.meta.D+' px','#f85149']])+'</div>'+
    '<div class="card"><h3>rotation clock — cumsum |Δθ|</h3><canvas id="c2b"></canvas>'+
    key([['arc length (deg)',C.rot],['budget R = '+DATA.meta.R_deg.toFixed(0)+'°','#f85149']])+'</div></div>'+
    '<p class="note">Both clocks <b>saturate</b> here: the window travels '+DATA.clocks.translation_total.toFixed(0)+
    ' px but D caps it at '+DATA.meta.D+', and turns '+(DATA.clocks.angle_total*180/Math.PI).toFixed(0)+
    '° but R caps it at '+DATA.meta.R_deg.toFixed(0)+'°. So the token describes a <b>prefix</b> of the window — and the two streams stop at <b>different frames</b>.</p>',
  draw:(p)=>{
    const R=DATA.raw,K=DATA.clocks,n=Math.round(p*R.t.length);
    {const [g,w,h]=fit(document.getElementById('c2a'));
     const ax=Ax(g,w,h,[0,R.t[R.t.length-1]],[0,Math.max(K.translation_total,DATA.meta.D)*1.05]);
     line(g,ax,R.t,K.translation,C.tr,2.4,n); hline(g,ax,w,DATA.meta.D,'#f85149','D');
     title(g,w,'time →');}
    {const [g,w,h]=fit(document.getElementById('c2b'));
     const deg=K.angle.map(v=>v*180/Math.PI), tot=K.angle_total*180/Math.PI;
     const ax=Ax(g,w,h,[0,R.t[R.t.length-1]],[0,Math.max(tot,DATA.meta.R_deg)*1.05]);
     line(g,ax,R.t,deg,C.rot,2.4,n); hline(g,ax,w,DATA.meta.R_deg,'#f85149','R');
     title(g,w,'time →');}
  }});

/* 3 — resampling */
S.push({title:'Sample each clock at M even steps',
  sub:'M = '+M+' waypoints per stream',
  lede:'Evenly spaced in <b>arc length</b> is <b>unevenly spaced in time</b>. That is the whole trick: the waypoints crowd where the motion is slow and spread where it is fast, so geometry gets a uniform budget regardless of speed.',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>even in arc → uneven in time</h3><canvas id="c3a"></canvas>'+
    key([['translation waypoints',C.tr],['rotation waypoints',C.rot]])+'</div>'+
    '<div class="card"><h3>the two streams land at different times</h3><canvas id="c3b"></canvas>'+
    key([['source time of translation wp i',C.tr],['source time of rotation wp i',C.rot]])+'</div></div>'+
    '<p class="note">Row <code>i</code> of the token is waypoint <code>i</code> of <b>each</b> stream — a shared <b>waypoint index</b>, not a shared timestamp. Sharing a row costs nothing because both streams produce exactly M samples.</p>',
  draw:(p)=>{
    const W=DATA.waypoints,K=DATA.clocks,R=DATA.raw,n=Math.max(1,Math.round(p*M));
    {const [g,w,h]=fit(document.getElementById('c3a'));
     const ax=Ax(g,w,h,[0,R.t[R.t.length-1]],[0,1.05]);
     const nt=K.translation_total?K.translation.map(v=>v/Math.max(K.translation_end,1e-9)):[];
     line(g,ax,R.t,nt.map(v=>Math.min(v,1)),'#2d3748',1.5);
     for(let i=0;i<n;i++){const x=ax.X(W.t_tr[i]);
       g.strokeStyle=C.tr;g.globalAlpha=.55;g.lineWidth=1;
       g.beginPath();g.moveTo(x,ax.Y(0));g.lineTo(x,ax.Y(W.s_tr[i]/Math.max(K.translation_end,1e-9)));g.stroke();g.globalAlpha=1;}
     dots(g,ax,W.t_tr,W.s_tr.map(v=>v/Math.max(K.translation_end,1e-9)),C.tr,2.6,n);
     for(let i=0;i<n;i++){const x=ax.X(W.t_an[i]);
       g.strokeStyle=C.rot;g.globalAlpha=.45;g.lineWidth=1;
       g.beginPath();g.moveTo(x,ax.Y(0));g.lineTo(x,ax.Y(-0.04));g.stroke();g.globalAlpha=1;}
     dots(g,ax,W.t_an,W.s_an.map(()=>-0.04),C.rot,2.6,n);
     title(g,w,'source time →   (ticks = where waypoints fall)');}
    {const [g,w,h]=fit(document.getElementById('c3b'));
     const mx=Math.max(W.t_tr[M-1],W.t_an[M-1]);
     const ax=Ax(g,w,h,[0,M-1],[0,mx*1.05]);
     const idx=[...Array(M).keys()];
     line(g,ax,idx,W.t_tr,C.tr,2.4,n); line(g,ax,idx,W.t_an,C.rot,2.4,n);
     title(g,w,'waypoint index i →      y = source time (s)');}
  }});

/* 4 — the token */
S.push({title:'The token: [M, 6]',
  sub:'four geometry columns shared, two timing columns differ',
  lede:'Both variants place the <b>identical</b> geometry in columns 0–1 and 3–4. They differ in <b>columns 2 and 5 only</b> — what carries the schedule.',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>stacked velocity token</h3>'+
    '<div class="eq">[ x, y, <span class="vel">v_xy</span>, cosθ, sinθ, <span class="vel">ω</span> ]</div>'+
    '<canvas id="c4a"></canvas>'+key([['v_xy  (px/s)',C.vel],['ω  (rad/s, signed)','#d2a8ff']])+'</div>'+
    '<div class="card"><h3>duration token</h3>'+
    '<div class="eq">[ x, y, <span class="good">Δt_tr</span>, cosθ, sinθ, <span class="good">Δt_rot</span> ]</div>'+
    '<canvas id="c4b"></canvas>'+key([['Δt translation (s)',C.dur],['Δt rotation (s)','#7ee787']])+'</div></div>'+
    '<p class="note">Same rows, same geometry, same budgets. <b>One variable changes.</b></p>',
  draw:(p)=>{
    const V=DATA.token_velocity,U=DATA.token_duration,idx=[...Array(M).keys()],n=Math.round(p*M);
    {const [g,w,h]=fit(document.getElementById('c4a'));
     const ax=Ax(g,w,h,[0,M-1],ext(V.v_xy.concat(V.omega.map(v=>v*20))));
     line(g,ax,idx,V.v_xy,C.vel,2.2,n);
     line(g,ax,idx,V.omega.map(v=>v*20),'#d2a8ff',1.8,n);
     title(g,w,'row i →    (ω scaled ×20 to share the axis)');}
    {const [g,w,h]=fit(document.getElementById('c4b'));
     const ax=Ax(g,w,h,[0,M-1],ext(U.dt_tr.concat(U.dt_rot)));
     line(g,ax,idx,U.dt_tr,C.dur,2.2,n);
     line(g,ax,idx,U.dt_rot,'#7ee787',1.8,n);
     title(g,w,'row i →    both in the SAME unit: seconds');}
  }});

/* 5 — why duration */
S.push({title:'Why duration is the more primitive carrier',
  sub:'the velocity codec computes a duration and then divides it away',
  lede:'',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>encode</h3>'+
    '<div class="eq"><span class="dim">_sample_stream, both variants:</span><br>'+
    'Δt = diff(source_time_at_waypoint)<br><br>'+
    '<span class="vel">velocity:</span> rate = Δgeometry / Δt   <span class="bad">← divides Δt away</span><br>'+
    '<span class="good">duration:</span> store Δt                 <span class="good">← keeps what it had</span></div>'+
    '<h3 style="margin-top:10px">decode</h3>'+
    '<div class="eq"><span class="vel">velocity:</span> Δt = Δgeometry / |rate|  <span class="bad">← inverts the division</span><br>'+
    '&nbsp;&nbsp;&nbsp;&nbsp;+ a synthetic stop_duration when rate≈0<br><br>'+
    '<span class="good">duration:</span> Δt = clamp(value, 0)   <span class="good">← reads it</span></div></div>'+
    '<div class="card"><h3>the sign of ω is never read</h3><canvas id="c5"></canvas>'+
    '<p class="note">The decoder uses <code>rate.abs()</code> — direction is already carried by the cos/sin waypoints. So the velocity codec trains the model to predict a <b>sign that decoding discards</b>. Duration has no sign to waste: a hold is just a long interval, where a rate codec needs a zero-velocity special case.</p></div></div>',
  draw:(p)=>{
    const V=DATA.token_velocity,idx=[...Array(M).keys()],n=Math.round(p*M);
    const [g,w,h]=fit(document.getElementById('c5'));
    const ax=Ax(g,w,h,[0,M-1],ext(V.omega.concat(V.omega.map(Math.abs))));
    hline(g,ax,w,0,'#30363d','');
    line(g,ax,idx,V.omega,'#d2a8ff',2.2,n);
    line(g,ax,idx,V.omega.map(Math.abs),C.dur,2,n);
    title(g,w,'predicted ω (purple)  vs  what decode actually uses, |ω| (green)');}
  });

/* 6 — decode */
S.push({title:'Both decode to the same trajectory',
  sub:''+DATA.meta.H+'-step chunk, reconstructed',
  lede:'This matters: duration is <b>not</b> a better fit to the data — it is a better thing for a network to predict. Reconstruction from ground-truth tokens is essentially identical.',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>reconstructed path</h3><canvas id="c6a"></canvas>'+
    key([['source',C.ref],['velocity decode',C.vel],['duration decode',C.dur]])+'</div>'+
    '<div class="card"><h3>θ over the chunk</h3><canvas id="c6b"></canvas>'+
    '<p class="note">Max xy error — velocity <b>'+DATA.decode.err_v+' px</b>, duration <b>'+DATA.decode.err_d+
    ' px</b>. The codec is not the bottleneck; the 260M rollout study found all three action representations statistically indistinguishable (all pairwise p &gt; 0.78).</p></div></div>',
  draw:(p)=>{
    const d=DATA.decode,n=Math.max(2,Math.round(p*d.ref_x.length));
    {const [g,w,h]=fit(document.getElementById('c6a'));
     const ax=Ax(g,w,h,ext(d.ref_x.concat(d.v_x,d.d_x)),ext(d.ref_y.concat(d.v_y,d.d_y)));
     line(g,ax,d.ref_x,d.ref_y,C.ref,4,n);
     line(g,ax,d.v_x,d.v_y,C.vel,2.2,n);
     line(g,ax,d.d_x,d.d_y,C.dur,2.2,n);
     dots(g,ax,d.ref_x,d.ref_y,C.ref,2.2,n);}
    {const [g,w,h]=fit(document.getElementById('c6b'));
     const idx=[...Array(d.ref_theta.length).keys()];
     const ax=Ax(g,w,h,[0,idx.length-1],ext(d.ref_theta.concat(d.v_theta,d.d_theta)));
     line(g,ax,idx,d.ref_theta,C.ref,4,n);
     line(g,ax,idx,d.v_theta,C.vel,2.2,n);
     line(g,ax,idx,d.d_theta,C.dur,2.2,n);
     title(g,w,'step →');}
  }});

/* 7 — grip */
S.push({title:'And on the articulated corpus, a 7th column',
  sub:'grip carries on the translation clock',
  lede:'Six of the nine articulated embodiments latch, grasp or suction. A width-6 token throws the engage channel away — reproducing “every grasp is a shove” at the representation layer.',
  html:'<div class="grid g2">'+
    '<div class="card"><h3>the widened token</h3>'+
    '<div class="eq">[ x, y, <span class="good">Δt_tr</span>, cosθ, sinθ, <span class="good">Δt_rot</span>, <span style="color:#f0883e">grip</span> ]</div>'+
    '<p class="lede" style="margin-top:8px">Grip rides the <b>translation clock</b> — it is <i>carried</i>, with no clock and no budget of its own. Closing on an object is an event <b>at a place along the path</b>; a third clock would let decoded grip slide relative to the pose that commanded it.</p>'+
    '<p class="note">It is interpolated, not rate-decoded — it is a level, not a motion — and clamped to [0,1], because the simulator reads it as a level and diffusion samples do not respect that range.</p></div>'+
    '<div class="card"><h3>3-DOF tools pad to constant zero</h3><canvas id="c7"></canvas>'+
    '<p class="note"><code>u_socket</code>, <code>triangle</code> and <code>scoop</code> have no grip channel; <code>PadPlanarAction</code> fills it with 0, which is correct — they engage through geometry. Verified: width 7 is <b>bit-identical</b> to width 6 on its first six columns, so the grip ablation is not confounded by a geometry change.</p></div></div>',
  draw:(p)=>{
    const [g,w,h]=fit(document.getElementById('c7'));
    const idx=[...Array(M).keys()],n=Math.round(p*M);
    const g4=idx.map(i=>1/(1+Math.exp(-(i-M*0.42)/2.0)));
    const ax=Ax(g,w,h,[0,M-1],[-0.08,1.12]);
    line(g,ax,idx,g4,C.rot,2.4,n);
    line(g,ax,idx,idx.map(()=>0),C.tr,2.4,n);
    g.fillStyle=C.rot;g.font='11px ui-monospace,monospace';g.textAlign='left';
    g.fillText('4-DOF: gripper, chain_gripper, suction, umi, flipper, spring',ax.X(1),ax.Y(1.06));
    g.fillStyle=C.tr;g.fillText('3-DOF: u_socket, triangle, scoop  — padded 0',ax.X(1),ax.Y(0.10));
    title(g,w,'row i →      grip level');}
  });

/* ---------- runtime ---------- */
const main=document.getElementById('main'),dotsEl=document.getElementById('dots');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';d.id='s'+i;
  d.innerHTML='<h2>'+s.title+'<small>'+(s.sub||'')+'</small></h2>'+
    (s.lede?'<p class="lede">'+s.lede+'</p>':'')+s.html;
  main.appendChild(d);
  const b=document.createElement('div');b.className='dot';b.onclick=()=>go(i);dotsEl.appendChild(b);
});
let cur=-1,raf=0,t0=0;
function go(i){
  if(i<0||i>=S.length)return;
  cur=i;
  [...main.children].forEach((e,k)=>e.classList.toggle('on',k===i));
  [...dotsEl.children].forEach((e,k)=>e.classList.toggle('on',k===i));
  play();
}
function play(){
  cancelAnimationFrame(raf);t0=performance.now();
  const dur=1150, s=S[cur];
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    try{s.draw(e);}catch(err){console.error(err);}
    if(p<1)raf=requestAnimationFrame(step);
  })(performance.now());
}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('replay').onclick=play;
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  if(e.key==='r')play();
});
addEventListener('resize',()=>{if(cur>=0)play();});
go(0);
</script>
