# Classic robot + human cotraining on RL2 organize_stationary, operator Elmo.
# Robot: yam_bimanual. Human: Aria gen1 recordings processed as human_bimanual.
# Both run at native 30 Hz with the same action contract: 100-frame baseline
# chunks, or ARC tokens read from a 200-frame source window. Validation holds
# out 5% of each embodiment's episodes (10 robot, 1 human).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    resolver:
      _target_: egomimic.rldb.zarr.control_rate.ControlRateS3EpisodeResolver
      control_fps: 30
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR}
      image_hw: [480, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: ${abc.action_mode}
        annotation_key: null
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        arc_chunking_mode: ${abc.arc_chunking_mode}
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: ${abc.action_mode}
        coord_frame: eef_frame
        rotation_mode: euler
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        arc_chunking_mode: ${abc.arc_chunking_mode}
        resampled_vector_length: ${abc.arc_waypoints}
        velocity_mode: ${abc.arc_velocity_mode}
        velocity_layout: ${abc.arc_velocity_layout}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'yam_bimanual' and row['lab'] == 'rl2' and row['task'] == 'organize_stationary' and str(row.get('operator') or '').lower() == 'elmo' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.05
    split_seed: 42
    bounds_check: false
  human_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR}
      image_hw: [480, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: ${abc.human_keymap_mode}
        annotation_key: null
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        arc_chunking_mode: ${abc.arc_chunking_mode}
        # Match the robot: 100 native frames per baseline chunk, and a
        # 200-frame ARC read window.
        action_horizon: ${abc.action_horizon}
        source_buffer_frames: 200
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: ${abc.human_action_mode}
        coord_frame: eef_frame
        rotation_mode: euler
        stride: 1
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        arc_chunking_mode: ${abc.arc_chunking_mode}
        resampled_vector_length: ${abc.arc_waypoints}
        velocity_mode: ${abc.arc_velocity_mode}
        velocity_layout: ${abc.arc_velocity_layout}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'rl2' and row['task'] == 'organize_stationary' and str(row.get('operator') or '').lower() == 'elmo' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.05
    split_seed: 42
    bounds_check: false
valid_datasets:
  yam_bimanual:
    _target_: ${...train_datasets.yam_bimanual._target_}
    batch_keys: ${...train_datasets.yam_bimanual.batch_keys}
    resolver: ${...train_datasets.yam_bimanual.resolver}
    filters: ${...train_datasets.yam_bimanual.filters}
    mode: valid
    valid_ratio: ${...train_datasets.yam_bimanual.valid_ratio}
    split_seed: ${...train_datasets.yam_bimanual.split_seed}
    bounds_check: false
  human_bimanual:
    _target_: ${...train_datasets.human_bimanual._target_}
    batch_keys: ${...train_datasets.human_bimanual.batch_keys}
    resolver: ${...train_datasets.human_bimanual.resolver}
    filters: ${...train_datasets.human_bimanual.filters}
    mode: valid
    valid_ratio: ${...train_datasets.human_bimanual.valid_ratio}
    split_seed: ${...train_datasets.human_bimanual.split_seed}
    bounds_check: false
train_dataloader_params:
  yam_bimanual: {batch_size: 16, num_workers: 8}
  human_bimanual: {batch_size: 16, num_workers: 6}
valid_dataloader_params:
  yam_bimanual: {batch_size: 8, num_workers: 4}
  human_bimanual: {batch_size: 8, num_workers: 2}
