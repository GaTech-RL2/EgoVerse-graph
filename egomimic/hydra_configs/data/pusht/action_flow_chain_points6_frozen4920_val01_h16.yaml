# PushT view; shared resolver/split lives in parents/episode_split.yaml.
defaults:
- /data/pusht/parents/episode_split@train_datasets.pushshapes_sim_chain_gripper
- /data/pusht/parents/episode_split@valid_datasets.pushshapes_sim_chain_gripper
- _self_
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
train_datasets:
  pushshapes_sim_chain_gripper: &id001
    resolver:
      folder_path: ${oc.env:PUSHSHAPES_CHAIN_GRIPPER_ROOT}
      embodiment_override: pushshapes_sim_chain_gripper
      expected_episode_count: 4920
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_planar_keymap_per_source_proprio
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_points_action_state_transform_list
    mode: train
    split_seed: 42
    expected_train_episode_count: 4871
    expected_train_episode_names_sha256: d862d162202ce830840f19a78fbd18895e6e7c444732beab7b7f65c517560a56
    expected_valid_episode_count: 49
    expected_valid_episode_names_sha256: d06278a1e59f458cff7e7623b3f69fae8edc13692e533424e8c9a57f162f4667
valid_datasets:
  pushshapes_sim_chain_gripper:
    <<: *id001
    mode: valid
train_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
valid_dataloader_params:
  pushshapes_sim_chain_gripper:
    batch_size: 32
    num_workers: 4
    pin_memory: true
