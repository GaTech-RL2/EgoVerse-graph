# MECKA_ALL_PI_6D — pi0.5 on ALL mecka episodes in the SQL table (filters
# lab=mecka with no task filter), stored under the human_bimanual embodiment.
#
# WRIST-frame cartesian actions with the continuous 6D rotation
# representation (18D = xyz+6D per arm, no gripper): each arm's action chunk
# is expressed relative to that wrist's current pose, so both the arbitrary
# world frame AND the moving head frame cancel out of the action targets. The
# proprio ee_pose stays in the head/cam frame (it defines where the wrists
# are for the model and for the eval revert) and is 6D-encoded. stride=1:
# mecka actions are recorded at the target rate (Aria uses 3). Language
# prompts are sampled from the `annotations` track; prompt assembly
# (proprio-in-prompt on, embodiment label off) lives in
# model=pi0.5_bc_mecka_6d, which this config pairs with, alongside
# evaluator=eval_pi_wristframe_6d (reverts wrist -> head frame via the
# proprio, then 6D -> ypr, for cam-frame MSE + viz).
#
# Validation/checkpoint cadence stays the epoch-based trainer default — no
# step-based val_check_interval / every_n_train_steps overrides here.
# Train-set spot check: a second val-style loader over the TRAIN split,
# consumed by the TrainVizEvalVideo wrapper on every validation epoch
# (metrics prefixed `train_viz/`, videos under `videos_train_viz/`). No
# shuffle -> the same leading slice every val, so the curves are comparable
# across time. Activate together with
# `+evaluator@train_viz_evaluator=train_viz_pi_wristframe_6d`.
# Graph port: train_viz is a nested validation group; episode filters retained.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  human_bimanual:
    _target_: egomimic.campaigns.pi05.data.PI05Dataset._from_resolver
    resolver:
      _target_: egomimic.campaigns.pi05.resolvers.S3EpisodeResolver
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      key_map:
        _target_: egomimic.campaigns.pi05.human.Human.get_keymap
        keymap_mode: cartesian_pi
        annotation_key: annotations
      transform_list:
        _target_: egomimic.campaigns.pi05.human.Human.get_transform_list
        mode: cartesian_wristframe_6d
        stride: 1
        fix_mecka_left_wrist: true
        pad_proprio_gripper: true
      image_hw:
      - 480
      - 640
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: str(row.get(''lab'', '''')).lower() == ''mecka'''
    mode: train
    valid_ratio: 0.05
valid_datasets:
  valid:
    human_bimanual:
      _target_: egomimic.campaigns.pi05.data.PI05Dataset._from_resolver
      resolver:
        _target_: egomimic.campaigns.pi05.resolvers.S3EpisodeResolver
        folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
        key_map:
          _target_: egomimic.campaigns.pi05.human.Human.get_keymap
          keymap_mode: cartesian_pi
          annotation_key: annotations
        transform_list:
          _target_: egomimic.campaigns.pi05.human.Human.get_transform_list
          mode: cartesian_wristframe_6d
          stride: 1
          fix_mecka_left_wrist: true
          pad_proprio_gripper: true
        image_hw:
        - 480
        - 640
      filters:
        _target_: egomimic.rldb.filters.DatasetFilter
        filter_lambdas:
        - 'lambda row: str(row.get(''lab'', '''')).lower() == ''mecka'''
      mode: valid
      valid_ratio: 0.05
  train_viz:
    human_bimanual:
      _target_: egomimic.campaigns.pi05.data.PI05Dataset._from_resolver
      resolver:
        _target_: egomimic.campaigns.pi05.resolvers.S3EpisodeResolver
        folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
        key_map:
          _target_: egomimic.campaigns.pi05.human.Human.get_keymap
          keymap_mode: cartesian_pi
          annotation_key: annotations
        transform_list:
          _target_: egomimic.campaigns.pi05.human.Human.get_transform_list
          mode: cartesian_wristframe_6d
          stride: 1
          fix_mecka_left_wrist: true
          pad_proprio_gripper: true
        image_hw:
        - 480
        - 640
      filters:
        _target_: egomimic.rldb.filters.DatasetFilter
        filter_lambdas:
        - 'lambda row: str(row.get(''lab'', '''')).lower() == ''mecka'''
      mode: train
      valid_ratio: 0.05
train_dataloader_params:
  human_bimanual:
    batch_size: 64
    num_workers: 8
valid_dataloader_params:
  valid:
    human_bimanual:
      batch_size: 64
      num_workers: 8
      shuffle: false
  train_viz:
    human_bimanual:
      batch_size: 32
      num_workers: 2
      shuffle: false
