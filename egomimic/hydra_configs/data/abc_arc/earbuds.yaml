# rl2 wireless_earbuds pool, pointed at the SQL task (2026-10-22): every lab=rl2 yam_bimanual episode under task
# wireless_earbuds. That task now holds exactly the former wireless_earbuds_updated pool (earbuds_updated 270 + Elmo's
# 49 of 10-20 and 20 of 10-21: 339 train / 15 val); the 92 old wireless_earbuds takes were moved to wireless_earbuds_retired.
# Validation is the frozen 15 listed below; the counts and SHA-256 pins guard the membership.
defaults:
- /data/abc_arc/stationery_yam_loader@_here_
- _self_
train_datasets:
