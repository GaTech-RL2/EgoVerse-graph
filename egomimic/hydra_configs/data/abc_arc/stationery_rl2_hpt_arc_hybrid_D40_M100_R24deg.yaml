# Same mixed ABC/RL2 policy as the D40/M100 ARC run, with independent
# translation (0.40 m) and rotation (24 degree) waypoint clocks.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  yam_bimanual:
    batch_keys: [observations.state.ee_pose, actions_cartesian, annotations]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR}
      image_hw: [480, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: hybrid_arc_tokenizer_cartesian
        annotation_key: annotations
        translation_horizon_mode: ${oc.select:abc.arc_translation_horizon_mode,joint}
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: hybrid_arc_tokenizer_cartesian
        coord_frame: eef_frame
        rotation_mode: euler
        min_distance_unit: 0.40
        rotation_distance_unit: 0.4188790204786391
        resampled_vector_length: 100
        velocity_mode: per_waypoint
        translation_horizon_mode: ${oc.select:abc.arc_translation_horizon_mode,joint}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - >-
          lambda row: row['embodiment'] == 'yam_bimanual' and
          row['zarr_processed_path'] != '' and row['is_deleted'] == False and
          ((row['lab'] == 'abc' and row['task'] == 'sort the stationery into containers' and
            int(row['episode_hash'].encode().hex()[-6:], 16) % 1000 < 721) or
           (row['lab'] == 'rl2' and row['task'] == 'organize_stationary_updated'))
    mode: train
    valid_ratio: 0.2
    bounds_check: false

valid_datasets:
  yam_bimanual:
    batch_keys: [observations.state.ee_pose, actions_cartesian, annotations]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR}
      image_hw: [480, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: hybrid_arc_tokenizer_cartesian
        annotation_key: annotations
        translation_horizon_mode: ${oc.select:abc.arc_translation_horizon_mode,joint}
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: hybrid_arc_tokenizer_cartesian
        coord_frame: eef_frame
        rotation_mode: euler
        min_distance_unit: 0.40
        rotation_distance_unit: 0.4188790204786391
        resampled_vector_length: 100
        velocity_mode: per_waypoint
        translation_horizon_mode: ${oc.select:abc.arc_translation_horizon_mode,joint}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - >-
          lambda row: row['embodiment'] == 'yam_bimanual' and
          row['lab'] == 'rl2' and row['task'] == 'organize_stationary_updated' and
          row['zarr_processed_path'] != '' and row['is_deleted'] == False
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  yam_bimanual: {batch_size: 32, num_workers: 6}
valid_dataloader_params:
  yam_bimanual: {batch_size: 32, num_workers: 6}
