# @package _global_
defaults:
  - /experiment/pixel_proprio/video_continuous
  - override /model: pixel_proprio/joint
  - _self_
name: pixel_joint_continuous_s42_300k
description: joint_pixel160_state9_action7_continuous64_lr5e6_s42
joint:
  pose_dims: {libero_gripper: 9}
  action_dims: {libero_gripper: 7}
  max_tokens: 12928
  compile_mode: default
data:
  image_only: false
  task: visual_state_action
  couple_state_observations: true
  batch_size: 8
  distributed_world_size: 4
  validation_batch_size: 1
  validation_anchors_per_episode: 2
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  balance_training_work: true
evaluator:
  objective: visual_state_action
trainer:
  strategy: ddp
  devices: 4
  num_nodes: 1
  accumulate_grad_batches: 1
  use_distributed_sampler: false
  max_steps: 300000
runtime:
  cluster_environment: torch_elastic
  slurm_requeue_owner: none
logger:
  wandb:
    group: joint-pixel-state-action
    tags: [pixels-from-scratch, joint-training, coupled-state-noise, independent-action-noise, gripper-only]
