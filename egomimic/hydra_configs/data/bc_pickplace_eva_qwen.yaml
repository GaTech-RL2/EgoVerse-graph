# Retained selection and split from EgoVerse ec5c903c; graph data adapter.
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
train_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pickplace_qwen
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'')
        == ''eva_bimanual'' and (row.get(''zarr_processed_path'') or '''') != ''''
        and ''alignment'' not in ((row.get(''task_description'') or '''').lower())'
    mode: total
valid_datasets:
  eva_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3AnnotationCutoffEpisodeResolver
      folder_path: /storage/project/r-dxu345-0/paphiwetsa3/datasets/pickplace_qwen
      key_map:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_keymap
        keymap_mode: cartesian
        annotation_key: annotations
      transform_list:
        _target_: egomimic.rldb.embodiment.eva.Eva.get_transform_list
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.ScaleAnnotationDatasetFilter
      project_name: dense-language
      filter_lambdas:
      - 'lambda row: row.get(''task'') == ''pick_place'' and row.get(''embodiment'')
        == ''eva_bimanual'' and (row.get(''zarr_processed_path'') or '''') != ''''
        and ''alignment'' in ((row.get(''task_description'') or '''').lower())'
    mode: total
train_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
valid_dataloader_params:
  eva_bimanual:
    batch_size: 32
    num_workers: 6
_recursive_: false
source_fps: 30.0
