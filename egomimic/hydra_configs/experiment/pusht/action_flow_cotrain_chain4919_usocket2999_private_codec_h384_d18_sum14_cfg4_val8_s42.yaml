    filename: "epoch-{epoch}-step-{step}"
    save_last: link
    save_top_k: -1
    every_n_train_steps: 30000
    every_n_epochs: null
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9978
    validate_with_ema: true

eval_checkpoint:
  use_ema: true

planar:
  action_dims:
    pushshapes_sim_u_socket: 4
    pushshapes_sim_chain_gripper: 5
  batch_size: 16
  eval_native_decoder: null

evaluator:
  native_decoder: null
  native_decoders:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.USocketRotVecNativeDecoder
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.PlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 4
  semantic_blocks: [[0, 2], [2, 4]]
  semantic_blocks_by_source:
    pushshapes_sim_u_socket: [[0, 2], [2, 4]]
    pushshapes_sim_chain_gripper: [[0, 2], [2, 4], [4, 5]]
  energy_score_distance: null
  energy_score_validation_view:
    definition: first_deterministic_validation_batch_per_rank
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    per_rank_batch_size: 16
    world_size: 1
  energy_score_provenance:
    source_commit: ${run_provenance.source_commit}
    normalization_sha256: ${run_provenance.normalization_sha256}
    split_manifest_sha256: ${run_provenance.split_manifest_sha256}
    resolved_config_path: ${paths.output_dir}/.hydra/config.yaml
    wandb:
      entity: ${logger.wandb.entity}
      project: ${logger.wandb.project}
      run_id: ${logger.wandb.id}
    distance_contract:
      space: normalized_action_chunk
      formula: mean_equal_weight_semantic_block_rms
      semantic_blocks: [[0, 2], [2, 4]]
      semantic_blocks_by_source: ${evaluator.semantic_blocks_by_source}
    dataset_content:
      manifest_path: ${run_provenance.content_manifest_path}
      manifest_sha256: ${run_provenance.content_manifest_sha256}
      aggregate_sha256: ${run_provenance.dataset_content_aggregate_sha256}
    action_representation: per_embodiment_rotvec_common_action
    prediction_horizon: 16
    sampler: dopri5
    sampler_steps: 50
    model_autocast_precision: bf16
  action_flow_diagnostics:
    enabled: true
    noise_seed_bank_path: ${hydra:runtime.cwd}/egomimic/hydra_configs/evaluator/energy_score_seed_bank_k32_v1.json
    noise_seed_bank_sha256: 88657b829905d4374823db145ded19b99cec4735f76694734473bcee068bb5b6
    raw_noise_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    max_batches_per_rank: 1
    max_samples: 16
    jacobian_samples: 2
    capture_activations: true
    activation_layer_map: {0: 0, 1: 17}
    cknna_k: 10
    native_error: null
    artifact_root: ${paths.output_dir}/validation_predictions/action_flow_diagnostics
    validation_view:
      definition: first_deterministic_validation_batch_per_rank
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      per_rank_batch_size: 16
      world_size: 1
    provenance:
      source_commit: ${run_provenance.source_commit}
      normalization_sha256: ${run_provenance.normalization_sha256}
      split_manifest_sha256: ${run_provenance.split_manifest_sha256}
      dataset_content:
        manifest_sha256: ${run_provenance.content_manifest_sha256}
        aggregate_sha256: ${run_provenance.dataset_content_aggregate_sha256}
      action_representation: per_embodiment_rotvec_common_action
      clean_endpoint: t0
      gaussian_endpoint: t1
      latent_shape: [8, 16]
      flow_samples_per_content: 14
      condition_dropout_probability: 0.1
      sampler: dopri5
      sampler_steps: 50
      flow_time_sampling: lognormal_shifted_mapped_to_t0_clean
      reconstruction_noising: clean_fraction_uniform_0p7_to_1_probability_0p5
      fixed_level_coupling: one_clean_latent_and_one_gaussian_per_condition
      decoder_jacobian_evaluation: declared_bridge_state_at_each_fixed_noise_level
      activation_capture: real_forward_hooks_without_replay_or_replacement

