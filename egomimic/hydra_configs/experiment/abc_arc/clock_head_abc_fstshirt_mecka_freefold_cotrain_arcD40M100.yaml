# @package _global_
# ABC/mecka free-fold cotrain with separate shape and clock flow heads.
#
# The data transform emits per-waypoint ARC tokens as [M shape rows, M clock
# rows]. The model trains those halves with separate denoisers and returns the
# same layout for eval. Set abc.arc_velocity_mode to duration to reuse this
# experiment with duration rows instead of velocity rows.
defaults:
  - /experiment/abc_arc/hpt_qwen_300M_knobs
  - override /model: abc_arc/clock_head_abc_cotrain_300M_qwen_pooled_arc_D40_M100
  - override /data: abc_arc/abc_fstshirt_mecka_freefold_arc_cotrain_D40_M100
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_ice
  - _self_

name: clock_head_abc_fstshirt_mecka_freefold_cotrain_arcD40M100
description: dual shape/clock flow heads, per-waypoint velocity

# The shared W&B logger builds an ID from Hydra interpolations containing
# punctuation that W&B rejects for this experiment. Let W&B generate a valid
# ID unless a launch explicitly supplies logger.wandb.id.

paths:
  dataset_dir: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/cedar/cedar0/cedarp-dxu345-0/egoverse-graph-data/abc_arc}

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

abc:
  arc_token_rows: 200
  arc_distance: 0.40
  arc_waypoints: 100
  arcmatch_points: 32
  arc_chunk_rows: 45
  arc_velocity_mode: per_waypoint
  action_horizon: 100
  rot_lever_m: 0.1

logger:
  wandb:
    # Let W&B generate a valid ID; the shared template's interpolated ID
    # contains punctuation that W&B rejects for this experiment.
    id: null
    project: abc-yam
    tags:
      - abc
      - cotrain
      - arc
      - dual-flow-head
      - clock-head
