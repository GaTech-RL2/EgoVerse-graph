# Frozen E1 FT family: explicit sizes preserve historical state-dict shapes.
# Action width is separate from the 14D proprioceptive input.
defaults:
- /model_contract/e1_wrists@_here_
- _self_
_target_: egomimic.pl_utils.pl_model.ModelWrapper
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 4
  stages:
  - _target_: egomimic.pipeline.stages_hpt.HPTStemStage
    stems:
      observations.images.front_img_1:
        _target_: egomimic.models.stems.e1_image.E1ImageStem
        output_dim: ${model.embed_dim}
        weights: DEFAULT
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: ${model.attention_heads}
            crossattn_dim_head: ${model.attention_head_dim}
            crossattn_modality_dropout: 0.1
            modality_embed_dim: ${model.embed_dim}
    domain_stems:
      yam_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
          input_dim: 14
          output_dim: ${model.embed_dim}
          widths:
          - ${model.embed_dim}
          specs:
            random_horizon_masking: false
            cross_attn:
              crossattn_latent: 16
              crossattn_heads: ${model.attention_heads}
              crossattn_dim_head: ${model.attention_head_dim}
              crossattn_modality_dropout: 0.1
              modality_embed_dim: ${model.embed_dim}
        observations.images.left_wrist_img:
          _target_: egomimic.models.stems.e1_image.E1ImageStem
          output_dim: ${model.embed_dim}
          weights: DEFAULT
          specs:
            random_horizon_masking: false
            cross_attn:
              crossattn_latent: 16
              crossattn_heads: ${model.attention_heads}
              crossattn_dim_head: ${model.attention_head_dim}
              crossattn_modality_dropout: 0.1
              modality_embed_dim: ${model.embed_dim}
        observations.images.right_wrist_img:
          _target_: egomimic.models.stems.e1_image.E1ImageStem
          output_dim: ${model.embed_dim}
          weights: DEFAULT
          specs:
            random_horizon_masking: false
            cross_attn:
              crossattn_latent: 16
              crossattn_heads: ${model.attention_heads}
              crossattn_dim_head: ${model.attention_head_dim}
              crossattn_modality_dropout: 0.1
              modality_embed_dim: ${model.embed_dim}
    selector_aliases:
      '3': human_bimanual
      '7': yam_bimanual
  - _target_: egomimic.pipeline.stages_hpt.HPTTrunkStage
    embed_dim: ${model.embed_dim}
    token_postprocessing: action_token
    use_position_embedding: true
    max_tokens: 512
    trunk:
      _target_: egomimic.models.cores.hpt_transformer.SimpleTransformer
      embed_dim: ${model.embed_dim}
      num_blocks: ${model.trunk_blocks}
      drop_path_rate: 0.1
      weight_init_style: pytorch
      attn_target:
        _target_: egomimic.models.cores.hpt_transformer.MultiheadAttention
        _partial_: true
        embed_dim: ${model.embed_dim}
        num_heads: ${model.attention_heads}
        batch_first: true
    use_domain_embedding: true
    domains:
    - yam_bimanual
    selector_aliases:
      '3': human_bimanual
      '7': yam_bimanual
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: actions_cartesian
  - _target_: egomimic.pipeline.stages_flow.FlowNoisingStage
    action_horizon: 100
    action_dim: ${model.action_token_dim}
    time_dist: beta
    beta_alpha: 1.5
    beta_beta: 1.0
  - _target_: egomimic.pipeline.stages_flow.FlowDenoiserStage
    action_horizon: 100
    action_dim: ${model.action_token_dim}
    condition_input_dim: ${model.embed_dim}
    num_inference_steps: 50
    condition_as_tokens: true
    model:
      _target_: egomimic.models.denoising_nets.CrossTransformer
      nblocks: ${model.flow_blocks}
      cond_dim: ${model.embed_dim}
      hidden_dim: ${model.flow_hidden_dim}
      act_dim: ${model.action_token_dim}
      act_seq: 100
      n_heads: 8
      dropout: 0.1
      mlp_layers: 4
      mlp_ratio: 4
      time_conditioning: additive
  - _target_: egomimic.pipeline.stages_flow.FlowVelocityLossStage
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0001
scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: ${ft.max_steps}
  warmup_steps: ${ft.warmup_steps}
  warmup_start_factor: 0.1
  eta_min: 1.0e-05
scheduler_interval: step
action_token_dim: 14
embed_dim: 640
attention_heads: 8
attention_head_dim: 80
trunk_blocks: 8
flow_blocks: 10
flow_hidden_dim: 384
action_horizon: 100
sampling_steps: 50
sampling_attribute: num_inference_steps
