  # Rollouts cap gripper force at 20 N (Aidan 2026-10-21); live per-arm control on the dashboard.
  gripper_force_limit: 20.0
  zero_gravity_mode: true
  enable_auto_recovery: true
  frequency: 60
  home_duration: 1.5
  home:
    left:
    - -0.008
    - 0.007
    - 0.004
    - -0.07
    - 0.001
    - -0.015
    - 0.999
    right:
    - 0.007
    - 0.006
    - 0.005
    - -0.073
    - -0.013
    - -0.022
    - 0.999
  kinematics:
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    site_name: tcp_site
  cameras:
    front_img_1:
      type: realsense
      enabled: true
      serial_number: '230322272195'
      height: 480
      width: 640
      fps: 30
    left_wrist_img:
      type: realsense
      enabled: true
      serial_number: '218622270679'
      height: 480
      width: 640
      fps: 30
    right_wrist_img:
