# UNITE cotrain: U-Socket (rotvec4 actions) + ChainGripper (six-point actions), one batch per
# embodiment per step (CombinedLoader max_size_cycle). Same 1% seed-42 splits as the
# single-embodiment rows; ChainGripper hashes from planar_v2_chain_gripper.yaml.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  pushshapes_sim_u_socket:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: ${oc.env:PUSHSHAPES_USOCKET_ROOT}
      embodiment_override: pushshapes_sim_u_socket
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_planar_keymap_per_source_proprio
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_usocket_rotvec_action_state_transform_list
    mode: train
    valid_ratio: 0.01
    split_seed: 42
    expected_train_episode_count: 2970
    expected_train_episode_names_sha256: ceb588f2132f9ff9cdb2c2ebe754a4797228acb884eb18351589242866ee84a1
    expected_valid_episode_count: 29
    expected_valid_episode_names_sha256: b34193949ac8d76ea27c6f5c307229798064d16367d7ce2efac00a48f63bfb93
    bounds_check: false
  pushshapes_sim_chain_gripper:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolverWithEmbodimentOverride
      folder_path: ${oc.env:PUSHSHAPES_CHAIN_GRIPPER_ROOT}
      embodiment_override: pushshapes_sim_chain_gripper
      expected_episode_count: 4920
      key_map:
        _target_: egomimic.rldb.embodiment.pushshapes.get_planar_keymap_per_source_proprio
        action_horizon: 16
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_points_action_state_transform_list
    mode: train
    valid_ratio: 0.01
    split_seed: 42
    expected_train_episode_count: 4871
    expected_train_episode_names_sha256: d862d162202ce830840f19a78fbd18895e6e7c444732beab7b7f65c517560a56
    expected_valid_episode_count: 49
    expected_valid_episode_names_sha256: d06278a1e59f458cff7e7623b3f69fae8edc13692e533424e8c9a57f162f4667
    bounds_check: false

