defaults:
  - /data/pusht/action_flow_unite_chain_val01_h16@_here_
  - _self_

# Preserve the standard 3,000-episode manual ChainGripper split but use the
# six-point target required by the routed 4D/6D Action Flow model.
train_datasets:
  pushshapes_sim_chain_gripper:
    resolver:
      folder_path: ${oc.env:PUSHSHAPES_CHAIN_GRIPPER_ROOT}
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_points_action_state_transform_list
valid_datasets:
  pushshapes_sim_chain_gripper:
    resolver:
      folder_path: ${oc.env:PUSHSHAPES_CHAIN_GRIPPER_ROOT}
      transform_list:
        _target_: egomimic.rldb.embodiment.pushshapes.get_chain_gripper_points_action_state_transform_list
