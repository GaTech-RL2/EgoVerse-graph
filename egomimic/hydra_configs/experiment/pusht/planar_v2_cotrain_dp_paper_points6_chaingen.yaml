# @package _global_
# Paper-DP cotrained on U-Socket + ChainGripper with one six-wide head: U-Socket in common
# five-space zero-padded to six, ChainGripper in the six-point space. The DP counterpart of
# the UNITE cotrain rows (same data, splits, horizon, EMA, budget); no embodiment token,
# exactly like planar_v2_cotrain_clean_dp_standard.
defaults:
  - /experiment/pusht/planar_v2_base
  - override /data: pusht/planar_v2_cotrain_usocket_chaingen_points6
  - override /model: bf/bf_planar_v2_dp_paper_points6
  - _self_
name: planar_v2_cotrain_dp_paper_points6_chaingen_h16
description: sweep3_usocket_common5pad6_plus_chain3000gen1919_points6_paper_DP_DDPM100_obs2_EMA
planar:
  action_dims: {pushshapes_sim_u_socket: 6, pushshapes_sim_chain_gripper: 6}
  eval_native_decoder: null
  observation_horizon: 2
  action_target_offset: 1
  batch_size: 32
evaluator:
  native_decoder: null
  native_decoders:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.PaddedPlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 3
      padded_dim: 6
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder
  semantic_blocks: [[0, 2], [2, 4], [4, 6]]
run_provenance:
  split_manifest_path: egomimic/hydra_configs/data/pusht/planar_v2_usocket_dp_3k_split_seed42_v1.json
  split_manifest_sha256: 3683e3461596eef8df2432fa865779b3c77b2a2057dabd0fea125595729cf313
  chain_split_manifest_path: egomimic/hydra_configs/data/pusht/planar_v2_chain_gripper_3000_plus_gen1919_split_seed42_v1.json
  chain_split_manifest_sha256: e320fefd2e1e5d491d74a9910e7eb641fcb9b295a4c7e6e58a3c8234f15332af
  split_seed: ${seed}
  valid_ratio: 0.01
  train_episode_count_per_domain: {pushshapes_sim_u_socket: 2970, pushshapes_sim_chain_gripper: 4870}
  valid_episode_count_per_domain: {pushshapes_sim_u_socket: 29, pushshapes_sim_chain_gripper: 49}
  union_episode_count_per_domain: {pushshapes_sim_u_socket: 2999, pushshapes_sim_chain_gripper: 4919}
  id_overlap_count: 0
  resolved_path_overlap_count: 0
  dataset_observation_alignment: pre_step
  action_contract:
    representations:
      pushshapes_sim_u_socket: x_y_cos_theta_sin_theta_grip_zero_pad6
      pushshapes_sim_chain_gripper: left_xy_center_xy_right_xy_points6
    cotrain:
      sampling: one_batch_per_embodiment_per_step
      loss: mean_over_embodiment_sources
    observation_alignment: pre_step
    observation_horizon: 2
    training_action_target_offset: 1
    prediction_horizon: 16
    rollout_action_chunk_start_index: 0
    replan_every: 8
    execution_slice: "[0,8)"
eval_checkpoint:
  use_ema: true
callbacks:
  ema:
    _target_: egomimic.utils.ema_callback.EMACallback
    decay: 0.9999
    use_warmup: true
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_decay: 0.0
    validate_with_ema: true
deployment:
  observation_adapters: null
  action_decoders:
    pushshapes_sim_u_socket:
      _target_: egomimic.pipeline.pushshapes.PaddedPlanarCommon5NativeDecoder
      action_horizon: 16
      native_action_dim: 3
      padded_dim: 6
    pushshapes_sim_chain_gripper:
      _target_: egomimic.pipeline.pushshapes.ChainGripperPointsNativeDecoder
  chain_gripper_control_mode: points
