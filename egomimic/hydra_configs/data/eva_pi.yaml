# Retained selection and split from EgoVerse ec5c903c; graph data adapter.
defaults:
- cotrain_pi_base
- _self_
train_datasets:
  eva_bimanual:
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row.get(''embodiment'') == ''eva_bimanual'''
    mode: total
  human_bimanual: null
valid_datasets:
  eva_bimanual: ${data.train_datasets.eva_bimanual}
  human_bimanual: null
