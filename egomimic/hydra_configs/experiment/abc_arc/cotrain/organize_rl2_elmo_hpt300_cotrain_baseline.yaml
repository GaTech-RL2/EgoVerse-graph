# @package _global_
# Robot (yam_bimanual) + human (Aria human_bimanual) cotraining on RL2
# organize_stationary, operator Elmo. Time-indexed 100-frame chunks.
defaults:
  - /experiment/abc_arc/robot_bc/abc_visual_hpt300_base
  - override /model: abc_arc/hpt_bimanual_visual
  - override /data: abc_arc/organize_rl2_elmo_cotrain
  - _self_
name: organize_rl2_elmo_hpt300_cotrain_baseline
description: HPT300 ResNet-MLP stems, robot + human cotraining, 100-frame chunks
abc:
  task_predicate: "row['task'] == 'organize_stationary'"
  human_keymap_mode: cartesian
  human_action_mode: cartesian_gripper_padded
  # Shared with the ARC recipe so evaluator distance settings stay comparable.
  arc_chunking_mode: multistream
  arc_distance: 0.42
  arc_rotation_distance: 0.4188790204786391
  arc_velocity_mode: duration
  arc_velocity_layout: clock
  arc_token_dim: 18
  # ARC read window in native frames, shared by robot and human.
  arc_source_buffer_frames: 200
evaluator:
  limit_val_episodes: null
logger:
  wandb:
    tags: [hpt300m, resnet_mlp, rl2, organize_stationary, elmo, cotrain, human_bimanual, baseline, open_loop, video]
