# Human-bimanual MECKA fold_clothes data, approximately 40 hours.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  human_bimanual:
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}
      image_hw: [360, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: null
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian_gripper_padded
        coord_frame: eef_frame
        rotation_mode: euler
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false
valid_datasets:
  human_bimanual:
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}
      image_hw: [360, 640]
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: cartesian
        annotation_key: null
      transform_list:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: cartesian_gripper_padded
        coord_frame: eef_frame
        rotation_mode: euler
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'human_bimanual' and row['lab'] == 'mecka' and row['task'] == 'fold_clothes' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false
train_dataloader_params:
  human_bimanual: {batch_size: 32, num_workers: 6}
valid_dataloader_params:
  human_bimanual: {batch_size: 32, num_workers: 6}
