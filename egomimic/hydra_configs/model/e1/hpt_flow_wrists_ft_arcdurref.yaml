# Shared observation and inference controls are inherited from the TIME contract.
defaults:
- /model/e1/hpt_flow_wrists_ft_arcdurtri@_here_
- _self_
action_token_dim: 24
clip_sample_range: 1.0
inference_contracts:
  arcdurref:
    input: ${model.inference_contracts.time.input}
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${model.action_horizon}
      - ${model.action_token_dim}
      timing:
        kind: per_stream_interval_duration
        temporally_resolved: true
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${e1.time_rows}
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema: ${model.inference_contracts.time.compatibility.normalizer_schema}
      tokenizer:
        variant: arcdurref
        translation_cap: none
        rotation_distance_unit: ${oc.select:model.rotation_distance_unit,6.283185307179586}
        rotation_representation: rotation6d_first_two_matrix_columns
        gripper: linear_on_translation_stream
        timing_convention: interval_rows_last_repeated
        layout: e1_durref
        waypoints: ${e1.M}
        velocity_norm: ${e1.velocity_norm}
        fixed_spacing: ${e1.fixed_spacing}
        progress_smooth_hz: ${e1.progress_smooth_hz}
        normalization:
          kind: fixed_range
          ranges: ${norm_stats.fixed_ranges.actions_cartesian}
          clip_sample_range: ${model.clip_sample_range}
      source_frames: ${model.contract_source_frames.${e1.policy_domain}}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${model.action_horizon}
        - ${model.action_token_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
            token_layout: e1_durref
            min_distance_unit: ${e1.D}
            rotation_distance_unit: ${oc.select:model.rotation_distance_unit,6.283185307179586}
            resampled_vector_length: ${e1.M}
            dt: 0.03333333333333333
            action_horizon: ${e1.time_rows}
            codec: training
            first_stream: 1
            execute_percent: 50
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps: ${model.inference_contracts.time.profiles.default.overrides.inference_steps}
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${e1.time_rows}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
          multistream_fastest_stream: ${model.arc_decoder_controls.multistream_fastest_stream}
          execute_waypoint_percent: ${model.arc_decoder_controls.execute_waypoint_percent}
          arc_speed_percent: ${model.arc_decoder_controls.arc_speed_percent}
          arc_hold_speed_percent: ${model.arc_decoder_controls.arc_hold_speed_percent}
  arcvelref:
    input: ${model.inference_contracts.time.input}
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${model.action_horizon}
      - ${model.action_token_dim}
      timing:
        kind: per_stream_interval_speed
        temporally_resolved: true
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${e1.time_rows}
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema: ${model.inference_contracts.time.compatibility.normalizer_schema}
      tokenizer:
        variant: arcvelref
        translation_cap: none
        rotation_distance_unit: ${oc.select:model.rotation_distance_unit,6.283185307179586}
        rotation_representation: rotation6d_first_two_matrix_columns
        gripper: linear_on_translation_stream
        timing_convention: interval_rows_last_repeated
        rate_floors:
        - 0.001
        - 0.001
        layout: e1_stkref
        waypoints: ${e1.M}
        velocity_norm: ${e1.velocity_norm}
        fixed_spacing: ${e1.fixed_spacing}
        progress_smooth_hz: ${e1.progress_smooth_hz}
        normalization:
          kind: fixed_range
          ranges: ${norm_stats.fixed_ranges.actions_cartesian}
          clip_sample_range: ${model.clip_sample_range}
      source_frames: ${model.contract_source_frames.${e1.policy_domain}}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${model.action_horizon}
        - ${model.action_token_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
            token_layout: e1_stkref
            min_distance_unit: ${e1.D}
            rotation_distance_unit: ${oc.select:model.rotation_distance_unit,6.283185307179586}
            resampled_vector_length: ${e1.M}
            dt: 0.03333333333333333
            action_horizon: ${e1.time_rows}
            codec: training
            first_stream: 1
            execute_percent: 50
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps: ${model.inference_contracts.time.profiles.default.overrides.inference_steps}
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${e1.time_rows}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
          multistream_fastest_stream: ${model.arc_decoder_controls.multistream_fastest_stream}
          execute_waypoint_percent: ${model.arc_decoder_controls.execute_waypoint_percent}
          arc_speed_percent: ${model.arc_decoder_controls.arc_speed_percent}
          arc_hold_speed_percent: ${model.arc_decoder_controls.arc_hold_speed_percent}
