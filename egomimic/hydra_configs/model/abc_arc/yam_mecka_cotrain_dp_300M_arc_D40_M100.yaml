# Large cotrain Diffusion Policy: yam_bimanual + human_bimanual, arc-tokenized.
#
# Graph DP equivalent of hpt_abc_mecka_cotrain_flow_shared_head_300M_arc_D40_M100.
# The HPT 300M uses embed_dim=840, 19 trunk blocks, and a 320-hidden
# CrossTransformer head. In graph DP, "larger" means a wider image encoder
# (num_kp=64 → feature_dimension=128) and a deeper UNet (down_dims enlarged).
#
# Arc tokenization happens loader-side (arc_tokenizer_cartesian in the data
# config transform_list). actions_cartesian arrives as (101, 14) arc tokens.
#
# condition_dim = 128 (SpatialSoftmax, num_kp=64) + 14 (ee_pose) = 142.
# down_dims: [512, 1024, 2048] vs small cotrain's [256, 512, 1024].
# action_horizon reads abc.arc_token_rows rather than a hardcoded row count:
# the token width follows the velocity mode (M + 1 for mean, 2 * M for
# per_waypoint), and the diffusion stages validate the target against it.
_target_: egomimic.pl_utils.pl_model.ModelWrapper

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 3
  stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: observations.images.front_img_1
        ee_pose: observations.state.ee_pose
      encoder:
        _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
        obs_specs:
          ee_pose: {input_dim: 14, input_slice: [0, 14]}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 360
            image_width: 640
            num_kp: 64
            feature_dimension: 128
            pretrained: false
            crop_aug: true
            crop_height: 324
            crop_width: 576
            crop_eval_mode: center
            crop_sample_mode: v02
            crop_scope: frame
            norm_layer: group
            pool_type: spatial_softmax
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
      action_key: actions_cartesian
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: 14
      noise_scheduler: &cotrain_300M_arc_scheduler
        _target_: egomimic.models.ddim_scheduler.DDIMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: ${abc.arc_token_rows}
      action_dim: 14
      condition_input_dim: 142
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: ${abc.arc_token_rows}
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.ConditionalUnet1D
          input_dim: 14
          cond_dim: 142
          ac_latent_seq: 1
          diffusion_step_embed_dim: 512
          down_dims: [512, 1024, 2048]
          kernel_size: 3
        noise_scheduler: *cotrain_300M_arc_scheduler
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage

enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1.0e-4
  weight_decay: 1.0e-4
scheduler: null

# Inference semantics belong to this model; station calibration is separate.
inference_interval_support:
  per_waypoint: true
  duration: true
  mean: false
inference:
  input:
    history_length: 1
    keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    - embodiment
    history_keys:
    - observations.images.front_img_1
    - observations.state.ee_pose
    constants:
      embodiment: 7
  native_output:
    key: pred_action
    representation: normalized_action
    shape:
    - ${abc.arc_token_rows}
    - 14
    timing:
      kind: ${abc.arc_velocity_mode}
      temporally_resolved: ${oc.select:model.inference_interval_support.${abc.arc_velocity_mode},false}
    frame: eef_frame
  output:
    key: actions
    representation: cartesian
    shape:
    - 100
    - 14
    timing:
      kind: control_period
      temporally_resolved: true
      dt: 0.03333333333333333
    frame: eef_frame
  compatibility:
    normalizer_schema:
      action_key: actions_cartesian
      native_shape:
      - ${abc.arc_token_rows}
      - 14
    tokenizer:
      _target_: egomimic.robot.arc_decoder.BimanualIntervalArcDecoder
      velocity_mode: ${abc.arc_velocity_mode}
      min_distance_unit: ${abc.arc_distance}
      resampled_vector_length: ${abc.arc_waypoints}
      dt: 0.03333333333333333
      action_horizon: 100
  profiles:
    default:
      stage_id: sampler
      native_shape:
      - ${abc.arc_token_rows}
      - 14
      adapter:
        _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
        decoder:
          _target_: egomimic.robot.arc_decoder.BimanualIntervalArcDecoder
          velocity_mode: ${abc.arc_velocity_mode}
          min_distance_unit: ${abc.arc_distance}
          resampled_vector_length: ${abc.arc_waypoints}
          dt: 0.03333333333333333
          action_horizon: 100
        rotation_mode: euler
        action_frame: eef_frame
      overrides:
        inference_steps:
          label: Sampling steps
          description: Solver iterations per prediction.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 100
          target:
            kind: stage_attribute
            stage_id: sampler
            attribute_path: policy.num_inference_steps
        replan_every:
          label: Actions before replanning
          description: Execute this prefix before predicting again.
          type: integer
          min: 1
          max: 100
          step: 1
          default: 30
          target:
            kind: policy_attribute
            attribute_path: replan_every

# Model-owned data semantics; independent of the selected dataset paths.
data_requirements:
  preprocessing:
    '7':
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transforms:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: arc_tokenizer_cartesian
        coord_frame: eef_frame
        rotation_mode: euler
        min_distance_unit: 0.4
        resampled_vector_length: 100
        velocity_mode: ${abc.arc_velocity_mode}
      source_fps: 30.0
    '3':
      key_map:
        _target_: egomimic.rldb.embodiment.human.Human.get_keymap
        keymap_mode: arc_tokenizer_cartesian
      transforms:
        _target_: egomimic.rldb.embodiment.human.Human.get_transform_list
        action_mode: arc_tokenizer_cartesian_gripper_padded
        coord_frame: eef_frame
        rotation_mode: euler
        stride: 1
        min_distance_unit: 0.4
        resampled_vector_length: 100
        velocity_mode: ${abc.arc_velocity_mode}
      source_fps: 30.0
