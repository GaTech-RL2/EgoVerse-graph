# @package _global_
# U-Socket hybrid arc tokenization as graph nodes.
#
# Sweep cell: D_translation = 20 px, D_rotation = 12 degrees, M = 32.
# The tokenizer stores the angular cap in its chordal metric:
# sqrt(2) * sin(radians(12) / 4) = 0.07401.
#
# raw_action_horizon is held at 200 for EVERY cell of the sweep, not scaled
# per D. The dense window has to be long enough for the largest translational
# cap (80 px) to be reached inside it; if a cell's window were sized to its
# own D, the D80 runs would hit the end of the chunk before the cap and the
# comparison would confound cap size with window truncation.
defaults:
  - /experiment/pusht/planar_v2_usocket_base
  - override /model: bf/bf_planar_v2_arc_graph_tok
  - _self_

name: planar_v2_usocket_arc_graph_tok_hybrid_D20_M32_R12deg
description: u_socket_arc_graph_hybrid_D20_M32_R12deg_DDIM100_obs1

planar:
  raw_action_horizon: 200
  action_horizon: 16
  arc_distance: 20.0
  arc_waypoints: 32
  arc_rotation_radius: 0.0
  hybrid_rotation_unit: 0.07401
  arc_dt: 0.0333333333333333
  arc_token_rows: 33
  eval_native_decoder:
    _target_: egomimic.pipeline.pushshapes.PlanarArcWaypointZeroNativeDecoder
    resampled_vector_length: ${planar.arc_waypoints}
    native_action_dim: 3
