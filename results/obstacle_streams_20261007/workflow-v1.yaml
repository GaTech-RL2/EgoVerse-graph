  - name: train-dp
    resource: training
    image: nvcr.io/nvidia/pytorch:25.06-py3
    credentials: &id002
      grabber-arc-r2-20260916: *id001
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-wandb:
        WANDB_API_KEY: wandb_api_key
    inputs:
    - task: data-gate
    environment:
      SOURCE_COMMIT: 6fe312726bd4efb4e805a863b85fa8c029c418b4
      RUN_KIND: train
      RUN_ID: obs-streams-1007-v1-dp
      ARM: dp
      WORKFLOW_OUTPUT: '{{output}}'
    command:
    - bash
    args:
    - /tmp/entry.sh
    files:
    - path: /tmp/entry.sh
      contents: "#!/usr/bin/env bash\nset -Eeuo pipefail\nset +x\ncp '{{input:0}}/data-ready.json'\
        \ /tmp/data-ready.json\nexport DEBIAN_FRONTEND=noninteractive HYDRA_FULL_ERROR=1\
        \ PYTHONUNBUFFERED=1\nexport OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1\
        \ PYTHONHASHSEED=42\nexport SDL_VIDEODRIVER=dummy MUJOCO_GL=egl\nunset PIP_CONSTRAINT\
        \ UV_CONSTRAINT UV_BUILD_CONSTRAINT PIP_BUILD_CONSTRAINT\napt-get update -qq\n\
        apt-get install -y --no-install-recommends git curl ca-certificates libgl1\
        \ libglib2.0-0 libegl1 libosmesa6 ffmpeg\ncurl --retry 4 --retry-all-errors\
        \ -LsSf https://astral.sh/uv/0.10.4/install.sh | sh\nexport PATH=\"$HOME/.local/bin:$PATH\"\
        \nmkdir -p /workspace/cotrain/source /workspace/cotrain/evidence\ncat > /tmp/planar-git-askpass.sh\
        \ <<'ASKPASS'\n#!/usr/bin/env bash\ncase \"$1\" in\n  *Username*) printf '%s\\\
        n' x-access-token ;;\n  *Password*) printf '%s\\n' \"$GITHUB_TOKEN\" ;;\n\
        esac\nASKPASS\nchmod 700 /tmp/planar-git-askpass.sh\nexport GIT_ASKPASS=/tmp/planar-git-askpass.sh\
        \ GIT_TERMINAL_PROMPT=0\ncd /workspace/cotrain/source\ngit init -q\ngit remote\
        \ add origin https://github.com/GaTech-RL2/EgoVerse-graph.git\ngit fetch --depth\
        \ 1 origin \"$SOURCE_COMMIT\"\ngit checkout --detach FETCH_HEAD\ntest \"$(git\
        \ rev-parse HEAD)\" = \"$SOURCE_COMMIT\"\nexport UV_PROJECT_ENVIRONMENT=/workspace/cotrain/emimic\n\
        uv sync --frozen --python 3.11 --project /workspace/cotrain/source\nsource\
        \ /workspace/cotrain/emimic/bin/activate\nexport PYTHONPATH=/workspace/cotrain/source\n\
        ulimit -n 8192\nif [[ \"$RUN_KIND\" == train ]]; then\n    python scripts/benchmarks/train_planar_streams.py\
        \ --arm \"$ARM\" --run-id \"$RUN_ID\" --output \"$WORKFLOW_OUTPUT\"\nelif\
        \ [[ \"$RUN_KIND\" == evaluation ]]; then\n    # Retain the exact dependencies\
        \ of the previous frozen simulator benchmark.\n    uv pip install --python\
        \ \"$VIRTUAL_ENV/bin/python\" numpy==2.4.4 gymnasium==1.1.1 pygame==2.6.1\
        \ pymunk==7.1.0 shapely==2.1.1 opencv-python==4.13.0.92\n    python scripts/benchmarks/prepare_planar_evaluation.py\
        \ --training /tmp/training-complete.json --domain \"$EVAL_DOMAIN\" --shard\
        \ \"$EVAL_SHARD\"\n    python scripts/benchmarks/evaluate_planar_streams.py\n\
        else\n    printf '%s\\n' 'Unknown run kind' >&2\n    exit 2\nfi\n"
