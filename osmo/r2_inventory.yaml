# Count what the scripted-collection jobs actually produced in R2.
# Log fetches truncate at ~5k lines, so episode counts cannot be recovered
# from the collection logs; this asks the bucket directly.
workflow:
  name: "{{job_name}}"
  tasks:
  - name: inv
    image: nvcr.io/nvidia/pytorch:25.06-py3
    credentials:
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-aws:
        AWS_ACCESS_KEY_ID: aws_access_key_id
        AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        AWS_DEFAULT_REGION: aws_region
    environment:
      BRANCH: "{{branch}}"
      PREFIX: "{{prefix}}"
      PYTHONUNBUFFERED: "1"
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    files:
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        set -euxo pipefail
        apt-get update
        apt-get install -y --no-install-recommends git curl unzip ca-certificates
        curl -sSfL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
          | tar xz -C /usr/local/bin s5cmd
        curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/a.zip
        unzip -q /tmp/a.zip -d /tmp && /tmp/aws/install --update
        mkdir -p /workspace && cd /workspace
        git clone --depth 1 --branch "$BRANCH" --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse-graph.git" src
        cd src
        bash ./egomimic/utils/aws/setup_secret.sh
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        unset AWS_SESSION_TOKEN
        S5="s5cmd --endpoint-url $R2_ENDPOINT_URL"

        echo "===== top level of $PREFIX ====="
        $S5 ls "$PREFIX" || true

        echo "===== per-job counts ====="
        # Report the RAW object count alongside the distinct-episode count. If a
        # listing is being truncated the two move together and the episode
        # counts come out suspiciously uniform, so print both rather than
        # trusting either alone.
        for J in $($S5 ls "$PREFIX" | awk '{print $NF}' | grep '/$'); do
          echo "--- $J"
          $S5 ls "${PREFIX}${J}*" 2>/dev/null | awk '{print $NF}' > /tmp/objs.txt || true
          echo "    raw objects listed: $(wc -l < /tmp/objs.txt)"
          grep -oE '[a-z]+/[a-z_]+/T_shard[0-9]+/episode_[A-Za-z0-9_]+\.zarr' /tmp/objs.txt \
            | sed -E 's|([a-z]+)/([a-z_]+)/T_shard[0-9]+/(episode_[A-Za-z0-9_]+)\.zarr|\1 \2 \3|' \
            | sort -u | awk '{print $1, $2}' | sort | uniq -c || true
          echo "    distinct shards: $(grep -oE 'T_shard[0-9]+' /tmp/objs.txt | sort -u | wc -l)"
          # Cross-check with an independent per-embodiment listing that cannot
          # share one global result cap.
          for E in $(grep -oE '/[a-z]+/[a-z_]+/T_shard' /tmp/objs.txt | awk -F/ '{print $3}' | sort -u); do
            N=$($S5 ls "${PREFIX}${J}ideal/${E}/*" 2>/dev/null | awk '{print $NF}' \
                | grep -oE 'episode_[A-Za-z0-9_]+\.zarr' | sort -u | wc -l)
            echo "    recount ${E}: ${N}"
          done
        done
        echo "===== done ====="
  resources:
    default:
      cpu: {{cpu}}
      gpu: {{num_gpu}}
      memory: {{memory}}
      storage: {{storage}}
  timeout:
    queue_timeout: 1d
