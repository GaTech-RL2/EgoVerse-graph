# Add the human source to the shared FT graph.
defaults:
- /model/e1/hpt_flow_wrists_ft@_here_
- _self_
data_contracts:
  human:
    preprocessing:
      '3':
        key_map:
          horizon: 100
          drop_wrist_images: true
data_requirements:
  preprocessing:
    '3': ${model.data_contracts.human.preprocessing.3}
    '7': ${model.data_contracts.yam.preprocessing.7}
graph:
  stem:
    domain_stems:
      human_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
          input_dim: 14
          output_dim: ${model.embed_dim}
          widths:
          - ${model.embed_dim}
          specs:
            random_horizon_masking: false
            cross_attn:
              crossattn_latent: 16
              crossattn_heads: ${model.attention_heads}
              crossattn_dim_head: ${model.attention_head_dim}
              crossattn_modality_dropout: 0.1
              modality_embed_dim: ${model.embed_dim}
  trunk:
    domains:
    - yam_bimanual
    - human_bimanual
  sampler: {}
