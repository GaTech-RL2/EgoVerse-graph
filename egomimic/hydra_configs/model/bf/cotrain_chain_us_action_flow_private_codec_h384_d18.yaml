# Two private embodiment codecs around one shared, observation-conditioned flow field.
_target_: egomimic.pl_utils.pl_model_action_flow.ActionFlowModelWrapper

action_horizon: 16
num_latent_tokens: 8
latent_dim: 16
condition_dim: 128
hidden_dim: 384
flow_samples_per_content: 14
flow_mini_batch: 14
condition_dropout_probability: 0.1
flow_loss_aggregation: sum_samples
cfg_scale: 4.0
cfg_interval: [0.0, 1.0]
num_inference_steps: 50
reconstruction_weight: 1.0
flow_weight: 1.0
action_flow_method: latent_fm_stopgrad_unite_private_codec
optimizer_named_parameters: true

pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
    - _target_: egomimic.pipeline.stages_sampler.KeyedFeatureProjection
      selector_key: embodiment
      selector_aliases:
        19: pushshapes_sim_u_socket
        20: pushshapes_sim_chain_gripper
      input_key: state_agent_model
      output_key: proprio_condition
      output_dim: 64
      projections:
        pushshapes_sim_u_socket:
          input_dim: 4
          hidden_dim: 64
          semantic: x_y_cos_theta_sin_theta
        pushshapes_sim_chain_gripper:
          input_dim: 4
          hidden_dim: 64
          semantic: x_y_cos_theta_sin_theta
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 1
      inputs:
        front_img_1: front_img_1
        proprio_condition: proprio_condition
      encoder:
        _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
        obs_specs:
          proprio_condition: {input_dim: 64, input_slice: [0, 64]}
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 96
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 84
            crop_width: 84
            crop_eval_mode: center
            crop_sample_mode: v02
            crop_scope: frame
            norm_layer: group
            pool_type: spatial_softmax
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    - _target_: egomimic.pipeline.stages_sampler.GaussianLatentNoise
      num_tokens: ${model.num_latent_tokens}
      latent_dim: ${model.latent_dim}
    - _target_: egomimic.pipeline.stages_action_flow.ContentEncoderStage
      selector_key: embodiment
      encoder:
        _target_: egomimic.models.action_flow_unite.EmbodimentModuleRouter
        selector_aliases:
          19: pushshapes_sim_u_socket
          20: pushshapes_sim_chain_gripper
        modules:
          pushshapes_sim_u_socket:
            _target_: egomimic.models.action_flow_unite.UniteActionFlowContentEncoder
            action_dim: 4
            action_horizon: ${model.action_horizon}
            latent_dim: ${model.latent_dim}
            num_latent_tokens: ${model.num_latent_tokens}
            condition_dim: ${model.condition_dim}
            tokenization_time_max: 0.01
            backbone:
              _target_: egomimic.models.unite_dit.UniteDiTBackbone
              input_dim: ${model.latent_dim}
              output_dim: ${model.latent_dim}
              horizon: ${model.num_latent_tokens}
              condition_dim: ${model.condition_dim}
              max_condition_tokens: 1
              max_content_tokens: ${model.action_horizon}
              hidden_dim: ${model.hidden_dim}
              depth: 12
              num_heads: 12
              mlp_ratio: 4.0
              qk_norm: true
              use_rope: true
              use_rmsnorm: true
              use_swiglu: true
              block_norm: true
              time_fourier_dim: 256
              context_adaln_summary: false
              in_context_start: 4
              in_context_len: 32
              trainable_position_embeddings: false
              trainable_register_position_embeddings: true
              trainable_content_position_embeddings: false
              trainable_condition_position_embeddings: false
              trainable_in_context_position_embeddings: true
              gradient_checkpointing: true
          pushshapes_sim_chain_gripper:
            _target_: egomimic.models.action_flow_unite.UniteActionFlowContentEncoder
            action_dim: 5
            action_horizon: ${model.action_horizon}
            latent_dim: ${model.latent_dim}
            num_latent_tokens: ${model.num_latent_tokens}
            condition_dim: ${model.condition_dim}
            tokenization_time_max: 0.01
            backbone:
              _target_: egomimic.models.unite_dit.UniteDiTBackbone
              input_dim: ${model.latent_dim}
              output_dim: ${model.latent_dim}
              horizon: ${model.num_latent_tokens}
              condition_dim: ${model.condition_dim}
              max_condition_tokens: 1
              max_content_tokens: ${model.action_horizon}
              hidden_dim: ${model.hidden_dim}
              depth: 12
              num_heads: 12
              mlp_ratio: 4.0
              qk_norm: true
              use_rope: true
              use_rmsnorm: true
              use_swiglu: true
              block_norm: true
              time_fourier_dim: 256
              context_adaln_summary: false
              in_context_start: 4
              in_context_len: 32
              trainable_position_embeddings: false
              trainable_register_position_embeddings: true
              trainable_content_position_embeddings: false
              trainable_condition_position_embeddings: false
              trainable_in_context_position_embeddings: true
              gradient_checkpointing: true
    - _target_: egomimic.pipeline.stages_action_flow.LatentBridgeStage
      samples_per_content: ${model.flow_samples_per_content}
      condition_dropout_probability: ${model.condition_dropout_probability}
      time_sampling: lognormal_shifted
      lognorm_mu: 0.0
      lognorm_sigma: 1.0
      timestep_shift_alpha: 0.5
      independent_noise_per_sample: true
      independent_condition_dropout_per_sample: true
    - _target_: egomimic.pipeline.stages_action_flow.ConditionalVelocityStage
      flow_clean_gradient_mode: all_stopgrad
      num_inference_steps: ${model.num_inference_steps}
      inference_method: dopri5
      timestep_shift_alpha: 0.5
      dopri5_atol: 1.0e-6
      dopri5_rtol: 1.0e-3
      cfg_scale: ${model.cfg_scale}
      cfg_interval: ${model.cfg_interval}
      field:
        _target_: egomimic.models.action_flow_unite.UniteActionFlowVelocityField
        input_dim: ${model.latent_dim}
        output_dim: ${model.latent_dim}
        horizon: ${model.num_latent_tokens}
        condition_dim: ${model.condition_dim}
        condition_dropout_probability: ${model.condition_dropout_probability}
        backbone:
          _target_: egomimic.models.unite_dit.UniteDiTBackbone
          input_dim: ${model.latent_dim}
          output_dim: ${model.latent_dim}
          horizon: ${model.num_latent_tokens}
          condition_dim: ${model.condition_dim}
          max_condition_tokens: 1
          max_content_tokens: ${model.action_horizon}
          hidden_dim: ${model.hidden_dim}
          depth: 18
          num_heads: 12
          mlp_ratio: 4.0
          qk_norm: true
          use_rope: true
          use_rmsnorm: true
          use_swiglu: true
          block_norm: true
          time_fourier_dim: 256
          context_adaln_summary: false
          in_context_start: 4
          in_context_len: 32
          trainable_position_embeddings: false
          trainable_register_position_embeddings: true
          trainable_content_position_embeddings: false
          trainable_condition_position_embeddings: false
          trainable_in_context_position_embeddings: true
          gradient_checkpointing: true
    - _target_: egomimic.pipeline.stages_action_flow.ContentDecoderStage
      selector_key: embodiment
      reconstruction_noising_start: 0.7
      reconstruction_noising_probability: 0.5
      decoder:
        _target_: egomimic.models.action_flow_unite.EmbodimentModuleRouter
        selector_aliases:
          19: pushshapes_sim_u_socket
          20: pushshapes_sim_chain_gripper
        modules:
          pushshapes_sim_u_socket:
            _target_: egomimic.models.unite_action_decoder.UniteActionDecoder
            latent_dim: ${model.latent_dim}
            action_dim: 4
            num_latent_tokens: ${model.num_latent_tokens}
            action_horizon: ${model.action_horizon}
            hidden_dim: ${model.hidden_dim}
            depth: 12
            num_heads: 12
            mlp_ratio: 4.0
            dropout: 0.0
            gradient_checkpointing: true
          pushshapes_sim_chain_gripper:
            _target_: egomimic.models.unite_action_decoder.UniteActionDecoder
            latent_dim: ${model.latent_dim}
            action_dim: 5
            num_latent_tokens: ${model.num_latent_tokens}
            action_horizon: ${model.action_horizon}
            hidden_dim: ${model.hidden_dim}
            depth: 12
            num_heads: 12
            mlp_ratio: 4.0
            dropout: 0.0
            gradient_checkpointing: true
    - _target_: egomimic.pipeline.stages_action_flow.ActionFlowObjectiveStage
      residual_key: action_flow/fm_velocity_residual
      flow_weight: ${model.flow_weight}
      reconstruction_weight: ${model.reconstruction_weight}
      action_velocity_weight: 1.0
      flow_aggregation: ${model.flow_loss_aggregation}
      flow_samples_per_content: ${model.flow_samples_per_content}

enable_grad_norm: false
gradient_telemetry_cadence: 100

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4

scheduler:
  _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
  _partial_: true
  max_steps: 150000
  warmup_steps: 8000
  warmup_start_factor: 0.1
  eta_min: 3.0e-6
