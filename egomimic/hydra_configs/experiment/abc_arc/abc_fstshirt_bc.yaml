# @package _global_
# ABC-ONLY (no cotraining) time-indexed 300M HPT flow matching:
# fold_and_stack_the_t_shirts, yam_bimanual.
#
# Robot data is held FIXED at the cotrain run's yam split -- 20 ABC episodes,
# 48,286 frames -- so the only thing removed relative to
# abc_fstshirt_mecka_freefold_cotrain_baseline is the 250 mecka human episodes.
# Any delta between the two is attributable to cotraining, not to data volume.
#
# Its arc twin is abc_fstshirt_arc_bc, using the same HPT graph with ARC tokens.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fstshirt_bc
defaults:
  - override /model: abc/yam_bimanual_hpt
  - override /data: abc_arc/abc_fstshirt_bc
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_pace
  - _self_

name: abc_fstshirt_bc
description: hpt_flow_300M_head512

paths:
  dataset_dir: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

logger:
  wandb:
    project: abc-yam
    tags:
      - abc
      - bc
      - hpt
      - flow
      - 300m

# The SAME evaluator as the arc twin, so both arms land on one set of
# arcmatch charts. It detects the run type from the prediction's shape: an arc
# token gets detokenized, this baseline's pose chunk gets de-interpolated to the
# raw window instead. D and M below must match the arc run's or the two arms are
# not comparable.
evaluator:
  arc_metrics: true
  include_reconstruction_loss: false
  arcmatch_distance: ${abc.arc_distance}
  arcmatch_points: ${abc.arcmatch_points}
  arc_chunk_rows: ${abc.arc_chunk_rows}
  velocity_mode: ${abc.arc_velocity_mode}
  resampled_vector_length: ${abc.arc_waypoints}
  action_horizon: ${abc.action_horizon}

abc:
  action_dim: 14
  # Arc scoring settings, held equal to abc_fstshirt_arc_bc so the baseline and
  # arc arms are measured in the same space.
  arc_distance: 0.40
  arc_waypoints: 100
  arcmatch_points: 32
  arc_velocity_mode: per_waypoint
  # Raw yam window. The transform list interpolates up to chunk_length (100),
  # and arc length on an interpolated path reads short, so arc scoring runs on
  # the raw row count.
  arc_chunk_rows: 45
  # Yam's cartesian transform list interpolates every action chunk to
  # `chunk_length` (default 100), and the data config does not override it, so
  # the loader hands the graph a (100, 14) target. The HPT flow stages validate
  # that horizon.
  action_horizon: 100

hpt:
  # 300M-class HPT trunk/stems; the flow head is widened independently so it
  # carries a larger share of capacity than the original 128-wide head.
  embed_dim: 840
  num_blocks: 19
  num_heads: 10
  head_hidden_dim: 512
  head_num_blocks: 6
  head_num_heads: 8
  head_mlp_layers: 4
  head_mlp_ratio: 4
  action_horizon: ${abc.action_horizon}
  action_dim: ${abc.action_dim}
  stem_specs:
    random_horizon_masking: false
    cross_attn:
      crossattn_latent: 16
      crossattn_heads: 10
      crossattn_dim_head: 84
      crossattn_modality_dropout: 0.1
      modality_embed_dim: ${hpt.embed_dim}
