# Closed-loop rollout scoring for the articulated co-train sweep.
#
# NON-PROTOCOL, exactly as osmo/usocket_codec_rollout.yaml is: the canonical
# bf_eval_par.sbatch lives on Skynet and there is no registered inference
# contract for the ARC family. Follows the protocol's SUBSTANCE (p99 frame
# budget, PEAK coverage, SR@0.80 + SR@0.95, level-0 rollouts on seeds 0..n-1,
# sim_v2) so the numbers are internally comparable and nothing else.
#
# The point of this job is the HELD-OUT pair. umi and scoop appear in no
# training dataset, so their rows measure transfer to a tool the policy has
# never seen; the seven trained embodiments are the in-domain reference.
#
# Scores every (experiment x embodiment) pair. Each embodiment gets its own
# staged corpus, its own p99 budget computed from that corpus, and its own
# native_action_dim -- 3 for the tools with no grip channel, 4 for the rest.

workflow:
  name: "{{job_name}}"

  tasks:
  - name: rollout
    image: nvcr.io/nvidia/pytorch:25.06-py3

    credentials:
      egoverse-github:
        GITHUB_TOKEN: github_token
      egoverse-aws:
        AWS_ACCESS_KEY_ID: aws_access_key_id
        AWS_SECRET_ACCESS_KEY: aws_secret_access_key
        AWS_DEFAULT_REGION: aws_region

    environment:
      BRANCH: "{{branch}}"
      SIM_COMMIT: "{{sim_commit}}"
      JOB_NAME: "{{job_name}}"
      EXPERIMENTS: "{{experiments}}"
      EMBODIMENTS: "{{embodiments}}"
      CKPT_JOB: "{{ckpt_job}}"
      N_EPISODES: "{{n_episodes}}"
      REPLAN_EVERY: "{{replan_every}}"
      CHUNK_START: "{{chunk_start}}"
      EXP_GROUP: pusht
      CORPUS: s3://rldb/staged/pushshapes_articulated/articulated-20260909
      # Tools with no grip channel; PadPlanarAction pads them with a constant 0
      # and the decoder must slice back to 3, not 4.
      THREE_DOF: "u_socket triangle scoop"
      HELD_OUT: "umi scoop"
      # mode=eval still constructs the seven-domain training datamodule to bind
      # norm stats, so those corpora must be on disk even when scoring only one
      # embodiment. Staged as a union with EMBODIMENTS.
      TRAIN_EMB: "u_socket gripper chain_gripper suction triangle flipper spring"
      # 24 shards x 125 = 3000 per cell. Lower it to iterate on the eval path
      # without paying a 30-minute staging cycle for every attempt.
      SHARDS_PER_CELL: "{{shards_per_cell}}"
      SAMPLER_STEPS: "100"
      TSIM_VERSION: sim_v2
      SDL_VIDEODRIVER: dummy
      PYTHONUNBUFFERED: "1"
      HYDRA_FULL_ERROR: "1"

    command: ["bash"]
    args: ["/tmp/entry.sh"]

    files:
    - path: /tmp/entry.sh
      contents: |
        #!/usr/bin/env bash
        exec > >(tee /tmp/entry_script.log) 2>&1
        set -euxo pipefail

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          git curl unzip ca-certificates build-essential \
          libgl1 libglib2.0-0 libegl1 libosmesa6 ffmpeg

        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        curl -sSfL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
          | tar xz -C /usr/local/bin s5cmd
        curl -sSfL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws

        # Both repos: EgoVerse-graph owns the ARC modules and the policy,
        # EgoVerse owns Tsimulation.
        mkdir -p /workspace && cd /workspace
        git clone --depth 1 --branch "$BRANCH" --single-branch \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse-graph.git" EgoVerse-graph
        git clone --filter=blob:none \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/GaTech-RL2/EgoVerse.git" EgoVerse
        cd /workspace/EgoVerse && git checkout "$SIM_COMMIT" && cd /workspace/EgoVerse-graph
        git rev-parse HEAD

        uv sync --frozen
        source .venv/bin/activate
        # Tsimulation imports these at module scope and they are in neither
        # lock. Without them Tsimulation/__init__.py cannot import
        # sim_v2.pushshapes, and because its aliasing loop swallows
        # ModuleNotFoundError the failure presents fifteen minutes later as
        # "No module named 'Tsimulation.pushshapes'" -- which is true, and
        # says nothing about the actual cause.
        uv pip install "pymunk==7.3.0" gymnasium pygame shapely
        # Expose ONLY Tsimulation from the sim repo. /workspace/EgoVerse also
        # contains an egomimic/ package, and putting the whole repo on the path
        # shadowed EgoVerse-graph's -- the smoke died on
        # "No module named egomimic.eval.checkpoint_loading", a module that is
        # present and committed here but absent from the sim repo's older copy.
        mkdir -p /workspace/sim_import
        ln -sfn /workspace/EgoVerse/Tsimulation /workspace/sim_import/Tsimulation
        export PYTHONPATH="/workspace/sim_import:/workspace/EgoVerse-graph"

        # Assert which repo each package resolves to, so the shadowing cannot
        # come back silently.
        # Import what the harness actually imports, not just the top-level
        # packages. The previous check did `import Tsimulation` and passed while
        # Tsimulation.pushshapes was silently unavailable.
        python - <<'PYCHK'
        import sys
        import egomimic
        import egomimic.eval.checkpoint_loading
        import egomimic.eval.sim_rollout_planar_eval
        from Tsimulation.pushshapes import env, get_env
        print("egomimic    <-", egomimic.__file__)
        print("Tsimulation <-", env.__file__)
        assert "EgoVerse-graph" in egomimic.__file__, "egomimic resolved to the sim repo"
        assert getattr(env, "SIM_VERSION", None) == 2, f"expected sim_v2, got {getattr(env,'SIM_VERSION',None)}"
        get_env("v2")
        print("imports OK: egomimic from EgoVerse-graph, Tsimulation sim_v2, get_env callable")
        PYCHK

        bash ./egomimic/utils/aws/setup_secret.sh
        test -s "$HOME/.egoverse_env"
        set -a; source "$HOME/.egoverse_env"; set +a
        export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        export AWS_DEFAULT_REGION=auto AWS_REGION=auto
        unset AWS_SESSION_TOKEN
        S5="s5cmd --endpoint-url $R2_ENDPOINT_URL"
        ulimit -n 65536 || true

        # Flush logs and budgets on ANY exit. Every failure so far aborted
        # before the upload at the bottom of the script, so the artifacts died
        # with the container and the only way to see anything was to stream the
        # osmo log, which truncates.
        DEST="s3://rldb/staged/articulated_rollout/$JOB_NAME"
        flush () {
          $S5 cp "/tmp/*.log" "$DEST/logs/" >/dev/null 2>&1 || true
          $S5 cp "/workspace/budgets/*.json" "$DEST/budgets/" >/dev/null 2>&1 || true
        }
        trap flush EXIT

        # ---------------------------------------------- corpora + budgets
        ROOT=/workspace/articulated
        mkdir -p "$ROOT" /workspace/budgets
        # ONE layout: cells/ideal/<emb>, which is what the data configs already
        # interpolate to. Staging the evaluator's corpus somewhere else meant
        # the datamodule found nothing and the job died after staging.
        STAGE=$(printf '%s\n' $EMBODIMENTS $TRAIN_EMB | sort -u | tr '\n' ' ')
        echo "staging (union of requested and training embodiments): $STAGE"
        for EMB in $STAGE; do
          D="$ROOT/work/$EMB"; FLAT="$ROOT/cells/ideal/$EMB"
          mkdir -p "$D/tars" "$D/raw" "$FLAT"
          for I in $(seq 0 $((SHARDS_PER_CELL - 1))); do
            SHN=$(printf "shard%03d" "$I")
            s5cmd --endpoint-url "$R2_ENDPOINT_URL" cp \
              "$CORPUS/$EMB/ideal/$EMB/${SHN}.tar" "$D/tars/" \
              >>/tmp/stage.log 2>&1 || { echo "FATAL: staging $EMB $SHN"; tail -30 /tmp/stage.log; exit 1; }
          done
          for T in "$D/tars"/*.tar; do
            SH=$(basename "$T" .tar); mkdir -p "$D/raw/$SH"; tar -xf "$T" -C "$D/raw/$SH"
          done
          # The per-shard episode index restarts at zero, so the shard name has
          # to be in the link name or 24 shards collapse onto 125 episodes.
          find "$D/raw" -mindepth 1 -type d -name 'episode_*.zarr' -print0 \
            | while IFS= read -r -d '' EP; do
                SH=$(basename "$(dirname "$EP")")
                # Must start with episode_: episode_budget.py globs
                # episode_*.zarr, and the shard prefix has to go AFTER it
                # because the per-shard episode index restarts at zero.
                B=$(basename "$EP")
                ln -sfn "$EP" "$FLAT/episode_${SH}_${B#episode_}"
              done
          N=$(find "$FLAT" -maxdepth 1 -mindepth 1 -name 'episode_*.zarr' | wc -l)
          echo "staged $EMB: $N episodes"
          WANT=$((SHARDS_PER_CELL * 125))
          [ "$N" -eq "$WANT" ] || { echo "FATAL: $EMB has $N episodes, want $WANT"; exit 1; }
          rm -rf "$D/tars"
          python scripts/eval/usocket_arc_rollout/episode_budget.py \
            "$FLAT" --out "/workspace/budgets/${EMB}.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print('  budget', sys.argv[2], d['by_level']['0']['budget'], 'frames from', d['episode_count'], 'episodes')" \
            "/workspace/budgets/${EMB}.json" "$EMB"
        done

        # A partial stage trips the episode-count guards in the data configs,
        # which are correct: 3000 per cell is what a real run must see. Disable
        # them ONLY for a partial stage, and say loudly that the resulting
        # numbers are not publishable.
        GUARD_OV=""
        if [ "$SHARDS_PER_CELL" -lt 24 ]; then
          for E in $TRAIN_EMB; do
            for SPLIT in train valid; do
              GUARD_OV="$GUARD_OV data.${SPLIT}_datasets.pushshapes_sim_${E}.resolver.expected_episode_count=null"
              GUARD_OV="$GUARD_OV data.${SPLIT}_datasets.pushshapes_sim_${E}.expected_train_episode_count=null"
              GUARD_OV="$GUARD_OV data.${SPLIT}_datasets.pushshapes_sim_${E}.expected_valid_episode_count=null"
            done
          done
          echo "############################################################"
          echo "# PARTIAL STAGE: $SHARDS_PER_CELL/24 shards per cell."
          echo "# Episode-count guards are DISABLED and the corpus is a"
          echo "# subset. This run is a PLUMBING CHECK -- its coverage"
          echo "# numbers are NOT comparable to anything."
          echo "############################################################"
        fi

        # ---------------------------------------------- checkpoints
        CK=/workspace/ckpts; mkdir -p "$CK"
        $S5 --numworkers 32 cp "s3://rldb/staged/articulated_cotrain/$CKPT_JOB/*" "$CK/" \
          >>/tmp/ckpt_pull.log 2>&1 || true
        find "$CK" -name '*.ckpt' > /tmp/ckpts.txt || true
        echo "checkpoints pulled: $(wc -l < /tmp/ckpts.txt)"

        declare -A CKPT_OF NORM_OF
        for EXP in $EXPERIMENTS; do
          RN=$(grep -m1 '^name:' "egomimic/hydra_configs/experiment/$EXP_GROUP/${EXP}.yaml" | awk '{print $2}')
          C=$(find "$CK/$RN" -name 'last.ckpt' 2>/dev/null | head -1 || true)
          NRM=$(find "$CK/$RN" -name 'norm_stats.json' 2>/dev/null | head -1 || true)
          if [ -z "$C" ] || [ -z "$NRM" ]; then
            echo "FATAL: missing artifacts for $EXP (run dir $RN): ckpt='$C' norm='$NRM'"; exit 1
          fi
          CKPT_OF[$EXP]="$C"; NORM_OF[$EXP]="$NRM"

          # A held-out embodiment has no norm stats, and normalize() returns
          # the tensor UNCHANGED when it finds none -- raw pixels and raw pose
          # into a network trained on normalized inputs, still producing a
          # plausible number. Give it the pooled statistics of the training set.
          NEED_POOL=no
          for EMB in $EMBODIMENTS; do
            case " $HELD_OUT " in *" $EMB "*) NEED_POOL=yes;; esac
          done
          if [ "$NEED_POOL" = yes ]; then
            # One line: a newline inside python -c breaks out of the YAML
            # block scalar, which is the fourth time that has bitten this file.
            IDS="from egomimic.rldb.embodiment.embodiment import get_embodiment_id as g; import sys; print(' '.join(str(g('pushshapes_sim_'+e)) for e in sys.argv[1].split()))"
            SRC_IDS=$(python -c "$IDS" "$TRAIN_EMB")
            TGT_IDS=$(python -c "$IDS" "$HELD_OUT")
            echo "pooling training norm stats ($SRC_IDS) onto held-out ids ($TGT_IDS)"
            python tools/pool_norm_stats.py "$NRM" \
              --out "$(dirname "$NRM")/norm_stats_pooled.json" \
              --sources $SRC_IDS --targets $TGT_IDS \
              || { echo "FATAL: pooling norm stats failed"; exit 1; }
            NORM_OF[$EXP]="$(dirname "$NRM")/norm_stats_pooled.json"
          fi
          STEP=$(python -c "import sys,torch; print(torch.load(sys.argv[1], map_location='cpu', weights_only=False).get('global_step','?'))" "$C" 2>/dev/null || echo "?")
          echo "  $EXP -> $C  (global_step $STEP)"
        done

        # ---------------------------------------------- score every pair
        run_one () {
          local EXP=$1 EMB=$2 NEPS=$3 TAG=$4
          local ND=4
          case " $THREE_DOF " in *" $EMB "*) ND=3;; esac
          local HELD=in-domain
          case " $HELD_OUT " in *" $EMB "*) HELD=HELD-OUT;; esac
          echo "=== $TAG  $EXP  x  $EMB  ($HELD, native_action_dim=$ND)"
          # ~evaluator.native_decoders and ~semantic_blocks: those belong to the
          # training evaluator. SimRolloutPlanarEval scores ONE embodiment and
          # takes a single decoder, so passing the seven-domain map is a
          # TypeError rather than a no-op.
          python egomimic/trainHydra.py \
            +experiment="$EXP_GROUP/$EXP" mode=eval \
            ckpt_path="${CKPT_OF[$EXP]}" \
            planar.articulated_root=/workspace/articulated \
            $GUARD_OV \
            planar.eval_native_decoder.native_action_dim=$ND \
            norm_stats.precomputed_norm_path="${NORM_OF[$EXP]}" \
            evaluator=sim_rollout_planar_v2 \
            ~evaluator.native_decoders \
            'evaluator.native_decoder=${planar.eval_native_decoder}' \
            evaluator.dataset_dir="/workspace/articulated/cells/ideal/$EMB" \
            evaluator.budget_path="/workspace/budgets/${EMB}.json" \
            evaluator.embodiment_name="pushshapes_sim_${EMB}" \
            evaluator.n_episodes="$NEPS" \
            evaluator.replan_every="$REPLAN_EVERY" \
            evaluator.chunk_start="$CHUNK_START" \
            evaluator.expected_sampler_steps="$SAMPLER_STEPS" \
            launch_params.gpus_per_node=1 \
            trainer.limit_val_batches=1 trainer.num_sanity_val_steps=0 \
            '~logger' name="${TAG}_${EXP}_${EMB}" \
            > "/tmp/${TAG}_${EXP}_${EMB}.log" 2>&1 \
            || { echo "FAILED: $EXP x $EMB"; grep -E '\[sim\]|Error|Traceback' "/tmp/${TAG}_${EXP}_${EMB}.log" | tail -25; return 1; }
          grep -E '\[sim\] SUMMARY' "/tmp/${TAG}_${EXP}_${EMB}.log" || true
        }

        # One-episode smoke over every pair first. Bugs in this family surface
        # only at model-construction or rollout time, deep into a run.
        #
        # The loop must NOT abort on the first failure. Under set -e it used to,
        # which meant each 45-minute cycle revealed exactly one broken
        # embodiment and hid the state of the other eight. Collect everything,
        # then report once.
        FIRST_EXP=$(echo $EXPERIMENTS | awk '{print $1}')
        SMOKE_OK=""; SMOKE_BAD=""
        for EMB in $EMBODIMENTS; do
          if run_one "$FIRST_EXP" "$EMB" 1 smoke; then
            SMOKE_OK="$SMOKE_OK $EMB"
          else
            SMOKE_BAD="$SMOKE_BAD $EMB"
          fi
        done
        echo "================ SMOKE ================"
        echo "  passed:$SMOKE_OK"
        echo "  FAILED:$SMOKE_BAD"
        for EMB in $SMOKE_BAD; do
          echo "--- first error for $EMB"
          grep -m3 -E "Error|Exception|Traceback|assert" \
            "/tmp/smoke_${FIRST_EXP}_${EMB}.log" 2>/dev/null | tail -3 || true
        done
        [ -z "$SMOKE_BAD" ] || { echo "FATAL: smoke failed for:$SMOKE_BAD"; exit 1; }
        echo "smoke complete over all embodiments"

        RC=0
        for EXP in $EXPERIMENTS; do
          for EMB in $EMBODIMENTS; do
            run_one "$EXP" "$EMB" "$N_EPISODES" rollout || RC=1
          done
        done

        echo "================ RESULTS ================"
        grep -h -E '\[sim\] SUMMARY' /tmp/rollout_*.log 2>/dev/null || echo "no summaries"

        echo "artifacts flushed to $DEST by the exit trap"
        exit $RC

  resources:
    default:
      cpu: {{cpu}}
      gpu: {{num_gpu}}
      memory: {{memory}}
      storage: {{storage}}

  timeout:
    queue_timeout: 1d
