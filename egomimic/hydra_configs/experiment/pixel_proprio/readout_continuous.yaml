# @package _global_
# Deferred stage 2. Supply the strictly expanded tensor artifact and its SHA256.
defaults:
  - /experiment/pixel_proprio/video_continuous
  - override /model: pixel_proprio/readout
  - _self_

name: pixel_proprio_readout_continuous
description: gripper_pixel160_continuous_frozen_image_measured9_control7_s42
pixel_readout:
  initial_weights: ???
  initial_weights_sha256: ???
  training_mode: frozen_image # Freeze all image weights, including noise conditioning.
  pose_dims: {libero_gripper: 9}
  action_dims: {libero_gripper: 7}
  max_tokens: 25856 # 128 * (200 image + 1 measured-state + 1 command) tokens.
  image_loss_weight: 1.0
  measured_state_loss_weight: 1.0
  control_command_loss_weight: 1.0
data:
  image_only: false
  task: visual_state_action
  max_frames: 128 # Preserve deferred stage2 sampling independently of stage1.
trainer:
  max_steps: 1000 # Deferred readout keeps its original pilot budget.
  val_check_interval: 250
callbacks:
  model_checkpoint:
    every_n_train_steps: 250
    save_last: true
evaluator:
  objective: visual_state_action
logger:
  wandb:
    group: pixel-proprio-readout
    tags: [pixels-from-scratch, frozen-image-expert, state-and-command-readout, no-point-tracks, gripper-only]
