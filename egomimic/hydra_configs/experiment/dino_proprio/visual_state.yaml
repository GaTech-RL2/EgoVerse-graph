# @package _global_
# Small gripper-only pilot. This predicts measured states, not control commands.
defaults:
  - override /model: dino_proprio/base
  - override /data: dino_proprio/prepared
  - override /trainer: default

name: dino_proprio_visual_state_pilot
description: dino_proprio_only_s42
seed: 42
norm_stats: null
normalizer: null
inference_config:
  enabled: false
evaluator:
  _target_: egomimic.eval.dino_proprio_eval.DinoProprioEval
  objective: visual_proprio
  sample_seed: 42
trainer:
  accelerator: gpu
  precision: 32-true
  devices: 1
  min_epochs: 0
  max_epochs: -1
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 250
  check_val_every_n_epoch: null
  max_steps: 1000
  num_sanity_val_steps: 0
  log_every_n_steps: 1
callbacks:
  model_checkpoint:
    filename: "epoch_{epoch:04d}-step_{step:09d}"
    every_n_epochs: 0
    every_n_train_steps: 250
    save_on_train_epoch_end: false
    save_top_k: -1
    save_last: true
runtime:
  strict_fp32: true
logger:
  wandb:
    project: mot-world-model
    entity: rl2-group
    group: dino-proprio-minimal-bc
    tags: [dino-proprio-only, no-point-tracks, pilot]
