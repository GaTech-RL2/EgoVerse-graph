model:
  _target_: egomimic.pl_utils.pl_model.ModelWrapper
  train_log_on_step: true
  pipeline:
    _target_: egomimic.pipeline.algo.PipelineAlgo
    stages:
    - _target_: egomimic.pipeline.stages_sampler.FusedObsEncoder
      n_obs_steps: 2
      inputs:
        front_img_1: front_img_1
        state_agent_obj: state_agent_obj
      encoder:
        _target_: egomimic.pipeline.stages_sampler.DPStyleObsEncoder
        obs_specs:
          state_agent_obj:
            input_dim: 3
            input_slice:
            - 0
            - 3
        img_encoders:
          front_img_1:
            _target_: egomimic.models.stems.visual_core.VisualCore
            in_channels: 3
            image_size: 96
            num_kp: 32
            feature_dimension: 64
            pretrained: false
            crop_aug: true
            crop_height: 84
            crop_width: 84
            crop_eval_mode: center
            crop_sample_mode: v02
            crop_scope: frame
            norm_layer: group
            pool_type: spatial_softmax
    - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
      action_horizon: 56
      action_dim: 9
      noise_scheduler:
        _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
        num_train_timesteps: 100
        beta_schedule: squaredcos_cap_v2
        variance_type: fixed_small
        clip_sample: true
        prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
      action_horizon: 56
      action_dim: 9
      condition_input_dim: 134
      policy:
        _target_: egomimic.models.diffusion_policy.DiffusionPolicy
        action_horizon: 56
        num_inference_steps: 100
        model:
          _target_: egomimic.models.denoising_nets.PaperConditionalUnet1D
          input_dim: 9
          global_cond_dim: 134
          diffusion_step_embed_dim: 128
          down_dims:
          - 512
          - 1024
          - 2048
          kernel_size: 5
          n_groups: 8
          cond_predict_scale: true
        noise_scheduler:
          _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
          num_train_timesteps: 100
          beta_schedule: squaredcos_cap_v2
          variance_type: fixed_small
          clip_sample: true
          prediction_type: epsilon
    - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage
    homogeneous_training: true
  enable_grad_norm: false
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    betas:
    - 0.95
    - 0.999
    eps: 1.0e-08
    weight_decay: 1.0e-06
  scheduler:
    _target_: egomimic.utils.schedulers.warmup_cosine_scheduler
    _partial_: true
    max_steps: 240000
    warmup_steps: 500
    warmup_start_factor: 1.0e-08
    eta_min: 0.0
