# @package _global_
# ABC-ONLY (no cotraining) ARC-TOKENIZED 300M HPT flow matching at D = 0.40 m /
# M = 100: fold_and_stack_the_t_shirts, yam_bimanual.
#
# Arc tokenization is loader-side (arc_tokenizer_cartesian in the data config).
# The HPT flow graph sees `actions_cartesian` as the existing 200-row
# per-waypoint arc-token target -- no graph-side ArcTokenizeStage.
#
# Launch:
#   python egomimic/trainHydra.py -m \
#       +experiment=abc_arc/abc_fstshirt_arc_bc
defaults:
  - override /model: abc/yam_bimanual_hpt
  - override /data: abc_arc/abc_fstshirt_arc_bc_D40_M100
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_pace
  - _self_

name: abc_fstshirt_arc_bc
description: hpt_flow_300M_arcD40M100_head512

paths:
  dataset_dir: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

logger:
  wandb:
    project: abc-yam
    tags:
      - abc
      - bc
      - hpt
      - flow
      - 300m
      - arc

abc:
  action_dim: 14
  # How the arc token carries timing:
  #   mean          M waypoints + one velocity row  -> M + 1  = 101 rows
  #   per_waypoint  M waypoints + M velocity rows   -> 2 * M   = 200 rows
  #   duration      M waypoints + M duration rows   -> 2 * M   = 200 rows
  # per_waypoint / duration recover a chunk that accelerates, decelerates or
  # dwells; on this data per_waypoint cut round-trip xyz error from 8.4cm to
  # 0.02cm on a decelerating chunk. duration stores Δt instead of rate.
  # The 2M layout is also divisible by 4, which ConditionalUnet1D's two
  # downsample stages require -- 101 is odd and crashes the skip-connection
  # concat.
  arc_velocity_mode: per_waypoint
  # Arc scoring settings, shared with the baseline twin.
  arc_distance: 0.40
  arc_waypoints: 100
  arcmatch_points: 32
  arc_chunk_rows: 45
  arc_token_rows: 200

hpt:
  # Keep the same graph interface and scale the flow head above the original
  # HPT recipe while following the loader's 200 ARC-token action horizon.
  embed_dim: 840
  num_blocks: 19
  num_heads: 10
  head_hidden_dim: 512
  head_num_blocks: 6
  head_num_heads: 8
  head_mlp_layers: 4
  head_mlp_ratio: 4
  action_horizon: ${abc.arc_token_rows}
  action_dim: ${abc.action_dim}
  stem_specs:
    random_horizon_masking: false
    cross_attn:
      crossattn_latent: 16
      crossattn_heads: 10
      crossattn_dim_head: 84
      crossattn_modality_dropout: 0.1
      modality_embed_dim: ${hpt.embed_dim}

# Same knobs the baseline twin sets, so the two arms score in one space.
evaluator:
  arc_metrics: true
  include_reconstruction_loss: false
  arcmatch_distance: ${abc.arc_distance}
  arcmatch_points: ${abc.arcmatch_points}
  arc_chunk_rows: ${abc.arc_chunk_rows}
