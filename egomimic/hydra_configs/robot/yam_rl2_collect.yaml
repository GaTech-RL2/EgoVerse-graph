# RL2 Yam station profile, derived from yam-pipeline master at 1b1f9b12.
robot:
  kind: yam
  arms:
  - left
  - right
  channels:
    left: can_follower_l
    right: can_follower_r
  gripper_type: linear_4310
  zero_gravity_mode: true
  enable_auto_recovery: true
  frequency: 50
  home_duration: 1.5
  home:
    left:
    - -0.008
    - 0.007
    - 0.004
    - -0.070
    - 0.001
    - -0.015
    - 0.999
    right:
    - 0.007
    - 0.006
    - 0.005
    - -0.073
    - -0.013
    - -0.022
    - 0.999
  kinematics:
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    site_name: tcp_site
  cameras:
    front_img_1:
      type: realsense
      enabled: true
      # Matches the calibrated agentview camera in yam-pipeline.
      serial_number: '230322272195'
      height: 480
      width: 640
      fps: 30
    left_wrist_img:
      type: realsense
      enabled: true
      serial_number: '218622270679'
      height: 480
      width: 640
      fps: 30
    right_wrist_img:
      type: realsense
      enabled: true
      serial_number: '230322270555'
      height: 480
      width: 640
      fps: 30
frequency: 30
max_joint_velocity: 1.0
startup_timeout: 30.0
quest:
  ip_address: null
  max_age: 0.25
teleop:
  translation_gain: 0.7
  orientation_gain: 0.55
  target_lpf: 0.4
  max_controller_step_m: 0.08
  max_controller_step_deg: 40.0
  headset_yaw_degrees: 180.0
  orientation_rx_degrees: 0.0
  side_yaw: {}
buttons:
  record: B
  stop: X
  home: Y
  quit: A
recording:
  enabled: true
  directory: ./demos/yam
  episode_start: 0
  episode_length: 3000
preview:
  enabled: true
  width: 640
