_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
_recursive_: false
source_fps: 30.0
train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.embodiment_resolvers.S3EpisodeResolverWithEmbodimentOverride
      embodiment_override: yam_bimanual
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
        variant: ${yam.variant}
        horizon: 200
        embodiment: yam
        drop_wrist_images: false
        yam_source_frames: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
        variant: time
        chunk_length: 200
        time_rows: 100
        min_distance_unit: 0.4
        resampled_vector_length: 100
        stride: 1
        rotation_mode: euler
        embodiment: yam
        yam_source_frames: 100
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row[''embodiment''] == ''yam_bimanual'' and row[''lab''] == ''rl2'' and row[''task''] in (''organize_stationary'',
        ''organize_stationary_updated'') and row[''rig_name''] == ''rl2_abc'' and row[''zarr_processed_path''] !=
        '''' and row[''is_deleted''] == False'
    mode: total
    valid_ratio: 0.0
    bounds_check: false
valid_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.embodiment_resolvers.S3EpisodeResolverWithEmbodimentOverride
      embodiment_override: yam_bimanual
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
        variant: ${yam.variant}
        horizon: 200
        embodiment: yam
        drop_wrist_images: false
        yam_source_frames: 100
      transform_list:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
        variant: time
        chunk_length: 200
        time_rows: 100
        min_distance_unit: 0.4
        resampled_vector_length: 100
        stride: 1
        rotation_mode: euler
        embodiment: yam
        yam_source_frames: 100
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row[''embodiment''] == ''yam_bimanual'' and row[''lab''] == ''rl2'' and row[''task''] in (''organize_stationary'',
        ''organize_stationary_updated'') and row[''rig_name''] == ''rl2_abc'' and row[''zarr_processed_path''] !=
        '''' and row[''is_deleted''] == False'
    mode: total
    valid_ratio: 0.0
    bounds_check: false
train_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 7
    persistent_workers: true
valid_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 7
    persistent_workers: true
