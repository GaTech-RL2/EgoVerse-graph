# Graph port of the E1 ResNet + MLP + HPT flow architecture.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    sampler: 4
  stages:
  - _target_: egomimic.pipeline.stages_hpt.HPTStemStage
    stems:
      observations.images.front_img_1:
        _target_: egomimic.models.stems.e1_image.E1ImageStem
        output_dim: ${hpt.embed_dim}
        weights: ${e1.image_weights}
        specs: ${hpt.stem_specs}
    domain_stems:
      human_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
          input_dim: 14
          output_dim: ${hpt.embed_dim}
          widths:
          - ${hpt.embed_dim}
          specs: ${hpt.stem_specs}
      yam_bimanual:
        observations.state.ee_pose:
          _target_: egomimic.models.stems.hpt_stems.MLPPolicyStem
          input_dim: 14
          output_dim: ${hpt.embed_dim}
          widths:
          - ${hpt.embed_dim}
          specs: ${hpt.stem_specs}
    selector_aliases: &id001
      '3': human_bimanual
      '7': yam_bimanual
  - _target_: egomimic.pipeline.stages_hpt.HPTTrunkStage
    embed_dim: ${hpt.embed_dim}
    token_postprocessing: action_token
    use_position_embedding: true
    max_tokens: 512
    trunk:
      _target_: egomimic.models.cores.hpt_transformer.SimpleTransformer
      embed_dim: ${hpt.embed_dim}
      num_blocks: ${hpt.num_blocks}
      drop_path_rate: 0.1
      weight_init_style: pytorch
      attn_target:
        _target_: egomimic.models.cores.hpt_transformer.MultiheadAttention
        _partial_: true
        embed_dim: ${hpt.embed_dim}
        num_heads: ${hpt.num_heads}
        batch_first: true
    use_domain_embedding: true
    domains:
    - human_bimanual
    - yam_bimanual
    selector_aliases: *id001
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: actions_cartesian
  - _target_: egomimic.pipeline.stages_flow.FlowNoisingStage
    action_horizon: ${hpt.action_horizon}
    action_dim: ${hpt.action_dim}
    time_dist: beta
    beta_alpha: 1.5
    beta_beta: 1.0
  - _target_: egomimic.pipeline.stages_flow.FlowDenoiserStage
    action_horizon: ${hpt.action_horizon}
    action_dim: ${hpt.action_dim}
    condition_input_dim: ${hpt.embed_dim}
    num_inference_steps: 50
    condition_as_tokens: true
    model:
      _target_: egomimic.models.denoising_nets.CrossTransformer
      nblocks: 6
      cond_dim: ${hpt.embed_dim}
      hidden_dim: 128
      act_dim: ${hpt.action_dim}
      act_seq: ${hpt.action_horizon}
      n_heads: 4
      dropout: 0.1
      mlp_layers: 4
      mlp_ratio: 4
      time_conditioning: additive
  - _target_: egomimic.pipeline.stages_flow.FlowVelocityLossStage
enable_grad_norm: false
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0003
  weight_decay: 0.0001
scheduler: null

# Inference semantics belong to this model; station calibration is separate.
inference_contracts:
  time:
    input:
      constants:
        embodiment: ${model.source_identities.${e1.policy_domain}}
      history_length: 1
      keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - embodiment
      history_keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${hpt.action_horizon}
      - ${hpt.action_dim}
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${hpt.action_horizon}
      - ${hpt.action_dim}
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
      tokenizer: null
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder: null
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 10
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: num_inference_steps
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${hpt.action_horizon}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
  arcmean:
    status: unsupported
    reason: Chunk-mean ARC timing cannot reconstruct dwell or interval durations.
      Retain this recipe for diagnostics; use a temporally resolved representation
      for rollout.
  arcvel:
    input:
      constants:
        embodiment: ${model.source_identities.${e1.policy_domain}}
      history_length: 1
      keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - embodiment
      history_keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${hpt.action_horizon}
      - ${hpt.action_dim}
      timing:
        kind: per_waypoint_progress
        temporally_resolved: true
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${e1.time_rows}
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
      tokenizer:
        variant: arcvel
        distance: ${e1.D}
        waypoints: ${e1.M}
        velocity_norm: ${e1.velocity_norm}
        fixed_spacing: ${e1.fixed_spacing}
        progress_smooth_hz: ${e1.progress_smooth_hz}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
            token_layout: e1_profile
            min_distance_unit: ${e1.D}
            resampled_vector_length: ${e1.M}
            dt: 0.03333333333333333
            action_horizon: ${e1.time_rows}
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 10
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: num_inference_steps
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${e1.time_rows}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
  arcdur:
    input:
      constants:
        embodiment: ${model.source_identities.${e1.policy_domain}}
      history_length: 1
      keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - embodiment
      history_keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${hpt.action_horizon}
      - ${hpt.action_dim}
      timing:
        kind: per_waypoint_duration
        temporally_resolved: true
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${e1.time_rows}
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
      tokenizer:
        variant: arcdur
        distance: ${e1.D}
        waypoints: ${e1.M}
        velocity_norm: ${e1.velocity_norm}
        fixed_spacing: ${e1.fixed_spacing}
        progress_smooth_hz: ${e1.progress_smooth_hz}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
            token_layout: e1_dur
            min_distance_unit: ${e1.D}
            resampled_vector_length: ${e1.M}
            dt: 0.03333333333333333
            action_horizon: ${e1.time_rows}
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 10
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: num_inference_steps
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${e1.time_rows}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
  arclogdur:
    input:
      constants:
        embodiment: ${model.source_identities.${e1.policy_domain}}
      history_length: 1
      keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
      - embodiment
      history_keys:
      - observations.images.front_img_1
      - observations.state.ee_pose
    native_output:
      frame: eef_frame
      key: pred_action
      representation: normalized_action
      shape:
      - ${hpt.action_horizon}
      - ${hpt.action_dim}
      timing:
        kind: per_waypoint_log_duration
        temporally_resolved: true
    output:
      frame: eef_frame
      key: actions
      representation: cartesian
      shape:
      - ${e1.time_rows}
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
      tokenizer:
        variant: arclogdur
        distance: ${e1.D}
        waypoints: ${e1.M}
        velocity_norm: ${e1.velocity_norm}
        fixed_spacing: ${e1.fixed_spacing}
        progress_smooth_hz: ${e1.progress_smooth_hz}
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - ${hpt.action_horizon}
        - ${hpt.action_dim}
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.robot.arc_decoder.BimanualArcDecoder
            token_layout: e1_logdur
            min_distance_unit: ${e1.D}
            resampled_vector_length: ${e1.M}
            dt: 0.03333333333333333
            action_horizon: ${e1.time_rows}
          rotation_mode: euler
          action_frame: eef_frame
        overrides:
          inference_steps:
            label: Sampling steps
            description: Solver iterations per prediction.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 10
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: num_inference_steps
          replan_every:
            label: Actions before replanning
            description: Execute this prefix before predicting again.
            type: integer
            min: 1
            max: ${e1.time_rows}
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
inference: ${model.inference_contracts.${e1.variant}}

# Data and deployment routing are declared by the model and experiment.
source_identities:
  human: 3
  yam: 7
data_contracts:
  human:
    preprocessing:
      '3':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          horizon: ${e1.chunk_length}
          embodiment: human
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${e1.variant}
          embodiment: human
          chunk_length: ${e1.chunk_length}
          time_rows: ${e1.time_rows}
          min_distance_unit: ${e1.D}
          resampled_vector_length: ${e1.M}
          stride: 1
          rotation_mode: euler
          progress_smooth_hz: ${e1.progress_smooth_hz}
          velocity_norm: ${e1.velocity_norm}
          fixed_spacing: ${e1.fixed_spacing}
        source_fps: 30.0
  yam:
    preprocessing:
      '7':
        key_map:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
          horizon: ${e1.chunk_length}
          embodiment: yam
        transforms:
          _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
          variant: ${e1.variant}
          chunk_length: ${e1.chunk_length}
          time_rows: ${e1.time_rows}
          min_distance_unit: ${e1.D}
          resampled_vector_length: ${e1.M}
          stride: 1
          rotation_mode: euler
          progress_smooth_hz: ${e1.progress_smooth_hz}
          velocity_norm: ${e1.velocity_norm}
          fixed_spacing: ${e1.fixed_spacing}
          embodiment: yam
        source_fps: 30.0
data_requirements: ${model.data_contracts.${e1.policy_domain}}
