_target_: egomimic.pl_utils.pl_model.ModelWrapper
enable_grad_norm: false
training_behavior:
  _target_: egomimic.pl_utils.oat_training.OATTrainingBehavior
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stages:
  - _target_: egomimic.pipeline.stages_oat.OATObservationStage
    encoder:
      _target_: egomimic.models.oat.factory.make_obs_encoder
    obs_keys:
    - agentview_rgb
    - robot0_eye_in_hand_rgb
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - task_uid
  - _target_: egomimic.pipeline.stages_io.ActionTargetBuilder
    action_key: bspline
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionNoisingStage
    action_horizon: ${benchmark.bspline.num_knots}
    action_dim: 8
    noise_scheduler: &id001
      _target_: egomimic.models.ddim_scheduler.DDIMScheduler
      num_train_timesteps: 100
      beta_schedule: squaredcos_cap_v2
      prediction_type: epsilon
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionDenoiserStage
    action_horizon: ${benchmark.bspline.num_knots}
    action_dim: 8
    condition_input_dim: 276
    policy:
      _target_: egomimic.models.diffusion_policy.DiffusionPolicy
      action_horizon: ${benchmark.bspline.num_knots}
      num_inference_steps: 100
      model:
        _target_: egomimic.models.denoising_nets.ConditionalUnet1D
        input_dim: 8
        cond_dim: 276
        ac_latent_seq: 1
        diffusion_step_embed_dim: 256
        down_dims:
        - 256
        - 512
        - 1024
        kernel_size: 3
      noise_scheduler: *id001
  - _target_: egomimic.pipeline.stages_diffusion.DiffusionEpsilonLossStage
  - _target_: egomimic.pipeline.stages_bspline.BSplineDecodeStage
    codec: ${benchmark.bspline}
    horizon: ${benchmark.horizon}
benchmark_protocol:
  suite: ${benchmark.suite}
  horizon: ${benchmark.horizon}
  n_obs_steps: ${benchmark.n_obs_steps}
  n_action_steps: ${benchmark.n_action_steps}
  action_representation: bspline_policy_v1
  dp_backbone: unet
  bspline: ${benchmark.bspline}
  segment_alignment: false
  execution_speed: 1.0
  segment_end_behavior: hold_until_fixed_replan
  upstream_commit: 61ed5f42fced971d50a89b46417493790876ccd1
