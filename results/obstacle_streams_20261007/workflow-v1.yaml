      storage: 500Gi
      platform: ovx-l40s
    evaluation:
      cpu: 8
      gpu: 1
      memory: 64Gi
      storage: 120Gi
      platform: ovx-l40s
  timeout:
    queue_timeout: 48h
    exec_timeout: 96h
