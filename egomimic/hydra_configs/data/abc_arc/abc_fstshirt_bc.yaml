# `image_hw` pins every episode to one size per embodiment, with each episode's
# intrinsics rescaled by the same per-axis factors (ZarrDataset._scale_intrinsics).
# These splits happen to be uniform today, but a batch cannot mix image sizes and
# ABC/mecka ship 640x480, 640x360, 1280x720 and 848x480 -- so adding an episode
# without this would crash collate rather than resize.
# ABC-ONLY (no cotraining) time-indexed BC data: fold_and_stack_the_t_shirts,
# yam_bimanual.
#
# Retained for experiment/abc/yam_fstshirt_{dp,hpt}. Historical cotrain/ARC
# ablation templates were retired; the supported ARC experiments now live in
# experiment/abc_arc/{robot_bc,human_bc}. Keep this older baseline's 20-episode
# sampling contract unchanged for its existing consumers.
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  yam_bimanual:
    # Keys the transform_list ADDS after the key_map is read. The graph
    # linter (tools/config_graph.py) derives a source's batch keys from its
    # key_map alone, so without this it reports the concatenated pose and
    # action keys as unprovided.
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}
      image_hw: [480, 640]
      # 20 YAM episodes = 48,286 frames. Matched to the cotrain run's yam split
      # so the two see identical robot data; do not change one without the other.
      debug: 20
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'yam_bimanual' and row['lab'] == 'abc' and row['task'] == 'fold and stack the t-shirts' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: train
    valid_ratio: 0.2
    bounds_check: false

# Duplicated (not interpolated) so hydra.utils.instantiate can resolve without
# needing to walk up to `train_datasets` after it's been mutated in place.
valid_datasets:
  yam_bimanual:
    # Keys the transform_list ADDS after the key_map is read. The graph
    # linter (tools/config_graph.py) derives a source's batch keys from its
    # key_map alone, so without this it reports the concatenated pose and
    # action keys as unprovided.
    batch_keys: [observations.state.ee_pose, actions_cartesian]
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.S3EpisodeResolver
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/project/r-dxu345-0/shared/arc_abc}
      image_hw: [480, 640]
      debug: 20
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: cartesian
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: cartesian
        coord_frame: eef_frame
        rotation_mode: euler
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['embodiment'] == 'yam_bimanual' and row['lab'] == 'abc' and row['task'] == 'fold and stack the t-shirts' and row['zarr_processed_path'] != '' and row['is_deleted'] == False"
    mode: valid
    valid_ratio: 0.2
    bounds_check: false

train_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 6

valid_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 6
