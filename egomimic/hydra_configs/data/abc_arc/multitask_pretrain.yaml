# ABC seven-task pretraining corpus: abc/arm_local_fk_v1 conversion, YAM bimanual.
# Uses the conversion's published is_eval split (no extra random split).
# Poses are grasp_site FK relative to each arm's base, stored as
# <arm>.{obs,cmd}_ee_pose_arm_local. Episodes are 30 or 60 Hz, so the
# control-rate resolver samples every stream on one 30 Hz clock.
_target_: egomimic.rldb.zarr.data_module.ZarrDataModule
_recursive_: false
source_fps: 30.0
train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    batch_keys:
    - observations.state.ee_pose
    - actions_cartesian
    resolver:
      _target_: egomimic.rldb.zarr.control_rate.ControlRateS3EpisodeResolver
      control_fps: 30
      folder_path: ${oc.env:EGOVERSE_ABC_DATASET_DIR}
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_keymap
        keymap_mode: ${abc.action_mode}
        annotation_key: null
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        pose_zarr_suffix: _arm_local
      transform_list:
        _target_: egomimic.rldb.embodiment.yam.Yam.get_transform_list
        action_mode: ${abc.action_mode}
        coord_frame: eef_frame
        rotation_mode: euler
        min_distance_unit: ${abc.arc_distance}
        rotation_distance_unit: ${abc.arc_rotation_distance}
        resampled_vector_length: ${abc.arc_waypoints}
        clock_mode: ${abc.arc_clock_mode}
        streams: ${abc.arc_streams}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - "lambda row: row.get('lab') == 'abc'"
      - "lambda row: row.get('embodiment') == 'yam_bimanual'"
      - "lambda row: (row.get('zarr_processed_path') or '').startswith('s3://rldb/processed_v3/abc/arm_local_fk_v1/')"
      - "lambda row: row.get('task') in ('Fold and stack T-shirts', 'Pack the student bag', 'Put credit cards into the card holder', 'Put keys on the keyring', 'Place food in a zip-top bag and seal it', 'Sort LEGOs into containers by color', 'Untangle cables')"
      - "lambda row: row.get('is_eval') == False"
    mode: total
    bounds_check: false
valid_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    batch_keys:
    - observations.state.ee_pose
    - actions_cartesian
    resolver: ${data.train_datasets.yam_bimanual.resolver}
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - "lambda row: row.get('lab') == 'abc'"
      - "lambda row: row.get('embodiment') == 'yam_bimanual'"
      - "lambda row: (row.get('zarr_processed_path') or '').startswith('s3://rldb/processed_v3/abc/arm_local_fk_v1/')"
      - "lambda row: row.get('task') in ('Fold and stack T-shirts', 'Pack the student bag', 'Put credit cards into the card holder', 'Put keys on the keyring', 'Place food in a zip-top bag and seal it', 'Sort LEGOs into containers by color', 'Untangle cables')"
      - "lambda row: row.get('is_eval') == True"
    mode: total
    bounds_check: false
train_dataloader_params:
  yam_bimanual:
    batch_size: 96
    num_workers: 16
    # An epoch is 100 batches (trainer limit_train_batches); keep workers alive across epochs
    # instead of respawning them every 100 steps.
    persistent_workers: true
    prefetch_factor: 4
valid_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 6
