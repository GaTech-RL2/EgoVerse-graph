# @package _global_
# Stationery fine-tune, 2026-09-17 -- arcdur arm.
#
# Continues Elmo's checkpoint epoch-2099-step-00210000.ckpt (run
# yam_rl2_abc_hptflow_h640t8_d384x10_cos10k_s42_yam97cutoff20260915) on the
# re-collected station data. Model/data/trainer/callbacks/logger blocks are his,
# lifted from resolved-config.yaml; the deltas are listed below.
#
# ft.max_steps drives BOTH trainer.max_steps and the cosine T_max
# (model.scheduler.max_steps). They must never diverge: warmup_cosine_scheduler
# computes T_max = max_steps - warmup_steps from ITS OWN argument, so a 60k trainer
# against a 240k scheduler would anneal a quarter of the way down and stop, i.e.
# train the whole run at a near-flat high LR. One knob removes that failure mode.
#
# Deltas vs Elmo's run:
#   max_steps      240000 -> 60000      (Aidan, 09-17)
#   warmup_steps    10000 -> 2500       (keeps warmup at ~1/24 of the run, as his was)
#   checkpoints    every_n_train_steps 30000, save_top_k -1  (his cadence, unchanged)
#   init_weights_from  <- weights-only init; cfg.ckpt_path stays null because in
#                        mode=train Lightning treats it as a full RESUME and would
#                        restore global_step=210000 against a 60k cap and stop.
#   rl2 task string  organize_stationary -> organize_stationary_updated
#   wandb id         new per arm (his id would have written into HIS run)
#   action dim  14 -> 16 on the three ACTION dims only (the (100,16) duration
#               token). ee_pose.input_dim stays 14 and act_seq stays 100, so the
#               denoiser pos_emb still matches the checkpoint tensor-for-tensor;
#               only proj_u/proj_d change shape and get re-initialised.
#   norm_stats  recomputed: his stats cover actions_cartesian, not the 16-D arc
#               token. precomputed_norm_path is null so this arm computes its own.
#   evaluator   null. His ArcBimanualCartesianEval decodes cartesian actions and
#               would be wrong against arc tokens; val LOSS still runs every
#               check_val_every_n_epoch. Both arms get a matched eval-only pass after.
defaults:
- /experiment/yam_arc_grid/stationery_ft_time
- _self_
- override /model: e1/hpt_flow_wrists_ft_arcdur
- override /data: abc_arc/stationery_ft_arcdur
name: stationery_ft_arcdur
description: h640t8_d384x10_cos2.5k_ft60k_s42_arcdur_20260917
logger:
  wandb:
    id: stationery_ft_arcdur_20260917_s42
    tags:
    - abc
    - rl2
    - yam
    - hpt
    - flow
    - stationery
    - finetune
    - arcdur
norm_stats:
  precomputed_norm_path: null
e1:
  policy_domain: yam
  variant: arcdur
  action_dim: 16
hpt:
  action_dim: 16
evaluator: null

model:
  data_requirements: ${model.data_contracts.yam}
