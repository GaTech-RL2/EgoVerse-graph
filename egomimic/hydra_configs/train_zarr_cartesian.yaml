defaults:
  - model: hpt_bc_flow_eva
  - paths: default
  - trainer: ddp
  - debug: null
  - logger: wandb
  - data: eva
  - callbacks: checkpoints
  - evaluator: eval_hpt
  - override hydra/launcher: submitit
  - _self_

name: test
description: test
ckpt_path: null
mode: train

hydra:
  run:
    # Dir should be experiment_name/description_{timestamp}
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

launch_params:
  gpus_per_node: 1
  nodes: 1

runtime:
  # Keep Lightning's historical SIGUSR1/scontrol ownership unless a maintained
  # external runner is explicitly selected and confirms ownership via env.
  slurm_requeue_owner: lightning
  # Runner-owned mode forwards SIGUSR2 to request a save without granting the
  # framework authority to call scontrol or finalize W&B.
  slurm_save_signal: SIGUSR2
  slurm_signal_checkpoint_dir: ${paths.output_dir}/checkpoints

seed: 42

# Normalization and norm-stat cache settings (override per-run as needed).
norm_stats:
  norm_mode: quantile
  # Pool across time/sequence axes while retaining the final feature axis.
  reduce_all_but_last: false
  sample_frac: 1.0
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
reject_outliers: true
