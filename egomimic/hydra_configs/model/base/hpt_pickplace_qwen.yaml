# Shared model definition; concrete recipes preserve their own source/timing settings.
_target_: egomimic.pl_utils.pl_model.ModelWrapper
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0002
  weight_decay: 0.0001
scheduler:
  _target_: egomimic.utils.schedulers.warmup_then_cosine
  _partial_: true
  warmup_epochs: 100
  total_epochs: 2000
  eta_min: 1.0e-05
scheduler_interval: epoch
pipeline:
  _target_: egomimic.pipeline.algo.PipelineAlgo
  stage_ids:
    stems: 1
    trunk: 2
    sampler: 5
deployment_domain: eva_bimanual
inference_domains:
  eva_bimanual:
    input:
      history_length: 1
      keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      - annotations
      - embodiment
      history_keys:
      - observations.state.ee_pose
      - observations.images.front_img_1
      constants:
        embodiment: 6
    native_output:
      frame: camframe
      key: pred_action
      representation: normalized_action
      shape:
      - 100
      - 14
      timing:
        kind: uniform_resampled_target
        temporally_resolved: true
        dt: 0.014814814814814815
        first_source_frame: 0
        last_source_frame: 44
        source_fps: 30
    output:
      frame: camframe
      key: actions
      representation: cartesian
      shape:
      - 45
      - 14
      timing:
        kind: control_period
        temporally_resolved: true
        dt: 0.03333333333333333
    compatibility:
      normalizer_schema:
        action_key: actions_cartesian
        native_shape:
        - 100
        - 14
        embodiment: 6
      tokenizer: null
    profiles:
      default:
        stage_id: sampler
        native_shape:
        - 100
        - 14
        adapter:
          _target_: egomimic.robot.graph_policy.CartesianGraphAdapter
          decoder:
            _target_: egomimic.pipeline.sequence_decoder.UniformTimeGridDecoder
            native_shape:
            - 100
            - 14
            native_dt: 0.014814814814814815
            output_horizon: 45
            output_dt: 0.03333333333333333
            angular_indices:
            - 3
            - 4
            - 5
            - 10
            - 11
            - 12
          rotation_mode: euler
          action_frame: model_frame
        overrides:
          replan_every:
            label: Actions before replanning
            description: Control-rate execution prefix.
            type: integer
            min: 1
            max: 45
            step: 1
            default: 30
            target:
              kind: policy_attribute
              attribute_path: replan_every
          inference_steps:
            label: Sampling steps
            description: Configured sampler iterations.
            type: integer
            min: 1
            max: 100
            step: 1
            default: 50
            target:
              kind: stage_attribute
              stage_id: sampler
              attribute_path: num_inference_steps
inference: ${model.inference_domains.${model.deployment_domain}}
data_requirements:
  preprocessing:
    '6':
      transforms:
        action_mode: cartesian
        coord_frame: camframe
        rotation_mode: euler
      source_fps: 30.0
