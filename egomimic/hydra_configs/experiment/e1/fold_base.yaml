# @package _global_
# E1 of the mixed-speed protocol on mecka freeform fold data (real, bimanual).
# One experiment config per row (fold_time / fold_arcmean / fold_arcvel); the
# launcher sets e1.spread, e1.train_root, e1.valid_root, seed and the budget.
# trainer/base.yaml pins limit_train_batches=100: one "epoch" = 100 optimizer
# steps, so 300 epochs = the 30k-step budget; val every 1k steps, ckpt every 5k.
# The E1 pipeline zero-pads the gripper slot on the proprio key too
# (PadGripperZeros on observations.state.ee_pose -> 14-D), while the lab's
# mecka model configs declare the state stem at 12. Match the data.
defaults:
- override /data: e1/fold_freeform
- override /evaluator: e1/fold_tempo
- _self_
e1:
  variant: ???
  spread: ???
  train_root: ???
  valid_root: ???
  train_mode: total
  valid_mode: total
  D: 0.4
  M: 100
  time_rows: 100
  chunk_length: 100
  h_match_frames: 40
  limit_val_batches: 40
  prog_horizon_m: 0.19
  progress_smooth_hz: null
  anchor_sampler: null
  velocity_norm: path
  fixed_spacing: false
  arcmatch_gt_span_m: null
  action_dim: 14
  action_horizon: 100
  image_weights: DEFAULT
name: e1_fold_${e1.variant}
description: ${e1.spread}_s${seed}
arc_tokenizer:
  min_distance_unit: ${e1.D}
  resampled_vector_length: ${e1.M}
trainer:
  strategy: auto
  sync_batchnorm: false
  check_val_every_n_epoch: 10
  num_sanity_val_steps: 0
  limit_val_batches: ${e1.limit_val_batches}
callbacks:
  model_checkpoint:
    every_n_epochs: 50
    save_top_k: -1
norm_stats:
  sample_frac: 0.25
  num_workers: 8
hpt:
  embed_dim: 256
  num_blocks: 16
  num_heads: 8
  stem_specs:
    random_horizon_masking: false
    cross_attn:
      crossattn_latent: 16
      crossattn_heads: 8
      crossattn_dim_head: 64
      crossattn_modality_dropout: 0.1
      modality_embed_dim: ${hpt.embed_dim}
  action_dim: ${e1.action_dim}
  action_horizon: ${e1.action_horizon}
