      expected_episode_count: 389
      expected_episode_names_sha256: f55cd4b4dcda9c72864458822cda916a3aeea1f83902caed17c24a9b9c504a6b
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row, allowed=frozenset(open(''/workspace/users/agao81/EgoVerse-graph/egomimic/hydra_configs/data/abc_arc/abc_towels389_episodes.txt'').read().split()):
