# @package _global_
defaults:
- /experiment/sim/libero/action_flow_libero_spatial_sharpa_gripper_keypoints_s42
- _self_
name: action_flow_libero_spatial_sharpa_mot_s42
description: MoT latent-token parameter sharing across original7D and operator-hand69D
  codecs; one shared conditional flow
model:
  pipeline:
    _target_: egomimic.pipeline.algo.PipelineAlgo
    stages:
    - _target_: egomimic.pipeline.stages_sampler.KeyedFeatureProjection
      selector_key: embodiment
      selector_aliases:
        21: libero_panda
        22: libero_panda_sharpa
      input_key:
      - robot0_eef_pos
      - robot0_eef_quat
      - robot0_gripper_qpos
      - task_uid
      output_key: proprio_condition
      output_dim: 10
      projections:
        libero_panda:
          input_dim: 10
          identity: true
        libero_panda_sharpa:
          input_dim: 30
          hidden_dim: 32
    - _target_: egomimic.pipeline.stages_oat.OATObservationStage
      obs_keys:
      - agentview_rgb
      - robot0_eye_in_hand_rgb
      - proprio_condition
      encoder:
        _target_: egomimic.models.oat.factory.make_obs_encoder
        shape_meta:
          action:
            shape:
            - 69
          obs:
            agentview_rgb:
              shape:
              - 128
              - 128
              - 3
              type: rgb
            robot0_eye_in_hand_rgb:
              shape:
              - 128
              - 128
              - 3
              type: rgb
            proprio_condition:
              shape:
              - 10
              type: state
    - ${libero_blueprint.pipeline.stages.1}
    - ${libero_blueprint.pipeline.stages.2}
    - _target_: egomimic.pipeline.stages_action_flow.RoutedContentEncoderStage
      route_key: embodiment
      route_aliases:
        21: libero_panda
        22: libero_panda_sharpa
      encoders:
        _target_: egomimic.models.mot_action_codec.make_mot_codecs
        action_dims: ${model.action_dims}
        role: encoder
        horizon: ${model.action_horizon}
        tokens: ${model.num_latent_tokens}
        latent_dim: ${model.latent_dim}
        width: ${model.hidden_dim}
        depth: 12
        heads: 8
        mlp_ratio: 4.0
        gradient_checkpointing: true
    - ${libero_blueprint.pipeline.stages.4}
    - ${libero_blueprint.pipeline.stages.5}
    - _target_: egomimic.pipeline.stages_action_flow.RoutedContentDecoderStage
      route_key: embodiment
      route_aliases:
        21: libero_panda
        22: libero_panda_sharpa
      reconstruction_noising_start: ${libero_blueprint.pipeline.stages.6.reconstruction_noising_start}
      reconstruction_noising_probability: ${libero_blueprint.pipeline.stages.6.reconstruction_noising_probability}
      decoders:
        _target_: egomimic.models.mot_action_codec.make_mot_codecs
        action_dims: ${model.action_dims}
        role: decoder
        horizon: ${model.action_horizon}
        tokens: ${model.num_latent_tokens}
        latent_dim: ${model.latent_dim}
        width: ${model.hidden_dim}
        depth: 12
        heads: 8
        mlp_ratio: 4.0
        gradient_checkpointing: true
    - ${libero_blueprint.pipeline.stages.7}
callbacks:
  av_only_layer_norm:
    expected_norms_per_decoder: 48
