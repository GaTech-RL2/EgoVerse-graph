# @package _global_
defaults:
  - /experiment/pusht/action_flow_cotrain_uc_latent_fm_sg_unite_h384d12h12_sum14_cfg4_val10k_s42
  - override /data: pusht/action_flow_cotrain_usocket_chain_manual3000_val01_h16
  - override /callbacks: action_flow_avln_cotrain
  - _self_

name: action_flow_cotrain_uc_manual3000_avln_30k_s42
description: "Manual-only U-Socket 2999 plus ChainGripper 3000 Action Flow AV-LN"
model:
  _target_: egomimic.pl_utils.pl_model.ModelWrapper
  training_behavior:
    _target_: egomimic.pl_utils.training_behavior_action_flow.ActionFlowTrainingBehavior
  diagnostic_provider:
    _target_: egomimic.eval.pipeline_diagnostics.ActionFlowDiagnosticProvider
trainer:
  max_steps: 30000
  val_check_interval: 10000
  limit_val_batches: 8
callbacks:
  model_checkpoint:
    every_n_train_steps: 5000
    save_top_k: -1
run_provenance:
  train_episode_count_per_domain:
    pushshapes_sim_u_socket: 2970
    pushshapes_sim_chain_gripper: 2970
  valid_episode_count_per_domain:
    pushshapes_sim_u_socket: 29
    pushshapes_sim_chain_gripper: 30
  union_episode_count_per_domain:
    pushshapes_sim_u_socket: 2999
    pushshapes_sim_chain_gripper: 3000
  objective:
    domain_aggregation: equal_mean_from_one_batch32_per_domain
  action_contract:
    representations:
      pushshapes_sim_u_socket: x_y_cos_theta_sin_theta
      pushshapes_sim_chain_gripper: left_xy_center_xy_right_xy_points6
