# @package _global_
defaults:
  - /experiment/_shared/visual_hpt300
  # Shared parents supply task settings; these links select every component.
  - override /model: abc_arc/hpt_yam_visual
  - override /data: abc_arc/abc_visual
  - override /evaluator: eval_open_loop_sim
  - override /trainer: ddp
  - override /callbacks: checkpoints
  - override /logger: wandb
  - _self_
name: abc_multitask4_hpt300_baseline_visual_openloop
description: HPT300M ABC four-task visual-only baseline 100-frame chunks
abc:
  task_predicate: "row['task'] in ['fold and stack the towels', 'take the fake fruits out of the plastic bag', 'sort the stationery into containers', 'insert the wireless bluetooth earbuds into the charging case']"
  # Shared with the paired ARC recipe so evaluator distance settings remain
  # directly comparable even though this model predicts time-indexed actions.
  arc_distance: 0.81
  arc_rotation_distance: 0.4188790204786391
