# Match the starting robot joints to the selected replay frame.
robot:
  kind: yam
  arms:
  - left
  - right
  channels:
    left: can0
    right: can1
  gripper_type: linear_4310
  zero_gravity_mode: true
  enable_auto_recovery: false
  frequency: 30
  home_duration: 3.0
  home:
    left:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 1
    right:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    - 1
  kinematics:
    joint_names:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    site_name: tcp_site
  cameras:
    front_img_1:
      type: realsense
      enabled: true
      serial_number: ${oc.env:YAM_FRONT_SERIAL}
      height: 480
      width: 640
      fps: 30
    left_wrist_img:
      type: realsense
      enabled: true
      serial_number: ${oc.env:YAM_LEFT_WRIST_SERIAL}
      height: 480
      width: 640
      fps: 30
    right_wrist_img:
      type: realsense
      enabled: true
      serial_number: ${oc.env:YAM_RIGHT_WRIST_SERIAL}
      height: 480
      width: 640
      fps: 30
frequency: 30
max_joint_velocity: 1.0
execute_steps: 10
max_steps: 3000
preview:
  enabled: true
  width: 640
policy:
  kind: zarr_replay
  path: ???
  keys:
    left:
      joints: left.cmd_joints
      gripper: left.cmd_gripper
    right:
      joints: right.cmd_joints
      gripper: right.cmd_gripper
  chunk_size: 30
  start: 0
  stop: null
