# arcdur twin of stationery_mix5050_arcvel (Aidan 2026-09-19 18:40: "start an arc dur variant as well"): identical pool, split and 50/50
# lab-balanced sampler; only the tokenizer variant changes (duration per arc interval instead of per-waypoint speed).
# MIXED ABC + RL2, LAB-BALANCED 50/50 -- Aidan 2026-09-19: "weight the data evenly so that there is proper exposure to
# in-domain data ... RL2 consists of 50% of the data the model sees and ABC the other 50%". Explicitly authorised mix.
# Same pool filter + valid_ratio 0.01 as stationery_mix_arcvel; the ONLY change is train_dataloader_params.*.group_balance_sampler, which
# replaces the uniform frame shuffle (RL2 was ~9 % of frames for stationery, ~30 % for towels) with draws that give each lab
# half the samples, uniform over frames within a lab. Validation loaders are untouched. Do not copy this filter elsewhere.
# persistent_workers true: default re-forks loader workers each epoch and this stack deadlocks there (job 13307279).
_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper
train_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.e1_resolvers.S3EpisodeResolverWithEmbodimentOverride
      embodiment_override: yam_bimanual
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
        horizon: 200
        embodiment: yam
        drop_wrist_images: false
      transform_list:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
        variant: arcdur
        chunk_length: 200
        time_rows: 100
        min_distance_unit: 0.4
        resampled_vector_length: 100
        stride: 1
        rotation_mode: euler
        velocity_norm: path
        embodiment: yam
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row[''embodiment''] == ''yam_bimanual'' and row[''zarr_processed_path''] != ''''
        and row[''is_deleted''] == False and ((row[''lab''] == ''abc'' and row[''task''] == ''sort the
        stationery into containers'') or (row[''lab''] == ''rl2'' and row[''task''] == ''organize_stationary_updated''
        and row[''rig_name''] == ''rl2_abc''))'
    mode: train
    valid_ratio: 0.01
    bounds_check: false
    split_seed: 42
    expected_train_episode_count: null
    expected_valid_episode_count: null
    expected_train_episode_names_sha256: null
    expected_valid_episode_names_sha256: null
valid_datasets:
  yam_bimanual:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.e1_resolvers.S3EpisodeResolverWithEmbodimentOverride
      embodiment_override: yam_bimanual
      folder_path: /storage/project/r-dxu345-0/shared/egoverseS3ZarrDatasets
      image_hw:
      - 480
      - 640
      key_map:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_keymap
        horizon: 200
        embodiment: yam
        drop_wrist_images: false
      transform_list:
        _target_: egomimic.rldb.embodiment.bimanual_arc.get_transform_list
        variant: arcdur
        chunk_length: 200
        time_rows: 100
        min_distance_unit: 0.4
        resampled_vector_length: 100
        stride: 1
        rotation_mode: euler
        velocity_norm: path
        embodiment: yam
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
      - 'lambda row: row[''embodiment''] == ''yam_bimanual'' and row[''zarr_processed_path''] != ''''
        and row[''is_deleted''] == False and ((row[''lab''] == ''abc'' and row[''task''] == ''sort the
        stationery into containers'') or (row[''lab''] == ''rl2'' and row[''task''] == ''organize_stationary_updated''
        and row[''rig_name''] == ''rl2_abc''))'
    mode: valid
    valid_ratio: 0.01
    bounds_check: false
    split_seed: 42
    expected_train_episode_count: null
    expected_valid_episode_count: null
    expected_train_episode_names_sha256: null
    expected_valid_episode_names_sha256: null
train_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 7
    persistent_workers: true
    group_balance_sampler:
      group_episode_files:
        rl2: /storage/project/r-dxu345-0/agao81/EgoVerse-graph/egomimic/hydra_configs/data/abc_arc/rl2_stationery_episodes.txt
      default_group: abc
      group_fractions:
        rl2: 0.5
        abc: 0.5
      seed: 42
valid_dataloader_params:
  yam_bimanual:
    batch_size: 32
    num_workers: 7
    persistent_workers: true
