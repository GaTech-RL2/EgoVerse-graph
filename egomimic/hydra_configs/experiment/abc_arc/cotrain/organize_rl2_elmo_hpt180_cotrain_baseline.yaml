# @package _global_
# HPT300 cotrain baseline resized to the 180M proportions of the stationery
# tempo grid (yam_arc_grid/scratch_rl2_stattempo_*: h640 t8, flow d384x10),
# keeping the ResNet-MLP image stems. 182.5M parameters.
defaults:
  - /experiment/abc_arc/cotrain/organize_rl2_elmo_hpt300_cotrain_baseline
  - _self_
name: organize_rl2_elmo_hpt180_cotrain_baseline
description: HPT180 ResNet-MLP stems, robot + human cotraining, 100-frame chunks
hpt:
  embed_dim: 640
  num_blocks: 8
  num_heads: 8
  flow_blocks: 10
  flow_hidden_dim: 384
  stem_specs:
    cross_attn:
      crossattn_dim_head: 80
abc:
  # ARC read window in native frames; only ARC horizons use it.
  arc_source_buffer_frames: 400
logger:
  wandb:
    tags: [hpt180m, resnet_mlp, rl2, organize_stationary, elmo, cotrain, human_bimanual, baseline, open_loop, video]
