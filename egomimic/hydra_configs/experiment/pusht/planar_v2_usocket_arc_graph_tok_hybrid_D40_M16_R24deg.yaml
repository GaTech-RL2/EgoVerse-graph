# @package _global_
# U-Socket hybrid arc tokenization as graph nodes.
#
# D_translation = 40 px and D_rotation = 24 degrees are the established
# average dense-chunk spans from the U-Socket normalization analysis.  The
# tokenizer stores the angular cap in its chordal metric:
# sqrt(2) * sin(radians(24) / 4) = 0.14776.
defaults:
  - /experiment/pusht/planar_v2_usocket_base
  - override /model: bf/bf_planar_v2_arc_graph_tok
  - _self_

name: planar_v2_usocket_arc_graph_tok_hybrid_D40_M16_R24deg
description: u_socket_arc_graph_hybrid_D40_M16_R24deg_DDIM100_obs1

planar:
  # The tokenizer reads a dense window long enough to cover the 40 px cap and
  # emits M=16 waypoints plus one timing row.
  raw_action_horizon: 40
  action_horizon: 16
  arc_distance: 40.0
  arc_waypoints: 16
  arc_rotation_radius: 0.0
  hybrid_rotation_unit: 0.14776
  arc_dt: 0.0333333333333333
  arc_token_rows: 17
  eval_native_decoder:
    _target_: egomimic.pipeline.pushshapes.PlanarArcWaypointZeroNativeDecoder
    resampled_vector_length: ${planar.arc_waypoints}
    native_action_dim: 3
