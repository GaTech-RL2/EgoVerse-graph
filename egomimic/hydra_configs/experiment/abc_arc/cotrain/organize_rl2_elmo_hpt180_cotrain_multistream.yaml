# @package _global_
# Multistream ARC twin of organize_rl2_elmo_hpt180_cotrain_baseline: same
# 182.5M model and 400-frame ARC read window.
defaults:
  - /experiment/abc_arc/cotrain/organize_rl2_elmo_hpt300_cotrain_multistream
  - _self_
name: organize_rl2_elmo_hpt180_cotrain_multistream
description: HPT180 ResNet-MLP cotraining, multistream ARC D0.42 R24deg M100 duration clocks
hpt:
  embed_dim: 640
  num_blocks: 8
  num_heads: 8
  flow_blocks: 10
  flow_hidden_dim: 384
  stem_specs:
    cross_attn:
      crossattn_dim_head: 80
abc:
  arc_source_buffer_frames: 400
logger:
  wandb:
    tags: [hpt180m, resnet_mlp, rl2, organize_stationary, elmo, cotrain, human_bimanual, multistream, D042, R24deg, M100, duration_clock, buf400, open_loop, video]
