defaults:
  - submitit_slurm

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

name: ${hydra.job.name}
partition: loaner
account: loaner
cpus_per_task: 28
nodes: ${launch_params.nodes}
tasks_per_node: ${launch_params.gpus_per_node}
gres: gpu:h100:8
timeout_min: 2880
additional_parameters:
  requeue: true
  exclusive: true
  signal: B:USR1@120
