        or '''') != '''' and any(s in ((row.get(''task_description'') or '''').lower()) for s in (''base'', ''object''))
        and (row.get(''episode_hash'') or '''') not in (''2026-04-26-00-17-53-000000'', ''2026-04-26-00-27-26-000000'',
        ''2026-05-01-02-52-58-000000'')'
    mode: valid
