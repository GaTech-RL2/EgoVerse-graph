# @package _global_
defaults:
  - /experiment/e1/yam_human_matched_af64_multiplier
  - _self_
name: yam_human_matched_dp_multiplier
model:
  training_behavior:
    _target_: egomimic.pl_utils.training_behavior.TrainingBehavior
  diagnostic_provider: null
  pipeline:
    _target_: egomimic.pipeline.stages_matched_dp.build_matched_dp_pipeline
    dp_inference_steps: 50
    dp_down_dims: [512,1024,2048]
evaluator:
  action_flow_diagnostics:
    enabled: false
  energy_score_provenance:
    sampler: ddim
    sampler_steps: 50
run_provenance:
  architecture:
    family: shared_paper_unet_native_private_io_hpt_observation
    latent_shape: null
    private_codec: none_native_epsilon_prediction
    denoiser: shared_PaperConditionalUnet1D_512_1024_2048
    parameter_count_candidate: null
  inference:
    sampler: ddim
    steps: 50
  objective:
    method: native_action_epsilon_prediction
    reconstruction_is_optimizer_objective: false
