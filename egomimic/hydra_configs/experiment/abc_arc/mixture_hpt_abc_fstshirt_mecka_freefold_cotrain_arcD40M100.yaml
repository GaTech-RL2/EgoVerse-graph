# @package _global_
# Capacity-matched mixture of transformer trunks and flow heads.
# Stems are shared; shape and clock each receive a separate half-depth trunk
# and half-depth prediction head. Duration mode is used for the clock target.
defaults:
  - /experiment/abc_arc/hpt_qwen_300M_knobs
  - override /model: abc_arc/mixture_hpt_abc_cotrain_300M_qwen_pooled_arc_D40_M100
  - override /data: abc_arc/abc_fstshirt_mecka_freefold_arc_cotrain_D40_M100
  - override /evaluator: eval_arc_bimanual_cartesian_D40_M100
  - override /hydra/launcher: submitit_ice
  - _self_

name: mixture_hpt_abc_fstshirt_mecka_freefold_cotrain_arcD40M100
description: shared stems, split shape/clock transformer trunks and heads

paths:
  dataset_dir: ${oc.env:EGOVERSE_ABC_DATASET_DIR,/storage/cedar/cedar0/cedarp-dxu345-0/egoverse-graph-data/abc_arc}

launch_params:
  gpus_per_node: 1
  nodes: 1

trainer:
  max_steps: 240000
  max_epochs: -1
  min_epochs: null
  val_check_interval: 10000
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
  log_every_n_steps: 10

norm_stats:
  norm_mode: quantile
  sample_frac: 0.05

abc:
  arc_token_rows: 200
  arc_distance: 0.40
  arc_waypoints: 100
  arcmatch_points: 32
  arc_chunk_rows: 45
  arc_velocity_mode: duration
  action_horizon: 100
  rot_lever_m: 0.1

logger:
  wandb:
    id: null
    project: abc-yam
    tags:
      - abc
      - cotrain
      - arc
      - mixture-transformer
      - split-shape-clock
