trainer:
  max_steps: 150000
  val_check_interval: 10000
  limit_val_batches: 8
  precision: bf16-mixed
  gradient_clip_val: 3.0
  gradient_clip_algorithm: norm

norm_stats:
  norm_mode: minmax
  reduce_all_but_last: true
  sample_frac: 1.0
  precomputed_norm_path: null

callbacks:
